name: ocideck_form_core
description: "Pure-Dart core of OciDeck form documents: marker grammar, rule engine, packages. No Flutter."
publish_to: 'none'
version: 0.0.1
repository: https://pawprint.vigilis.online/LibreKAT/Ocideck
issue_tracker: https://pawprint.vigilis.online/LibreKAT/Ocideck/issues

environment:
  sdk: ^3.12.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  test: ^1.25.0
dependencies:
  archive: ^4.0.9
  characters: ^1.4.1
  crypto: ^3.0.0
  # Ed25519 for the bundle (form_bundle.dart); dartage uses it too. Same constraint as the app.
  cryptography: ^2.9.0
  # Exact pin, no caret: a 0.x cryptographic library does not float. Only form_seal.dart
  # imports it (the check_packages gate keeps it so). See FORM_INTAKE.md §5.6.
  # It needs Dart 3.13; the toolchain pin (.tool-versions) ships 3.13.5. The `sdk` above stays
  # as the root's: raising it to ^3.13.0 switches `dart format` to the newer style and
  # rewrites half the repository, which is a change of its own.
  dartage: 0.3.0
