# Regels voor de ZAP-basisscan (`make dast`).
#
# Formaat: <regel-id> <TAB> IGNORE|WARN|FAIL <TAB> toelichting
#
# De scheidslijn hieronder is bewust scherp: alleen wat de *wegwerpserver*
# veroorzaakt gaat op IGNORE. Alles wat een echte host moet beantwoorden blijft
# zichtbaar, ook al is het bij een lokale scan niet op te lossen — juist dán is
# de lijst nog waard iets te zeggen zodra er wél ergens gepubliceerd wordt.

# ── Artefacten van `python3 -m http.server` ──────────────────────────────────
10036	IGNORE	Server-header lekt versie: dat is de Python-testserver, niet de bundel.
10049	IGNORE	Cache-headers van de testserver; statische hosting zet die zelf.
10109	IGNORE	"Modern Web Application" is een constatering, geen bevinding.

# ── Vals-positief ────────────────────────────────────────────────────────────
# De triggerwoorden (`from`, `select`, `user`) komen uit de geminificeerde
# main.dart.js, niet uit echt commentaar; index.html en flutter_bootstrap.js
# bevatten er geen. Geen lek, geen actie mogelijk aan de broncode.
10027	IGNORE	"Suspicious Comments": woorden uit de geminificeerde main.dart.js, geen commentaar.

# ── Blijft zichtbaar: dit moet een echte host beantwoorden ───────────────────
# De bundel levert deze nu als Apache `.htaccess` mee (zie web/.htaccess): een
# host met mod_headers + AllowOverride stuurt CSP-header, X-Frame-Options,
# Permissions-Policy en HSTS wél. De wegwerpscan hier draait tegen
# `python3 -m http.server`, die niets van dat alles stuurt, dus deze blijven bij
# een lokale scan opduiken — en juist dán is het de moeite waard dat de lijst
# ze noemt. Op IGNORE zetten zou de bewaking op een échte host de mond snoeren.
# 10038  CSP-header niet gezet. De bundel levert de CSP als meta-tag én, voor
#        Apache, als header via web/.htaccess. Statische hosting op zich kan geen
#        headers zetten; zie web/index.html voor waarom frame-ancestors alleen
#        als header afdwingbaar is.
# 10055  CSP-richtlijn zonder terugval. Reëel: form-action valt niet terug op
#        default-src. Staat in de policy op 'none'; de wegwerpserver stuurt geen
#        CSP-header, dus de melding blijft lokaal zichtbaar.
# 10063  Permissions-Policy — nu in web/.htaccess, maar alleen als header, dus
#        een hostingpunt dat de wegwerpserver niet dekt.
# 90004  Cross-Origin-Embedder-Policy — bewust niet meegeleverd: `require-corp`
#        kan cross-origin resources breken en vraagt eerst een test.
