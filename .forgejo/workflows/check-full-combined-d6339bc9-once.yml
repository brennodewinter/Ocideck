name: Exact J canonical check-full once
on:
  push:
    branches: [codex/check-full-combined-d6339bc9-once]
permissions:
  contents: read
env:
  QA_PLAN: |
    {
      "reviewed": true,
      "source": "d6339bc9c652d7222d82a358d67bf4f61d90679a",
      "source_ref": "codex/fix-release-assets-listing-077",
      "qa_parent": "0bcad3c24b83c1a7c425ee93125218dff5670fd3",
      "qa_branch": "codex/check-full-combined-d6339bc9-once",
      "qa_file": ".forgejo/workflows/check-full-combined-d6339bc9-once.yml",
      "issue": 2820,
      "SDK": "/Users/brennodewinter/Library/Caches/OciDeckRunner/toolchains/flutter-3.47.7-abaf9c523780",
      "SDK_commit": "abaf9c523780a608bd46686fd5e53740a07077f8",
      "tester_sha256": "7ee9b703ceab0c542f2e0d01474c044f2f9590ff1b17a07c472918792d36c94f",
      "Q": "/Users/brennodewinter/Library/Caches/OciDeckRunner/release-qa/controller-C",
      "warm_previous": "e5500074b71b2936cd01dd9dfe8c5e154a95a835",
      "PUB": "/Users/brennodewinter/Library/Caches/OciDeckRunner/pub-cache/flutter-3.47.7-abaf9c523780",
      "TMP": "/private/var/tmp/oci077-jd6339bc9",
      "TEST_JOBS": 2,
      "minimum_free_bytes": 17179869184,
      "expected_cpu_count": 12,
      "minimum_memory_bytes": 19327352832,
      "source_push_authorized": true,
      "queue_authorized": true
    }
jobs:
  canonical-check-full-J:
    runs-on: ocideck-macos-arm64
    timeout-minutes: 790
    steps:
      - name: Refuse an unreviewed gate plan
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          p=json.loads(os.environ['QA_PLAN'])
          assert p['reviewed'] is True and p['source']=='d6339bc9c652d7222d82a358d67bf4f61d90679a' and p['qa_parent']=='0bcad3c24b83c1a7c425ee93125218dff5670fd3' and p['TEST_JOBS']==2
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d6339bc9c652d7222d82a358d67bf4f61d90679a
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source and existing pinned native stage
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,pathlib,os
          p=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.native-web-mode-gate';p.mkdir(mode=0o700)
          payload={'prepare.py': '', 'record.py': '', 'gate.sh': '', 'collect.py': ''}
          expected={'prepare.py': 'c1b580fd6b54b1cb253f83a95b709ffb707eb6786eab02411ccc8975ef053790', 'record.py': 'ce41ea510d6755a297d2f5af5e8ac25ac097a950b8ec667aa00fcd5f2e0888ca', 'gate.sh': '036eb05c91bf07e20ec094413385c6e6507738af0f51c7bdcc063e4997eccdf2', 'collect.py': '87238c516755c8ccafa36b7d7488f55d60aabc98e5226067bed9e2c26d15108b'}
          for name,value in payload.items():
           content=base64.b64decode(value);assert hashlib.sha256(content).hexdigest()==expected[name]
           with (p/name).open('xb') as f:f.write(content)
          PY
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/.native-web-mode-gate/prepare.py"
      - name: Direct canonical make check-full and durable actual exits
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.native-web-mode-gate/gate.sh"
      - name: Preserve and qualify complete actual gate evidence
        if: ${{ always() }}
        shell: bash
        run: |
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/.native-web-mode-gate/collect.py"
      - name: Upload complete native J evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: native-web-mode-check-full-J
          path: native-check-full-web-modes/**
          if-no-files-found: error
          retention-days: 90
