# De uitbrengpoort van OciDeck, in CI (#741, #790). Zelfde poort als lokaal:
# `make check`. De Flutter-versie komt uit .tool-versions — de workflow leest
# de pin, dus een pin-bump heeft hier geen tweede plek om te vergeten — en de
# tarball is de officiële stable-release, sha256-geverifieerd tegen het
# release-manifest. Een kant-en-klaar Flutter-image (cirruslabs) is bewust
# vermeden: dat bleek kanaal "[user-branch]" uit onbekende bron te bevatten,
# en check-toolchain (onderdeel van make check) keurt precies dat af.
#
# **Waarom er ook gecachet wordt.** Een fors deel van de runtijd ging elke keer
# opnieuw op aan dezelfde tarball ophalen en met `xz` uitpakken — werk dat per
# definitie hetzelfde resultaat geeft, want de sleutel is de gepinde versie. Nu
# de poort zeldzamer draait is dat minder vaak winst, maar het blijft: de cache
# neemt die stap weg en vervangt géén controle. `check-toolchain` draait binnen
# `make check` op de herstelde boom en eist onverkort kanaal `stable`, de
# officiële herkomst en gelijkheid met de pin. Een cache die iets anders bevat valt dus om op dezelfde poort die
# destijds het cirruslabs-image afkeurde.
#
# De eerlijke grens daarbij: die cache wordt geschreven door onze eigen jobs op
# onze eigen runner. Wie de runner beheert, beheert de cache — dat is dezelfde
# vertrouwensgrens als de runner zelf, niet een nieuwe.
#
# De cachestappen staan op `continue-on-error`. Spreekt de forge de cache-API
# van deze actie niet, dan verliezen we de versnelling en verder niets: de
# installatiestap hieronder draait dan gewoon, en de poort blijft de poort.
name: ci

# **Draait op een tag, niet op elke PR (#790).** Een poortrun kostte 22 minuten
# op deze runner tegen 2,5 minuut lokaal, en die wachttijd per PR woog niet op
# tegen wat hij toevoegde: `make check` is dezelfde poort en draait hier al
# vóór elke push.
#
# Wat dat betekent, hardop, want het is een echte verschuiving: CI is hiermee
# géén samenvoegpoort meer maar een **uitbrengpoort**. Valt hij op een tag om,
# dan staat het probleem al op main. De borging vóór main is vanaf nu volledig
# `make check` op de machine van de committer — zie CONTRIBUTING.md en
# docs/CHECKS.md, waar dat nu ook zo staat in plaats van te verwijzen naar een
# CI die het wel opvangt.
#
# `workflow_dispatch` blijft, zodat een tak alsnog door de poort kan zonder een
# tag te hoeven zetten.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  gate:
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      # Vóór de checkout: actions/checkout is een node-actie, en dit kale
      # image brengt geen node mee.
      - name: Gereedschap installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs make git curl ca-certificates xz-utils jq unzip

      - uses: actions/checkout@v4

      # De pin is de cachesleutel, dus hij wordt één keer gelezen en daarna
      # hergebruikt — niet twee keer met hetzelfde `sed`.
      - name: Gepinde Flutter-versie lezen
        id: pin
        run: |
          set -eu
          VERSION="$(sed -n 's/^flutter \(.*\)-stable$/\1/p' .tool-versions)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Sleutel = de gepinde versie. Een pin-bump is dus automatisch een nieuwe
      # cache; er is geen sleutel die stil bij een oude toolchain blijft staan.
      # Deze cache draagt óók wat Flutter tijdens de run zelf binnenhaalt
      # (bin/cache), want dat zit onder hetzelfde pad.
      - name: Flutter uit de cache
        id: flutter-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-linux-${{ steps.pin.outputs.version }}-stable

      - name: Officiële Flutter volgens de pin
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          VERSION="${{ steps.pin.outputs.version }}"
          ARCHIVE="flutter_linux_${VERSION}-stable.tar.xz"
          BASE="https://storage.googleapis.com/flutter_infra_release/releases"
          curl -fsSLo /tmp/releases.json "$BASE/releases_linux.json"
          SHA=$(jq -r --arg v "$VERSION" \
            '.releases[] | select(.channel=="stable" and .version==$v) | .sha256' \
            /tmp/releases.json)
          test -n "$SHA"
          curl -fsSLo "/tmp/$ARCHIVE" "$BASE/stable/linux/$ARCHIVE"
          echo "$SHA  /tmp/$ARCHIVE" | sha256sum -c -
          tar -xJf "/tmp/$ARCHIVE" -C /opt
          rm "/tmp/$ARCHIVE"

      # Apart van de installatie: dit moet óók gebeuren als de cache raak was.
      - name: Flutter op het pad
        run: |
          set -eu
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      # De pakketten volgen `pubspec.lock` letterlijk; verandert er één
      # afhankelijkheid, dan is dat een nieuwe sleutel. De terugvalsleutel
      # levert dan nog steeds de vorige set, zodat pub alleen het verschil
      # ophaalt in plaats van alles.
      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: De poort
        run: make check
