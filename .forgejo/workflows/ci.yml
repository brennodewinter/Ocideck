# De kwaliteitspoort van OciDeck, in CI (#741). Zelfde poort als lokaal:
# `make check`. De toolchain komt uit `.forgejo/actions/flutter`: de officiële
# stable volgens de pin in .tool-versions, sha256-geverifieerd — daar staat ook
# waarom er geen kant-en-klaar Flutter-image wordt gebruikt.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      # Vóór de checkout: actions/checkout is een node-actie, en dit kale
      # image brengt geen node mee.
      - name: Gereedschap installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs make git curl ca-certificates xz-utils jq unzip

      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/flutter

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: De poort
        run: make check
