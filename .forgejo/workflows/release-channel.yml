# Disposable runtime proof only: no application build, artifact execution or publication.
name: Release CPU limit canary
on:
  workflow_dispatch:
    inputs:
      tag: {required: true}
      source_sha: {required: true}
      frozen_ref: {required: true}
      channel: {required: true}
      operation_id: {required: true}
concurrency:
  group: release-cpu-canary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canary:
    # Keep the Docker job name equal to GITHUB_JOB even after server matrix expansion.
    name: canary
    runs-on: docker
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: ci8
            image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
            memory_gib: 8
          - profile: ci4
            image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
            memory_gib: 4
          - profile: deb
            image: pawprint.vigilis.online/librekat/ocideck-consumer-deb@sha256:5d9c9a9bf0e29ef55ce16476b5c19b18d5eac612648d8721743cb98bcec4787c
            memory_gib: 4
          - profile: debian12
            image: pawprint.vigilis.online/librekat/ocideck-consumer-debian12@sha256:396e3b6ca9b3c4fb37bb30b65f82f60f2edc0d7a3a8d6bd9cc614847b0d59fab
            memory_gib: 4
          - profile: rpm
            image: pawprint.vigilis.online/librekat/ocideck-consumer-rpm@sha256:6124a96e54d66b072ec2c5a8b947ab9feaea600397b154e9795c52b2996fc06f
            memory_gib: 4
          - profile: appimage
            image: pawprint.vigilis.online/librekat/ocideck-consumer-appimage@sha256:eb5c0c2f2e828a53dbfc05ce38da0123ebce67ea99aa4ffa7e2a9fdffd9a786e
            memory_gib: 4
          - profile: flatpak
            image: pawprint.vigilis.online/librekat/ocideck-consumer-flatpak@sha256:49b3dda73f9aa832a8640ea3e3b1e20dbe47e9445c556bc1b2198d5332adecaf
            memory_gib: 4
          - profile: tar
            image: pawprint.vigilis.online/librekat/ocideck-consumer-tar@sha256:b8d58795d5ac4d4ce0f397912ba285d02a43334c3fe522f07175154d9d126b6d
            memory_gib: 4
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory ${{ matrix.memory_gib }}g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller
      - name: Enforce and verify only this container's CPU limit
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_IMAGE: ${{ matrix.image }}
          EXPECTED_MEMORY_GIB: "${{ matrix.memory_gib }}"
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          test "$GITHUB_JOB" = canary
          mkdir -p cpu-proof
          echo '9324f3ec6a7e6f989224938b47f806e3d0dafb52c5262c7c9e22ca83a7d8b68d  controller/tool/enforce_release_cpu.cjs' | sha256sum -c -
          sha256sum controller/tool/enforce_release_cpu.cjs > cpu-proof/helper.sha256
          printf '%s\n' "$PROFILE" > cpu-proof/profile.txt
          node controller/tool/enforce_release_cpu.cjs > cpu-proof/receipt.json
          cat cpu-proof/receipt.json
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        if: ${{ always() }}
        with:
          name: cpu-canary-${{ matrix.profile }}
          path: cpu-proof/*
          if-no-files-found: error
          retention-days: 90
