        run: python3 tool/release_channel.py create --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --controller-sha "$GITHUB_SHA" --channel "$CHANNEL" --run-id "$GITHUB_RUN_ID" --dist dist --output "dist/channel-manifest-$CHANNEL.json"
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
