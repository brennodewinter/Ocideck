# Disposable runtime proof only: no app build, candidate execution or publication.
# Two explicit dependency chains limit this run to at most two active canary jobs.
name: Release CPU limit canary 2
on:
  workflow_dispatch:
    inputs:
      tag: {required: true}
      source_sha: {required: true}
      frozen_ref: {required: true}
      channel: {required: true}
      operation_id: {required: true}
concurrency:
  group: release-cpu-canary2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci8:
    name: ci8
    runs-on: docker
    timeout-minutes: 10
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
      options: --cpus 2 --memory 8g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller
      - name: Enforce and verify only this container's CPU limit
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_IMAGE: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
          EXPECTED_MEMORY_GIB: "8"
        run: |
          set -eu
          test "$GITHUB_JOB" = ci8
          mkdir -p cpu-proof
          echo '14d425ea8dd5001bb194a5f7098f7d5a13f5b0639fbe6c7ebe9a4a7e5254e829  controller/tool/enforce_release_cpu.cjs' | sha256sum -c -
          sha256sum controller/tool/enforce_release_cpu.cjs > cpu-proof/helper.sha256
          printf '%s\n' 'ci8' > cpu-proof/profile.txt
          node controller/tool/enforce_release_cpu.cjs > cpu-proof/receipt.json
          cat cpu-proof/receipt.json
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        if: ${{ always() }}
        with:
          name: cpu-canary2-ci8
          path: cpu-proof/*
          if-no-files-found: error
          retention-days: 90

  consumer-deb:
    name: .deb proef op een schone Ubuntu
    needs: [ci8]
    if: ${{ always() }}
    runs-on: docker
    timeout-minutes: 10
    container:
      image: pawprint.vigilis.online/librekat/ocideck-consumer-deb@sha256:5d9c9a9bf0e29ef55ce16476b5c19b18d5eac612648d8721743cb98bcec4787c
      options: --cpus 2 --memory 4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
