# De release-keten van OciDeck: één tag, vier platformen en een live webversie.
#
# Draait op de forge (Pawprint) en dat is met opzet: de forge is de bron, en de
# downloads horen te staan waar de broncode staat. Eén uitzondering — Windows.
# Apple licenseert macOS alleen op Apple-hardware (vandaar de Mac-runner) en
# voor Windows is er hier geen machine. Die build komt van de GitHub-spiegel en
# wordt hier opgehaald en meeverpakt, zodat een bezoeker toch één vindplaats
# heeft. Het OPHALEN vraagt geen token (een release-asset is een publieke URL);
# het STARTEN wel — `windows-ophalen` dispatcht sinds v0.3.6 de spiegel-build
# actief via `GH_DISPATCH_TOKEN` i.p.v. te hopen dat de tag-push hem triggert.
#
# Wat er ontstaat bij `git push origin v0.1.0`:
#
#   web      → geharde bundel, plus de live deploy naar ocideck.librekat.nl
#   linux    → x64-bundel als tar.gz
#   macos    → .app als zip (op de Mac-runner)
#   windows  → opgehaald van de spiegel
#   publiceren → een Forgejo-release met alles eraan, plus SBOM en SHA256SUMS
#   website  → de download-verwijzingen in de website-repo bijgewerkt; die repo
#              zet zichzelf live met een eigen deploy-workflow
#
# Ondertekening: de macOS-app wordt op de Mac-runner getekend en genotariseerd
# (Developer ID + notarytool; zie de macos-job en docs/BUILD.md), mits het
# certificaat en het notarytool-profiel daar in de keychain staan — anders valt
# die job terug op een ongetekende build met een luide waarschuwing. Windows en
# Linux worden (nog) niet getekend; voor Windows klaagt SmartScreen. Daarom
# houdt de releasetekst (.forgejo/release-body.md) de openen-instructie per
# platform aan, zolang dat platform ongetekend is.
name: release

on:
  push:
    tags: ["v*"]
  # Handmatig starten kan, maar alleen op een tag-ref: een release die naar een
  # branch wijst heeft geen betekenis, en de versienaam komt hier uit de ref.
  workflow_dispatch:

jobs:
  web:
    name: Web bouwen
    runs-on: docker
    # Voorgebakken CI-image i.p.v. kaal ubuntu (#1170): OS, node, de
    # build-toolchain (cmake/build-essential voor de dartcv4-OpenCV-hook, #870) en
    # de gepinde, sha256-geverifieerde Flutter zitten er al in, dus de per-run-
    # installatie én de Flutter-download vervallen. Het tag ís de Flutter-pin;
    # `check-toolchain` (in de gate op ditzelfde image) bewaakt dat het niet
    # afdrijft. De web-engine-artefacten zijn niet voorgebakken (`--no-web` in het
    # image) en worden bij `flutter build web` opgehaald — een kleine download.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.44.8
    steps:
      - uses: actions/checkout@v4

      - name: Alleen op een tag
        run: |
          test "${{ github.ref_type }}" = "tag" || {
            echo "Deze workflow hoort op een tag te draaien, niet op '${{ github.ref_name }}'." >&2
            echo "Start hem opnieuw met een tag-ref, of push een tag." >&2
            exit 1
          }

      # De werkkopie is van een andere uid dan root; zonder dit weigert git en
      # falen stappen die git aanroepen. Op het kale image deed de Flutter-
      # composite-actie dit voor /opt/flutter; Flutter staat nu al klaar, dus we
      # zetten alleen de werkkopie op safe (zoals de gate-workflows).
      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Dezelfde cache-sleutels als linux-gate/static-gate, met opzet. De
      # Linux-poort draait op elke push naar main en vult die caches dus onder
      # main-scope; main-scope-caches zijn leesbaar vanuit een tag-build, dus bij
      # het snijden van een tag staat de dure dartcv-OpenCV-compile hier al warm
      # i.p.v. from-scratch. `continue-on-error`: valt de cache-API weg of mist de
      # sleutel, dan bouwt de stap gewoon opnieuw — precies het gedrag van nu.
      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dartcv-linux-

      # Dezelfde poort die elke push krijgt, plus de hardingscontrole. Een tag
      # mag geen artefact uitleveren dat langs de controles is geglipt: dit is
      # het enige moment waarop de bundel de deur uit gaat.
      - name: Bouwen en harding controleren
        run: make check-web

      - name: Bundel inpakken
        run: |
          VERSIE="${GITHUB_REF_NAME#v}"
          tar -C build/web -czf "ocideck-web-$VERSIE.tar.gz" .
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-web
          path: ocideck-web-${{ env.VERSIE }}.tar.gz

  deploy-web:
    name: Webversie live zetten
    needs: web
    # Alleen een échte versie gaat live. Een semver-voorloper (`v0.1.0-rc1`,
    # alles met een streepje) bouwt en publiceert wél, maar laat
    # ocideck.librekat.nl met rust — anders is er geen manier om deze hele
    # keten één keer te oefenen zonder de publieke demo te raken.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      # Eerst kijken of de deploy-secrets er zijn. Zo niet, dan slaat deze job
      # netjes over — hij faalt er NIET op. Dat is nu de bedoeling: de webversie
      # wordt voorlopig met de hand gedeployd (`make deploy-web`). Een hard
      # `exit 1` zou bij elke echte tag een rode job + faalmail geven terwijl de
      # release verder compleet publiceert (de desktop-downloads hangen niet aan
      # de webhost). Zet beide secrets zodra het automatisch mag; dan zet deze
      # job de webversie weer vanzelf live. De check staat vooraan zodat we bij
      # overslaan geen flutter-toolchain optuigen voor niets.
      - name: Zijn de deploy-secrets aanwezig?
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -n "${DEPLOY_SSH_KEY:-}" ] && [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Geen DEPLOY_SSH_KEY/DEPLOY_KNOWN_HOSTS ingesteld — de webversie wordt"
            echo "niet automatisch live gezet. Dat is nu de bedoeling: deployen gebeurt"
            echo "met de hand (make deploy-web, zie docs/HOSTING.md). De release zelf"
            echo "publiceert hoe dan ook compleet; deze job slaat alleen de live-stap over."
            # De job-conclusie is verder gewoon 'success', en dan leest een groene
            # job als "web staat live" terwijl er niets gedeployd is. Zet de skip
            # daarom zichtbaar op de run-samenvatting, niet alleen in de staplog.
            {
              echo "### ⏭️ Web NIET live gezet"
              echo ""
              echo "De release-artefacten (incl. de webbundel als download) zijn compleet,"
              echo "maar \`ocideck.librekat.nl\` is **niet** automatisch bijgewerkt:"
              echo "\`DEPLOY_SSH_KEY\`/\`DEPLOY_KNOWN_HOSTS\` ontbreken (bewust)."
              echo ""
              echo "Zet de webversie met de hand live: \`make deploy-web\` (zie docs/HOSTING.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gereedschap installeren
        if: steps.check.outputs.deploy == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs make git curl ca-certificates xz-utils jq openssh-client

      - uses: actions/checkout@v4
        if: steps.check.outputs.deploy == 'true'

      - uses: actions/download-artifact@v3
        if: steps.check.outputs.deploy == 'true'
        with:
          name: ocideck-web

      # Bewust de gedownloade bundel uitpakken in plaats van opnieuw te bouwen:
      # dan deployt deze job precies het artefact dat straks ook als download
      # aan de release hangt. Twee keer bouwen zou twee bundels opleveren die
      # niemand meer naast elkaar legt.
      - name: Bundel uitpakken op de plek waar het script hem verwacht
        if: steps.check.outputs.deploy == 'true'
        run: |
          VERSIE="${GITHUB_REF_NAME#v}"
          mkdir -p build/web
          tar -C build/web -xzf "ocideck-web-$VERSIE.tar.gz"

      # Voor `pack_web_release.dart --check`: die verifieert dat SHA256SUMS
      # precies de bestanden beschrijft die er liggen — nu dus over de bundel
      # zoals hij door de artifactopslag is gekomen, niet zoals hij is gebouwd.
      - uses: ./.forgejo/actions/flutter
        if: steps.check.outputs.deploy == 'true'

      - name: Afhankelijkheden ophalen
        if: steps.check.outputs.deploy == 'true'
        run: flutter pub get

      - name: Sleutel klaarzetten
        if: steps.check.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Geen ssh-keyscan: dat vertrouwt de sleutel die je op dat moment
          # krijgt, en dat is precies de aanname die een man-in-the-middle
          # nodig heeft. De hostsleutel hoort vooraf vast te liggen.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Live zetten
        if: steps.check.outputs.deploy == 'true'
        run: scripts/deploy_web.sh

  linux:
    name: Linux bouwen
    runs-on: docker
    # Voorgebakken CI-image i.p.v. kaal ubuntu (#1170): toolchain + Flutter +
    # Linux-desktop-precache zitten erin. Het image is echter voor de TEST-gates
    # gebouwd en mist twee libs die alléén de desktop-build linkt — die vullen we
    # hieronder aan. De rest (clang/cmake/ninja/pkg-config/libgtk-3-dev/
    # build-essential/node) is ingebakken.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.44.8
    steps:
      # liblzma-dev + libsecret-1-dev: nodig voor `make build-linux`
      # (flutter_secure_storage linkt libsecret; lzma voor compressie), maar niet
      # voor de test-gates, dus ze zitten niet in het image. build-essential/clang/
      # cmake/ninja/pkg-config/libgtk-3-dev zitten er wél al in. `rpm` levert
      # rpmbuild voor het .rpm-pakket (#1227); dpkg-deb voor het .deb zit al in het
      # basissysteem, en appimagetool haalt het pakketscript sha256-geverifieerd op.
      # `file` lijkt triviaal maar zit niet in het kale ubuntu:24.04-image, en
      # appimagetool weigert zonder ("file command is missing but required") — dat
      # brak de eerste Linux-pakketrun (v0.3.3). Zonder deze regel valt de hele
      # `publiceren`-job weg (die needt `linux`) en verschijnt er geen release.
      - name: Ontbrekende Linux-buildlibs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends liblzma-dev libsecret-1-dev rpm file

      - uses: actions/checkout@v4

      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Gedeelde cache-sleutels met de gates (zie de web-job): linux-gate draait
      # op elke push naar main en vult deze onder main-scope, die een tag-build
      # mag lezen — zo staat de dartcv-OpenCV-compile hier warm. `continue-on-error`
      # → mist de cache, dan bouwt het gewoon opnieuw, als vanouds.
      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dartcv-linux-

      - name: Linux-release bouwen
        run: make build-linux

      - name: Bundel inpakken
        # In één versiemap ocideck-<versie>/, niet los in de huidige map: pakte
        # je de tarball anders uit, dan spatte de hele bundel (./ocideck,
        # ./lib/…) over de map waarin je stond (issue #904). --transform
        # hernoemt de bovenste padcomponent `bundle` naar `ocideck-<versie>`;
        # het anker ^bundle raakt geen symlink-doelen, want die beginnen daar
        # nooit mee. Alles landt in dist/ zodat één artifact zowel de tarball als
        # de pakketten draagt en ze in `publiceren` weer samen in dist/ komen.
        run: |
          VERSIE="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -C build/linux/x64/release \
            --transform "s,^bundle,ocideck-$VERSIE," \
            -czf "dist/ocideck-linux-x64-$VERSIE.tar.gz" bundle
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Linux-pakketten bouwen (AppImage/.deb/.rpm)
        # Phase 1 van de Linux-installatieroute (#1227, docs/design/LINUX_PACKAGING.md):
        # naast de rauwe tarball een AppImage, een .deb en een .rpm — losse assets
        # aan de release, geen store en geen sandbox. appimagetool zit in geen
        # distro, dus het pakketscript haalt het op en toetst het tegen deze
        # sha256. De hash ÍS de pin: draait de `continuous`-build upstream weg, dan
        # faalt de download hier hoorbaar in plaats van stil een ander binary te
        # draaien. Daarom staat appimagetool niet als *_VERSION in de pin-manifest
        # (een content-hash veroudert niet in stilte); bij een sha-mismatch: haal
        # de nieuwe digest uit de GitHub-release-API en werk hem hier bij.
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          OUT: dist
        run: make package-linux VERSION="$VERSIE"

      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-linux
          # Alle vier de Linux-assets in één artifact. De gemeenschappelijke
          # basismap is dist/, dus ze downloaden in `publiceren` weer in dist/ en
          # vallen daar onder de SHA256SUMS-sweep.
          path: |
            dist/ocideck-linux-x64-${{ env.VERSIE }}.tar.gz
            dist/ocideck-linux-amd64-${{ env.VERSIE }}.deb
            dist/ocideck-linux-x86_64-${{ env.VERSIE }}.rpm
            dist/ocideck-linux-x86_64-${{ env.VERSIE }}.AppImage

  macos:
    name: macOS bouwen
    # Host-modus op de aangemelde Mac (mac-brenno): de toolchain van die
    # machine, die `make check-toolchain` daar al bewaakt. Staat de Mac uit,
    # dan wacht deze job tot hij er weer is.
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: macOS-release bouwen, tekenen en notariseren
        # Op de aangemelde Mac (mac-brenno) staan een Developer ID-certificaat en
        # het notarytool-profiel 'ocideck-notary' in de login-keychain. Staan ze
        # er, dan tekent, notariseert en stapelt deze stap de app zodat hij op
        # elke Mac opent zonder Gatekeeper-waarschuwing. Ontbreekt de identiteit
        # (bijvoorbeeld een andere runner), dan valt hij terug op een ongetekende
        # build met een luide waarschuwing — hetzelfde patroon als deploy-web bij
        # missende secrets: een release blijft mogelijk, maar niemand denkt per
        # ongeluk dat hij getekend is. Het certificaat verlaat de machine nooit;
        # er is dus geen enkel signing-secret in deze repo nodig.
        run: |
          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "Developer ID gevonden — tekenen en notariseren."
            scripts/notarize_macos.sh --no-package
          else
            echo "::warning title=Ongetekende macOS-build::Geen Developer ID op deze runner; er wordt een ONGETEKENDE app gepubliceerd. Richt voor een echte release het certificaat en het notarytool-profiel op de runner in (zie docs/BUILD.md)."
            make build-macos
          fi

      - name: Bundel inpakken
        # ditto bewaart symlinks en resource forks — een .app die door een
        # gewone zip gaat, start niet meer.
        run: |
          VERSIE="${GITHUB_REF_NAME#v}"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "ocideck-macos-$VERSIE.zip"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-macos
          path: ocideck-macos-${{ env.VERSIE }}.zip

  windows-ophalen:
    name: Windows ophalen van de spiegel
    runs-on: docker
    # Voorgebakken CI-image i.p.v. kaal ubuntu + per-run apt-get: dit image draagt
    # al node/curl/ca-certificates/jq (zie .forgejo/ci-image/Dockerfile) en staat
    # op de runner al warm van de bouw-jobs, dus de "Gereedschap installeren"-stap
    # (4-6 min apt) vervalt. #11 van het releaseketen-verhardingsplan.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.44.8
    steps:
      # Waarom een release-asset en niet het build-artifact van die run: een
      # GitHub-*artifact* vraagt een token, óók bij een publieke repo, en
      # verloopt na negentig dagen. Een release-*asset* van een publieke repo is
      # een gewone publieke URL. Dat scheelt bij het OPHALEN een geheim op de
      # runner én betekent dat de Windows-download over drie jaar nog bestaat.
      #
      # Het STARTEN gaat sinds v0.3.6 niet meer vanzelf. Eerder leunde deze job
      # erop dat de tag-push naar de spiegel daar `release.yml` triggert — maar
      # stond de tag al op de spiegel (eerdere poging / Forgejo's eigen mirror),
      # dan is die push een no-op en vuurt GitHub géén Actions-run: de Windows-
      # build startte nooit en deze job wachtte 45 min leeg (zie #1313-plan).
      # Daarom dispatchen we nu ACTIEF via `workflow_dispatch`, ongeacht of het
      # push-event afging. Zonder token valt de job terug op passief wachten, zodat
      # de keten blijft werken tot het secret gezet is.
      - name: Windows-build starten en ophalen
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -u
          TAG="${GITHUB_REF_NAME}"
          VERSIE="${TAG#v}"
          BESTAND="ocideck-windows-x64-$VERSIE.zip"
          REPO="brennodewinter/Ocideck"
          URL="https://github.com/$REPO/releases/download/$TAG/$BESTAND"
          API="https://api.github.com/repos/$REPO"

          have_asset() { curl -fsSLo "$BESTAND" "$URL" 2>/dev/null; }
          gh_api() { curl -fsS -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          dispatch() { gh_api -X POST "$API/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"$TAG\"}"; }
          # Laatste run van de Windows-workflow op DEZE tag: "status conclusion url".
          run_status() { gh_api "$API/actions/workflows/release.yml/runs?per_page=10" \
            | jq -r --arg t "$TAG" 'first(.workflow_runs[] | select(.head_branch==$t))
                // {} | "\(.status // "") \(.conclusion // "") \(.html_url // "")"'; }

          # #2 idempotent: staat het asset er al (push-event vuurde wél, of een
          # eerdere run), dan zijn we meteen klaar.
          if have_asset; then
            echo "Asset stond er al: $(du -h "$BESTAND" | cut -f1)"; exit 0
          fi

          if [ -z "${GH_DISPATCH_TOKEN:-}" ]; then
            echo "GH_DISPATCH_TOKEN niet gezet — passief wachten op de spiegel-build (minder robuust)."
          else
            info="$(run_status || true)"; st="$(printf '%s' "$info" | awk '{print $1}')"
            # #2: draait er al een build op deze tag, dan niet nog eens dispatchen.
            if [ -n "$st" ] && [ "$st" != "completed" ] && [ "$st" != "null" ]; then
              echo "Er loopt al een Windows-build ($st) — niet opnieuw dispatchen."
            else
              echo "Windows-build dispatchen op $REPO@$TAG…"
              dispatch || { echo "Dispatch faalde — controleer GH_DISPATCH_TOKEN (Actions: RW)." >&2; exit 1; }
              sleep 10
            fi
          fi

          # #5 poll op zowel het asset als de run-status; herdispatch als er na
          # ~5 min geen run zichtbaar is; faal meteen (met run-URL) als de build faalt.
          LAST_URL=""
          for POGING in $(seq 1 45); do
            if have_asset; then
              echo "Opgehaald na $POGING minuut/minuten: $(du -h "$BESTAND" | cut -f1)"; exit 0
            fi
            if [ -n "${GH_DISPATCH_TOKEN:-}" ]; then
              info="$(run_status || true)"
              st="$(printf '%s' "$info" | awk '{print $1}')"
              cc="$(printf '%s' "$info" | awk '{print $2}')"
              LAST_URL="$(printf '%s' "$info" | awk '{print $3}')"
              echo "[$POGING] run: ${st:-<geen>} ${cc:-} ${LAST_URL:-}"
              if [ "$POGING" -eq 5 ] && { [ -z "$st" ] || [ "$st" = "null" ]; }; then
                echo "Nog geen run zichtbaar — opnieuw dispatchen."; dispatch || true
              fi
              if [ "${cc:-}" = "failure" ] || [ "${cc:-}" = "cancelled" ]; then
                echo "De Windows-build faalde: ${LAST_URL:-zie GitHub Actions}." >&2
                echo "Herstel dat en hertrigger deze release-workflow." >&2
                exit 1
              fi
            fi
            sleep 60
          done
          echo "Na 45 minuten stond $URL er nog niet (laatste run: ${LAST_URL:-onbekend})." >&2
          echo "Hertrigger deze release-workflow zodra de Windows-build groen is." >&2
          exit 1

      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-windows
          path: ocideck-windows-x64-*.zip

  publiceren:
    name: Release publiceren
    needs: [web, linux, macos, windows-ophalen]
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      - name: Gereedschap installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git curl ca-certificates jq

      - uses: actions/checkout@v4

      # Downloaden naar `dist`, niet `assets`: de checkout hierboven brengt de
      # repo mee, en die heeft een top-level `assets/` met submappen (fonts,
      # images, templates, …). Zou je de release-bestanden dáárin zetten, dan
      # struikelt de `sha256sum ./*` in de Checksums-stap over die mappen
      # ("Is a directory", exit 1) en wordt er niets gepubliceerd. `dist`
      # bestaat niet in de repo en botst dus met niets. Niet terugdraaien.
      - uses: actions/download-artifact@v3
        with: { name: ocideck-web, path: dist }
      - uses: actions/download-artifact@v3
        with: { name: ocideck-linux, path: dist }
      - uses: actions/download-artifact@v3
        with: { name: ocideck-macos, path: dist }
      - uses: actions/download-artifact@v3
        with: { name: ocideck-windows, path: dist }

      # De SBOM hoort bij de exacte build die je uitlevert (CRA, Verordening
      # (EU) 2024/2847, bijlage I deel II §1). Hij staat gecommit in de repo en
      # `make sbom-verify` bewaakt in elke `make check` dat hij niet verouderd
      # is, dus hier volstaat meenemen — met de versie in de naam, zodat twee
      # gedownloade SBOM's niet dezelfde naam dragen.
      - name: SBOM meeverpakken
        run: |
          set -eu
          VERSIE="${GITHUB_REF_NAME#v}"
          cp sbom/ocideck.cdx.json  "dist/ocideck-$VERSIE.cdx.json"
          cp sbom/ocideck.spdx.json "dist/ocideck-$VERSIE.spdx.json"

      # Eén lijst over alles wat aan deze release hangt. Wat dit wel is: een
      # controle dat je hebt wat er lag. Wat dit niet is: een handtekening —
      # wie de lijst zelf niet vertrouwt, heeft er niets aan. Die handtekening
      # zit er wél, maar buiten deze workflow: de manifest wordt ná publicatie
      # lokaal en met de hand getekend met minisign (`make sign-release`), zodat
      # de private sleutel niet als secret op de runner hoeft te staan. Het
      # resultaat, `SHA256SUMS.minisig`, wordt daarna aan de release gehangen —
      # zie docs/BUILD.md §"Signing the release manifest".
      - name: Checksums
        run: |
          set -eu
          cd dist
          # Naar een bestand buiten de map en dan pas naar binnen: `sha256sum
          # ./* > SHA256SUMS` neemt bij een hérstart de lijst van de vorige
          # poging in zichzelf mee, want die staat er dan al.
          sha256sum ./* > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Releasetekst opmaken
        run: |
          set -eu
          VERSIE="${GITHUB_REF_NAME#v}"
          sed -e "s/@VERSIE@/$VERSIE/g" -e "s/@TAG@/$GITHUB_REF_NAME/g" \
            .forgejo/release-body.md > /tmp/body.md
          cat /tmp/body.md

      - name: Release aanmaken en bestanden eraan hangen
        env:
          # Het automatisch geïnjecteerde token van de run. Staat er een
          # RELEASE_TOKEN als secret, dan wint die — nodig als het ingebouwde
          # token in een toekomstige Forgejo-versie geen releases meer mag
          # schrijven. Zie docs/BUILD.md.
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          TOKEN="${RELEASE_TOKEN:-$RUN_TOKEN}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Een streepje in de tag betekent semver-voorloper (`v0.1.0-rc1`), en
          # die hoort als prerelease gemarkeerd te staan: Forgejo laat hem dan
          # niet als "laatste release" gelden, dus wie de downloadknop volgt
          # krijgt hem niet voorgeschoteld.
          case "$GITHUB_REF_NAME" in
            *-*) VOORLOPER=true ;;
            *)   VOORLOPER=false ;;
          esac
          jq -n --arg tag "$GITHUB_REF_NAME" \
                --arg name "OciDeck $GITHUB_REF_NAME" \
                --rawfile body /tmp/body.md \
                --argjson pre "$VOORLOPER" \
                '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:$pre}' \
            > /tmp/release.json

          # Herstarten moet gewoon werken. De waarschijnlijkste reden om deze
          # workflow opnieuw te draaien is dat de Windows-build op de spiegel te
          # laat kwam; dan bestaat de release van de vorige poging al, en een
          # tweede POST loopt stuk. Dus: bestaat hij, dan hergebruiken.
          CODE=$(curl -s -o /tmp/created.json -w '%{http_code}' -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d @/tmp/release.json)
          if [ "$CODE" = "201" ]; then
            ID=$(jq -r '.id' /tmp/created.json)
            echo "Release $GITHUB_REF_NAME aangemaakt (id $ID)."
          else
            echo "POST /releases gaf HTTP $CODE — kijken of hij al bestaat."
            BESTAAND=$(curl -s -o /tmp/bestaand.json -w '%{http_code}' \
              -H "Authorization: token $TOKEN" "$API/releases/tags/$GITHUB_REF_NAME")
            if [ "$BESTAAND" != "200" ]; then
              echo "Release aanmaken gaf HTTP $CODE en hij bestaat ook niet:" >&2
              cat /tmp/created.json >&2
              exit 1
            fi
            ID=$(jq -r '.id' /tmp/bestaand.json)
            echo "Bestaande release hergebruikt (id $ID)."
          fi

          # Bijlagen van een vorige poging eerst weg: Forgejo weigert een
          # tweede bijlage met dezelfde naam niet, hij zet hem ernaast — en dan
          # staan er twee bestanden waarvan niemand weet welke de goede is.
          curl -s -H "Authorization: token $TOKEN" "$API/releases/$ID/assets" \
            > /tmp/bijlagen.json
          for BESTAND in dist/*; do
            NAAM="$(basename "$BESTAND")"
            OUD=$(jq -r --arg n "$NAAM" '.[] | select(.name==$n) | .id' /tmp/bijlagen.json)
            if [ -n "$OUD" ]; then
              curl -s -o /dev/null -X DELETE -H "Authorization: token $TOKEN" \
                "$API/releases/$ID/assets/$OUD"
              echo "  - $NAAM (oude versie verwijderd)"
            fi
            CODE=$(curl -s -o /tmp/asset.json -w '%{http_code}' -X POST \
              "$API/releases/$ID/assets?name=$NAAM" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$BESTAND")
            if [ "$CODE" != "201" ]; then
              echo "Bijlage $NAAM gaf HTTP $CODE:" >&2
              cat /tmp/asset.json >&2
              exit 1
            fi
            echo "  + $NAAM"
          done

          echo
          echo "Klaar: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

  homebrew-cask:
    name: Homebrew-cask bijwerken
    needs: publiceren
    # Geen prereleases: een -rc hoort niet in de tap. Homebrew Cask is
    # macOS-only — een Linux-installatieroute loopt langs een eigen spoor
    # (#1227), niet via deze cask.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: docker
    container:
      image: ubuntu:24.04
    env:
      HOMEBREW_TAP_REPOSITORY: ${{ secrets.HOMEBREW_TAP_REPOSITORY }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # Zelfde filosofie als 'Webversie live zetten': is de tap niet
      # geconfigureerd, dan tuigen we geen gereedschap of checkout op en gaat de
      # job groen met een zichtbare overslaan-notitie. De release zelf publiceert
      # hoe dan ook compleet; de cask is een macOS-nevenkanaal. De check staat
      # vooraan zodat een ontbrekende tap geen apt-get + checkout voor niets optuigt.
      - name: Is de tap geconfigureerd?
        id: check
        run: |
          if [ -n "${HOMEBREW_TAP_REPOSITORY:-}" ] && [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "tap=true" >> "$GITHUB_OUTPUT"
          else
            echo "tap=false" >> "$GITHUB_OUTPUT"
            echo "Geen HOMEBREW_TAP_REPOSITORY/HOMEBREW_TAP_TOKEN ingesteld — de"
            echo "Homebrew-cask wordt niet bijgewerkt. Dat is nu de bedoeling: de tap"
            echo "wordt met de hand onderhouden tot beide secrets gezet zijn. De"
            echo "release zelf publiceert compleet; deze job slaat alleen de tap over."
            # Een groene job leest als "tap bijgewerkt"; zet de skip daarom
            # zichtbaar op de run-samenvatting, niet alleen in de staplog.
            {
              echo "### ⏭️ Homebrew-cask NIET bijgewerkt"
              echo ""
              echo "De release-artefacten zijn compleet, maar de tap is **niet**"
              echo "bijgewerkt: \`HOMEBREW_TAP_REPOSITORY\`/\`HOMEBREW_TAP_TOKEN\`"
              echo "ontbreken (bewust, tot de tap bestaat)."
              echo ""
              echo "Werk de cask tot die tijd met de hand bij:"
              echo "\`scripts/update_homebrew_cask.sh <tag> <tap>/Casks/ocideck.rb\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # nodejs erbij: actions/checkout@v4 is een Node-actie en de kale
      # ubuntu:24.04 heeft geen Node aan boord (net als 'Release publiceren' en
      # 'Webversie live zetten'). Zonder deze regel faalt de checkout hieronder —
      # dat brak de eerste echte cask-run (v0.3.1).
      - name: Gereedschap installeren
        if: steps.check.outputs.tap == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git curl ca-certificates

      - uses: actions/checkout@v4
        if: steps.check.outputs.tap == 'true'

      - name: Homebrew-cask genereren en in de tap bijwerken
        if: steps.check.outputs.tap == 'true'
        run: |
          set -euo pipefail

          # De tap staat op de eigen forge (canoniek). De GitHub-spiegel die de
          # `brew tap librekat/ocideck`-shorthand voedt, wordt door een
          # push-mirror op het tap-repo bijgewerkt — niet door een tweede
          # release-job. Daarom klonen we forge-relatief via GITHUB_SERVER_URL en
          # niet tegen een hardgecodeerde github.com.
          FORGE_HOST="${GITHUB_SERVER_URL#https://}"
          TMPDIR="$(mktemp -d)"

          # Is de tap (nog) niet te klonen — hij bestaat niet, of het token mist
          # push-scope — dan overslaan zoals bij ontbrekende secrets, in plaats
          # van de hele job rood te maken. De release blijft compleet staan.
          if ! git clone "https://oauth2:${HOMEBREW_TAP_TOKEN}@${FORGE_HOST}/${HOMEBREW_TAP_REPOSITORY}.git" "$TMPDIR/tap" 2>"$TMPDIR/clone.err"; then
            echo "Tap ${HOMEBREW_TAP_REPOSITORY} niet te klonen — cask overgeslagen." >&2
            sed 's/oauth2:[^@]*@/oauth2:***@/g' "$TMPDIR/clone.err" >&2 || true
            {
              echo "### ⚠️ Homebrew-cask overgeslagen: tap onbereikbaar"
              echo ""
              echo "\`${HOMEBREW_TAP_REPOSITORY}\` kon niet gekloond worden — de tap"
              echo "bestaat niet of \`HOMEBREW_TAP_TOKEN\` mist push-scope. De release"
              echo "is compleet; werk de cask met de hand bij."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config --global user.name "OciDeck release"
          git config --global user.email "release@librekat.nl"

          chmod +x scripts/update_homebrew_cask.sh
          ./scripts/update_homebrew_cask.sh "$GITHUB_REF_NAME" "$TMPDIR/tap/Casks/ocideck.rb"

          cd "$TMPDIR/tap"
          # Een verse/lege tap-repo heeft nog geen HEAD-branch; dan geeft
          # `git remote show origin` "(unknown)" of niets terug en zou
          # `git checkout -B ""` falen. Val in dat geval terug op main.
          DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "(unknown)" ]; then
            DEFAULT_BRANCH="main"
          fi
          git checkout -B "$DEFAULT_BRANCH"
          git add Casks/ocideck.rb
          if git diff --cached --quiet; then
            echo "Geen cask-wijziging nodig."
            exit 0
          fi
          git commit -m "OciDeck $GITHUB_REF_NAME: update Homebrew cask"
          git push origin "HEAD:$DEFAULT_BRANCH"

  website-downloads:
    name: Website-downloads bijwerken
    # Op de aangemelde Mac (mac-brenno): die heeft SSH-toegang tot de website-repo
    # en de tooling van het bump-script. Draait ná 'publiceren', want het
    # bump-script haalt de verificatiehash en de datum uit de zojuist gepubliceerde
    # release. Geen prereleases (zoals deploy-web) — een -rc raakt de productiesite
    # niet.
    #
    # Deze job werkt alléén de website-repository bij: bump -> commit -> push. Het
    # live zetten is bewust níet meer de taak van de releaseketen. De website-repo
    # publiceert zichzelf, met een eigen deploy-workflow die op elke push naar main
    # `./publiceersite` draait (.forgejo/workflows/deploy.yml in die repo). Zo reikt
    # de release niet meer rechtstreeks naar de productieserver — hij levert een
    # commit aan, de website-repo zet live. Faalt deze job, dan is de release al
    # gepubliceerd en valt de website terug op de handmatige route
    # (scripts/bump-ocideck.sh + commit + push in de website-repo; de
    # deploy-workflow zet daarna live).
    needs: publiceren
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos
    steps:
      - name: Website-repo naar deze release bijwerken
        run: |
          set -Eeuo pipefail
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/id_rsa"
          VERSIE="${GITHUB_REF_NAME#v}"
          WT="$(mktemp -d)"
          git clone ssh://git@pawprint.vigilis.online:2222/LibreKAT/website.git "$WT"
          cd "$WT"
          git config user.name "OciDeck release"
          git config user.email "release@librekat.nl"
          scripts/bump-ocideck.sh "$VERSIE"
          if git diff --quiet; then
            echo "Website staat al op $VERSIE — niets te pushen."
            exit 0
          fi
          git commit -aqm "OciDeck $VERSIE: downloads bijwerken (automatisch bij release)"
          git push origin main
          echo "Website-repo bijgewerkt naar $VERSIE — de deploy-workflow van die repo zet het live."
