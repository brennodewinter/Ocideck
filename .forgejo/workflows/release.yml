# De release-keten van OciDeck: eerst alle platformen, daarna pas een tag.
#
# Draait op de forge (Pawprint) en dat is met opzet: de forge is de bron, en de
# downloads horen te staan waar de broncode staat. Eén uitzondering — Windows.
# Apple licenseert macOS alleen op Apple-hardware (vandaar de Mac-runner) en
# voor Windows is er hier geen machine. Die build komt van de GitHub-spiegel en
# wordt hier opgehaald en meeverpakt, zodat een bezoeker toch één vindplaats
# heeft. Het OPHALEN vraagt geen token (een release-asset is een publieke URL);
# het STARTEN wel — `windows-ophalen` dispatcht sinds v0.3.6 de spiegel-build
# actief via `GH_DISPATCH_TOKEN` i.p.v. te hopen dat de tag-push hem triggert.
#
# Een kandidaat op main bouwt en controleert eerst alle bestanden:
#
#   web      → geharde bundel
#   linux    → x64-bundel als tar.gz
#   linux-debian12 → native x86-64-bundel gebouwd in Debian 12
#   macos    → .app als zip (op de Mac-runner)
#   windows  → opgehaald van de spiegel
# Pas na een groene kandidaat maakt release_auto.sh een geannoteerde tag met
# het kandidaat-runnummer. De tag-push haalt exact die gecontroleerde bytes op,
# maakt een draft release en laat ondertekening en de publieke stap aan het
# lokale script. De webdemo en downloadpagina volgen na publicatie.
#
# Ondertekening: de macOS-app wordt op de Mac-runner getekend en genotariseerd
# (Developer ID + notarytool; zie de macos-job en docs/BUILD.md). Een stabiele
# release faalt gesloten wanneer identiteit of notary-profiel ontbreekt; alleen
# een expliciete prerelease mag als oefenbouw ongetekend zijn. Windows en Linux
# worden (nog) niet getekend; voor Windows klaagt SmartScreen. Daarom
# houdt de releasetekst (.forgejo/release-body.md) de openen-instructie per
# platform aan, zolang dat platform ongetekend is.
name: release

on:
  push:
    tags: ["v*"]
  # Een kandidaat draait op main; een herstart van publicatie op de tag.
  workflow_dispatch:
    inputs:
      mode:
        description: candidate or publish
        required: true
        type: choice
        options: [candidate, publish]
      version:
        description: The future release tag
        required: false
        type: string
      commit_sha:
        description: Exact commit to build before tagging
        required: false
        type: string
      candidate_run_id:
        description: Verified candidate run containing release bytes
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
  RELEASE_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  # De volledige poort draait op de kandidaat vóór de tag. Na de tag wordt
  # alleen het vastgelegde kandidaatbewijs gecontroleerd en gepubliceerd.
  gate:
    name: Poort (vóór het bouwen)
    runs-on: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Release-invoer valideren
        run: |
          set -eu
          TAG="$RELEASE_TAG"
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [ "${{ inputs.mode }}" = candidate ]; then
            test "${GITHUB_REF_TYPE:-}" = branch && test "$GITHUB_REF_NAME" = main || {
              echo "Kandidaat moet vanaf main worden gestart." >&2; exit 1;
            }
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
              echo "Kandidaatcheckout wijkt af van opgegeven commit." >&2; exit 1;
            }
          elif [ "${GITHUB_REF_TYPE:-}" != tag ] || [ "$TAG" != "$GITHUB_REF_NAME" ] || [ "$(git rev-parse "$TAG^{}")" != "$(git rev-parse HEAD)" ]; then
            echo "Publicatie moet op de exacte tagcommit draaien." >&2; exit 1
          elif [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "Release-tag mist het kandidaatattest." >&2; exit 1
          else
            RID="$(git cat-file -p "refs/tags/$TAG" | sed -n 's/^Candidate-Run: \([0-9][0-9]*\)$/\1/p')"
            case "$RID" in ''|*[!0-9]*) echo "Release-tag mist een geldig kandidaat-runnummer." >&2; exit 1 ;; esac
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq "$SEMVER_RE"; then
            echo "Ongeldige release-ref '$TAG': verwacht v<major>.<minor>.<patch> met optionele SemVer-prerelease." >&2
            exit 1
          fi

          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          test -n "$PUBSPEC_VERSION" || {
            echo "Geen version: in pubspec.yaml gevonden." >&2
            exit 1
          }
          PUBSPEC_SEMVER="${PUBSPEC_VERSION%%+*}"
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$PUBSPEC_SEMVER" ]; then
            echo "Tag $TAG komt niet overeen met pubspec.yaml ($PUBSPEC_VERSION; verwacht v$PUBSPEC_SEMVER)." >&2
            exit 1
          fi
          echo "Release-invoer klopt: $TAG (pubspec $PUBSPEC_VERSION)."

      - name: Afhankelijkheden ophalen
        if: ${{ inputs.mode == 'candidate' }}
        run: flutter pub get --enforce-lockfile

      - name: De poort
        if: ${{ inputs.mode == 'candidate' }}
        run: |
          make check-no-coverage
          make test-golden

  web:
    name: Web bouwen
    needs: gate
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    # Voorgebakken CI-image i.p.v. kaal ubuntu (#1170): OS, node, de
    # build-toolchain (cmake/build-essential voor de dartcv4-OpenCV-hook, #870) en
    # de gepinde, sha256-geverifieerde Flutter zitten er al in, dus de per-run-
    # installatie én de Flutter-download vervallen. Het tag ís de Flutter-pin;
    # `check-toolchain` (in de gate op ditzelfde image) bewaakt dat het niet
    # afdrijft. De web-engine-artefacten zijn niet voorgebakken (`--no-web` in het
    # image) en worden bij `flutter build web` opgehaald — een kleine download.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      # De werkkopie is van een andere uid dan root; zonder dit weigert git en
      # falen stappen die git aanroepen. Op het kale image deed de Flutter-
      # composite-actie dit voor /opt/flutter; Flutter staat nu al klaar, dus we
      # zetten alleen de werkkopie op safe (zoals de gate-workflows).
      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Dezelfde cache-sleutels als linux-gate/static-gate, met opzet. De
      # Linux-poort draait op elke push naar main en vult die caches dus onder
      # main-scope; main-scope-caches zijn leesbaar vanuit een tag-build, dus bij
      # het snijden van een tag staat de dure dartcv-OpenCV-compile hier al warm
      # i.p.v. from-scratch. `continue-on-error`: valt de cache-API weg of mist de
      # sleutel, dan bouwt de stap gewoon opnieuw — precies het gedrag van nu.
      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile

      - name: dartcv4-versie uit pubspec.lock
        id: dartcv
        run: |
          VERSIE="$(grep -A8 '^  dartcv4:' pubspec.lock | grep 'version:' | sed 's/.*version: "//;s/".*//')"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"
      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ steps.dartcv.outputs.versie }}

      # Dezelfde poort die elke push krijgt, plus de hardingscontrole. Een tag
      # mag geen artefact uitleveren dat langs de controles is geglipt: dit is
      # het enige moment waarop de bundel de deur uit gaat.
      - name: Bouwen en harding controleren
        run: make check-web

      - name: Bundel inpakken
        run: |
          VERSIE="${RELEASE_TAG#v}"
          tar -C build/web -czf "ocideck-web-$VERSIE.tar.gz" .
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-web
          path: ocideck-web-${{ env.VERSIE }}.tar.gz

  linux:
    name: Linux bouwen
    needs: gate
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    # Voorgebakken CI-image i.p.v. kaal ubuntu (#1170): toolchain + Flutter +
    # Linux-desktop-precache zitten erin. Het image is echter voor de TEST-gates
    # gebouwd en mist twee libs die alléén de desktop-build linkt — die vullen we
    # hieronder aan. De rest (clang/cmake/ninja/pkg-config/libgtk-3-dev/
    # build-essential/node) is ingebakken.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      # liblzma-dev + libsecret-1-dev + libayatana-appindicator3-dev: nodig voor
      # `make build-linux` (flutter_secure_storage linkt libsecret; lzma voor
      # compressie; cnativeapi eist sinds #1741 de pkg-config-module
      # ayatana-appindicator3-0.1 — die als enige van zijn vier niet met
      # libgtk-3-dev meekomt en de Linux-build van v0.4.9 brak), maar niet
      # voor de test-gates, dus ze zitten niet in het image. build-essential/clang/
      # cmake/ninja/pkg-config/libgtk-3-dev zitten er wél al in. `rpm` levert
      # rpmbuild voor het .rpm-pakket (#1227); dpkg-deb voor het .deb zit al in het
      # basissysteem, en appimagetool haalt het pakketscript sha256-geverifieerd op.
      # `file` lijkt triviaal maar zit niet in het kale ubuntu:24.04-image, en
      # appimagetool weigert zonder ("file command is missing but required") — dat
      # brak de eerste Linux-pakketrun (v0.3.3). Zonder deze regel valt de hele
      # `publiceren`-job weg (die needt `linux`) en verschijnt er geen release.
      - name: Ontbrekende Linux-buildlibs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends liblzma-dev libsecret-1-dev libayatana-appindicator3-dev rpm file flatpak python3

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Gedeelde cache-sleutels met de gates (zie de web-job): linux-gate draait
      # op elke push naar main en vult deze onder main-scope, die een tag-build
      # mag lezen — zo staat de dartcv-OpenCV-compile hier warm. `continue-on-error`
      # → mist de cache, dan bouwt het gewoon opnieuw, als vanouds.
      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile

      - name: dartcv4-versie uit pubspec.lock
        id: dartcv
        run: |
          VERSIE="$(grep -A8 '^  dartcv4:' pubspec.lock | grep 'version:' | sed 's/.*version: "//;s/".*//')"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"
      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ steps.dartcv.outputs.versie }}

      - name: Linux-release bouwen
        run: make build-linux

      - name: Bundel inpakken
        # In één versiemap ocideck-<versie>/, niet los in de huidige map: pakte
        # je de tarball anders uit, dan spatte de hele bundel (./ocideck,
        # ./lib/…) over de map waarin je stond (issue #904). --transform
        # hernoemt de bovenste padcomponent `bundle` naar `ocideck-<versie>`;
        # het anker ^bundle raakt geen symlink-doelen, want die beginnen daar
        # nooit mee. Alles landt in dist/ zodat één artifact zowel de tarball als
        # de pakketten draagt en ze in `publiceren` weer samen in dist/ komen.
        run: |
          VERSIE="${RELEASE_TAG#v}"
          mkdir -p dist
          tar -C build/linux/x64/release \
            --transform "s,^bundle,ocideck-$VERSIE," \
            -czf "dist/ocideck-linux-x64-$VERSIE.tar.gz" bundle
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Linux-pakketten bouwen (AppImage/.deb/.rpm/Flatpak)
        # Phase 1 van de Linux-installatieroute (#1227, docs/design/LINUX_PACKAGING.md):
        # naast de rauwe tarball een AppImage, een .deb en een .rpm — losse assets
        # aan de release, geen store en geen sandbox. appimagetool zit in geen
        # distro, dus het pakketscript haalt het op en toetst het tegen deze
        # sha256. De hash ÍS de pin: draait de `continuous`-build upstream weg, dan
        # faalt de download hier hoorbaar in plaats van stil een ander binary te
        # draaien. Sinds #2324 vergelijkt de pre-flight van release_auto deze pin
        # vóór de tag met de officiële asset-digest uit de GitHub-release-API —
        # zo bleek een verplaatste upstream niet meer pas in dèze job. Daarom
        # staat appimagetool niet als *_VERSION in de pin-manifest (een
        # content-hash veroudert niet in stilte); bij een sha-mismatch: haal de
        # nieuwe digest uit de GitHub-release-API en werk hem hier bij.
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: 793fca0ce4bcc309dc65d3f66669f58e3755643e4dadbe03932e7b436128494f
          OUT: dist
        run: make package-linux VERSION="$VERSIE"

      - name: Artifact bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-linux
          # Alle vier de Linux-assets in één artifact. De gemeenschappelijke
          # basismap is dist/, dus ze downloaden in `publiceren` weer in dist/ en
          # vallen daar onder de SHA256SUMS-sweep.
          path: |
            dist/ocideck-linux-x64-${{ env.VERSIE }}.tar.gz
            dist/ocideck-linux-amd64-${{ env.VERSIE }}.deb
            dist/ocideck-linux-x86_64-${{ env.VERSIE }}.rpm
            dist/ocideck-linux-x86_64-${{ env.VERSIE }}.AppImage
            dist/ocideck-linux-x86_64-${{ env.VERSIE }}.flatpak
            dist/ocideck-linux-x86_64-${{ env.VERSIE }}.flatpak.cdx.json

  linux-debian12:
    name: Linux bouwen op Debian 12
    needs: gate
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    timeout-minutes: 240
    steps:
      - name: Docker-gereedschap installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates nodejs git docker.io iproute2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Docker-daemon vinden
        id: dockerd
        run: |
          set -eu
          GW="$(ip -4 route show default | awk '{print $3; exit}')"
          test -n "$GW"
          echo "host=tcp://$GW:2375" >> "$GITHUB_OUTPUT"
      - name: Native Debian 12-app bouwen
        env:
          DOCKER_DAEMON: ${{ steps.dockerd.outputs.host }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            docker -H "$DOCKER_DAEMON" info >/dev/null 2>&1 && break
            sleep 2
          done
          docker -H "$DOCKER_DAEMON" info >/dev/null
          scripts/build_debian12_release.sh "${RELEASE_TAG#v}"
      - name: Artifact bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-linux-debian12
          path: dist/ocideck-linux-debian12-x86_64-*.tar.gz

  macos:
    name: macOS bouwen
    needs: gate
    if: ${{ inputs.mode == 'candidate' }}
    # Host-modus op de aangemelde Mac (mac-brenno): de toolchain van die
    # machine, die `make check-toolchain` daar al bewaakt. Staat de Mac uit,
    # dan wacht deze job tot hij er weer is.
    runs-on: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile

      - name: macOS-release bouwen, tekenen en notariseren
        # Een stabiele release mag nooit terugvallen op ongetekende bytes:
        # identiteit, notary-profiel en Apple-verbinding worden eerst read-only
        # getoetst. Alleen een prerelease is een oefenroute die bij ontbrekende
        # signing als expliciet ongetekende build verder mag.
        run: |
          set -eu
          case "$RELEASE_TAG" in
            *-*) STABIEL=false ;;
            *)   STABIEL=true ;;
          esac

          if scripts/notarize_macos.sh --preflight; then
            echo "Signing-preflight geslaagd — tekenen en notariseren."
            scripts/notarize_macos.sh --no-package
            echo "MACOS_SIGNED=true" >> "$GITHUB_ENV"
          elif [ "$STABIEL" = true ]; then
            echo "Stabiele macOS-release geweigerd: Developer ID of notary-profiel ontbreekt/werkt niet." >&2
            echo "Herstel de runner volgens docs/BUILD.md; publiceer nooit een ongetekende stabiele build." >&2
            exit 1
          else
            echo "::warning title=Ongetekende macOS-prerelease::Signing-preflight faalde; alleen omdat dit een prerelease is, wordt een ONGETEKENDE oefenbuild gepubliceerd."
            make build-macos
            echo "MACOS_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: macOS-publicatie verifiëren
        # Onafhankelijke grens vlak vóór verpakken/uploaden. Het notariseerscript
        # toetst dit ook, maar een latere wijziging daar mag deze poort niet stil
        # laten verdwijnen.
        run: |
          set -eu
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" || { echo "Geen gebouwde macOS-app gevonden." >&2; exit 1; }
          if [ "${MACOS_SIGNED:-false}" != true ]; then
            case "$RELEASE_TAG" in
              *-*) echo "Ongetekende prerelease: signingcontroles niet van toepassing." ;;
              *) echo "Stabiele macOS-build is niet als getekend gemarkeerd." >&2; exit 1 ;;
            esac
          else
            codesign --verify --deep --strict --verbose=2 "$APP"
            xcrun stapler validate "$APP"
            spctl -a -t exec -vvv "$APP"
          fi

      - name: Bundel inpakken
        # ditto bewaart symlinks en resource forks — een .app die door een
        # gewone zip gaat, start niet meer.
        run: |
          VERSIE="${RELEASE_TAG#v}"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "ocideck-macos-$VERSIE.zip"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Artifact bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-macos
          path: ocideck-macos-${{ env.VERSIE }}.zip

  windows-ophalen:
    name: Windows ophalen van de spiegel
    needs: gate
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    # De Windows-bouw krijgt 240 min; de poll-lus geeft daarnaast 90 min
    # voor wachtrij en overdracht. De job heeft nog 30 min extra marge.
    timeout-minutes: 360
    # Voorgebakken CI-image i.p.v. kaal ubuntu + per-run apt-get: dit image draagt
    # al node/curl/ca-certificates/jq (zie .forgejo/ci-image/Dockerfile) en staat
    # op de runner al warm van de bouw-jobs, dus de "Gereedschap installeren"-stap
    # (4-6 min apt) vervalt. #11 van het releaseketen-verhardingsplan.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      # De spiegelrelease blijft draft: Windows mag niet eerder publiek zijn dan
      # de centrale release. Ophalen gebeurt daarom geauthenticeerd via de API.
      #
      # Het STARTEN gaat sinds v0.3.6 niet meer vanzelf. Eerder leunde deze job
      # erop dat de tag-push naar de spiegel daar `release.yml` triggert — maar
      # stond de tag al op de spiegel (eerdere poging / Forgejo's eigen mirror),
      # dan is die push een no-op en vuurt GitHub géén Actions-run: de Windows-
      # build startte nooit en deze job wachtte 45 min leeg (zie #1313-plan).
      # Daarom dispatchen we nu ACTIEF via `workflow_dispatch`, ongeacht of het
      # push-event afging. Zonder token valt de job terug op passief wachten, zodat
      # de keten blijft werken tot het secret gezet is.
      - name: Windows-build starten en ophalen
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -u
          TAG="$RELEASE_TAG"
          VERSIE="${TAG#v}"
          # Twee bestanden sinds #1583: de zip én de installer. Ze komen uit
          # dezelfde spiegel-run, dus ze verschijnen samen — maar de controle
          # eist ze allebei. Zou hij op de zip alleen tevreden zijn, dan
          # verlaat een oude, halve spiegel-release (of een run die tussen de
          # twee uploads faalde) deze job groen zónder installer, en publiceert
          # de forge een release waarin er stilzwijgend één ontbreekt.
          BESTANDEN=(
            "ocideck-windows-x64-$VERSIE.zip"
            "ocideck-windows-x64-setup-$VERSIE.exe"
          )
          # Het cohortattest (#2313): de spiegel schrijft per run tagcommit,
          # run-id en beide sha256's. Het paar geldt pas als alles klopt — een
          # halve upload uit twee pogingen is daarmee nooit een cohort.
          COHORT="ocideck-windows-cohort-$VERSIE.json"
          REPO="brennodewinter/Ocideck"
          API="https://api.github.com/repos/$REPO"

          if [ -z "${GH_DISPATCH_TOKEN:-}" ]; then
            echo "GH_DISPATCH_TOKEN ontbreekt — draft Windows-assets zijn terecht niet publiek leesbaar." >&2
            exit 1
          fi
          # Elke curl draagt een tijdslimiet: een geblackholede route (DROP
          # i.p.v. REJECT) laat een kale curl anders minutenlang per poging
          # hangen, en de 90-minutenlus hieronder telt pogingen, geen tijd.
          have_asset() {
            local rid="${1:-}" artifact archive f
            test -n "$rid" || return 1
            artifact="$(gh_api "$API/actions/runs/$rid/artifacts?per_page=100" \
              | jq -r 'first(.artifacts[] | select(.name == "ocideck-windows-cohort" and .expired == false) | .archive_download_url) // empty')" || return 1
            test -n "$artifact" || return 1
            archive="$(mktemp)" || return 1
            if ! curl -fLsS --connect-timeout 15 --max-time 300 \
              -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -o "$archive" "$artifact"; then
              rm -f "$archive"; return 1
            fi
            for f in "${BESTANDEN[@]}" "$COHORT"; do
              if ! unzip -p "$archive" "$f" > "$f"; then
                rm -f "$archive"; return 1
              fi
            done
            rm -f "$archive"
          }
          # Accepteer het paar alleen als het attest één en hetzelfde cohort
          # beschrijft: onze tagcommit, de nieuwste spiegelrun (alleen te
          # controleren mét dispatch-token) en de sha256 van beide gedownloade
          # bestanden. Een halve upload — zip vervangen, installer of attest
          # nog oud — faalt hier en wordt nooit meegenomen naar SHA256SUMS.
          verify_cohort() {
            local rid="${1:-}" z e
            z="$(sha256sum "${BESTANDEN[0]}" | cut -d' ' -f1)"
            e="$(sha256sum "${BESTANDEN[1]}" | cut -d' ' -f1)"
          jq -e --arg commit "$RELEASE_SHA" --arg z "$z" --arg e "$e" --arg rid "$rid" \
              '.tag_commit == $commit
               and .sha256.zip == $z and .sha256.installer == $e
               and ($rid == "" or .run_id == ($rid | tonumber))' \
              "$COHORT" >/dev/null
          }
          gh_api() { curl -fsS --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          dispatch() {
            if [ "${{ inputs.mode }}" = candidate ]; then
              gh_api -X POST "$API/actions/workflows/release.yml/dispatches" \
                -d "$(jq -nc --arg tag "$TAG" --arg sha "$RELEASE_SHA" \
                  '{ref:"main", inputs:{mode:"candidate",version:$tag,commit_sha:$sha}}')"
            else
              gh_api -X POST "$API/actions/workflows/release.yml/dispatches" \
                -d "{\"ref\":\"$TAG\"}"
            fi
          }
          # Laatste run van de Windows-workflow op DEZE tag:
          # "status|conclusion|url|run_id". Het scheidingsteken bewaart ook een
          # lege conclusion zolang een run loopt; awk op spaties zou dan het
          # runnummer verliezen en onterecht opnieuw dispatchen.
          # De run-id is de exacte toets voor
          # "hoort deze run bij deze poging" (zie BASE_RID hieronder) én voor
          # de cohortcontrole: het paar moet uit precies die run komen.
          run_status() { gh_api "$API/actions/workflows/release.yml/runs?per_page=30" \
            | jq -r --arg t "$TAG" --arg mode "${{ inputs.mode }}" \
                'first(.workflow_runs[] | select(if $mode == "candidate" then
                  .head_branch == "main" and .display_title == ("Windows candidate " + $t)
                else .head_branch == $t end))
                // {} | "\(.status // "")|\(.conclusion // "")|\(.html_url // "")|\(.id // "")"'; }

          # #2 idempotent: staat het asset er al (push-event vuurde wél, of een
          # eerdere run), dan zijn we meteen klaar — mits het paar aantoonbaar
          # uit één cohort komt (#2313). Een gemengd paar weigeren en doorvallen
          # naar de lus: de spiegel kan op dat moment een verse upload doen.
          info="$(run_status || true)"
          IFS='|' read -r st cc LAST_URL rid <<< "$info"
          if [ "$st" = completed ] && [ "$cc" = success ] && have_asset "$rid"; then
            if verify_cohort "$rid"; then
              echo "Assets stonden er al: $(du -ch "${BESTANDEN[@]}" | tail -1 | cut -f1)"; exit 0
            fi
            echo "Aanwezige bestanden vormen geen coherent cohort — wachten op een verse upload."
          fi

          # Het anker voor "hoort die run bij deze poging" (#2300): de hoogste
          # run-id die vóór onze dispatch zichtbaar was. GitHub toont een
          # dispatch niet meteen, en run-id's zijn monotoon — daarna telt
          # alleen een run nieuwer dan dit anker als deze poging. Loopt er al
          # een build op deze tag, dan volgen we juist díe (OUR_RID): zijn
          # conclusie geldt wel voor ons.
          BASE_RID="" OUR_RID=""
          info="$(run_status || true)"
          IFS='|' read -r st cc LAST_URL BASE_RID <<< "$info"
          # #2: draait er al een build op deze tag, dan niet nog eens dispatchen.
          if [ -n "$st" ] && [ "$st" != "completed" ] && [ "$st" != "null" ]; then
            echo "Er loopt al een Windows-build ($st) — niet opnieuw dispatchen."
            OUR_RID="$BASE_RID"
          else
            echo "Windows-build dispatchen op $REPO@${TAG}…"
            dispatch || { echo "Dispatch faalde — controleer GH_DISPATCH_TOKEN (Actions: RW)." >&2; exit 1; }
            sleep 10
          fi

          # #5 poll op zowel het asset als de run-status; herdispatch alleen als
          # er na ~5 min geen nieuwe of lopende run zichtbaar is. GitHub kan een
          # gelijktijdig gestarte run tonen vóór de eigen dispatch zichtbaar is;
          # die opnieuw dispatchen zet een tweede build in de wachtrij.
          LAST_URL=""
          for POGING in $(seq 1 330); do
            rid=""
            if [ -n "${GH_DISPATCH_TOKEN:-}" ]; then
              info="$(run_status || true)"
              IFS='|' read -r st cc LAST_URL rid <<< "$info"
              echo "[$POGING] run: ${st:-<geen>} ${cc:-} ${LAST_URL:-} ${rid:-}"
            fi
            if [ "${st:-}" = completed ] && [ "${cc:-}" = success ] && have_asset "$rid"; then
              if verify_cohort "$rid"; then
                echo "Opgehaald na $POGING minuut/minuten (cohort geverifieerd): $(du -ch "${BESTANDEN[@]}" | tail -1 | cut -f1)"; exit 0
              fi
              echo "[$POGING] bestanden aanwezig maar niet één coherent cohort — halve upload? Verder wachten."
            fi
            if [ -n "${GH_DISPATCH_TOKEN:-}" ]; then
              # Hoort de zichtbaar-nieuwste run bij DEZE poging? Alleen als
              # haar id boven het anker ligt: na een eigen dispatch is dat
              # BASE_RID zelf; bij een aangehouden lopende build is OUR_RID-1
              # het anker, zodat juist die run meetelt. Een oudere failure
              # blijft informatief maar beëindigt deze poging nooit.
              DEZE="" ANKER="${BASE_RID:-0}"
              [ -n "$OUR_RID" ] && ANKER=$((OUR_RID - 1))
              if [ -n "$rid" ] && [ "$rid" -gt "$ANKER" ] 2>/dev/null; then
                DEZE=1
              fi
              if [ "$POGING" -eq 5 ] && [ -z "$DEZE" ]; then
                if [ -n "$rid" ] && [ -n "$st" ] && [ "$st" != "completed" ]; then
                  echo "Er loopt al een Windows-build ($st, $rid) — geen extra dispatch."
                else
                  echo "Nog geen run van deze poging zichtbaar — opnieuw dispatchen."; dispatch || true
                fi
              fi
              if [ "${cc:-}" = "failure" ] || [ "${cc:-}" = "cancelled" ]; then
                if [ -n "$DEZE" ]; then
                  echo "De Windows-build faalde: ${LAST_URL:-zie GitHub Actions}." >&2
                  echo "Herstel dat en hertrigger deze release-workflow." >&2
                  exit 1
                fi
                echo "[$POGING] verouderde $cc-run hoort niet bij deze poging — wachten op de nieuwe run."
              fi
            fi
            sleep 60
          done
          echo "Na 330 minuten geen coherent cohort op $TAG (laatste run: ${LAST_URL:-onbekend})." >&2
          echo "Hertrigger deze release-workflow zodra de Windows-build groen is." >&2
          exit 1

      # Eén glob die beide draagt: `ocideck-windows-x64-<versie>.zip` en
      # `ocideck-windows-x64-setup-<versie>.exe`. Valt er ooit een derde bij, dan
      # vangt test/windows_packaging_test.dart het verschil tussen wat de
      # spiegel maakt en wat hier meekomt.
      - name: Artifact bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-windows
          path: |
            ocideck-windows-x64-*
            ocideck-windows-cohort-*.json

  # De consumentproeven hieronder pakken wat de bouw niet kan: het
  # ocideck-ci-image draagt alle -dev-pakketten, dus een ontbrekende
  # runtimeafhankelijkheid in het pakketmanifest valt daar nooit op — de lib
  # is immers gewoon aanwezig. Zo ging v0.4.9 de deur uit zonder Ayatana.
  # Elke proef draait daarom in een kaal consumentimage zonder bouwgereedschap,
  # installeert het pakket zoals een gebruiker dat doet, linkt de binary na
  # met ldd en start de app onder een virtuele display. `publiceren` hangt aan
  # alle drie: één rode proef en er gaat niets de deur uit.
  consumer-deb:
    name: .deb proef op een schone Ubuntu
    needs: linux
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    # Dezelfde schone Ubuntu-proef als linux-build: geef apt ook na de tag
    # genoeg tijd voordat de eigenlijke startproef van 20 seconden begint.
    timeout-minutes: 240
    # Zelfde pin als deploy-web; kaal Ubuntu, géén bouwgereedschap.
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Node voor de artefactactie
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Installeren, linken en starten
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends xvfb fonts-dejavu-core
          apt-get install -y "./dist/ocideck-linux-amd64-${RELEASE_TAG#v}.deb"
          # Declares de control minder dan de binary linkt, dan toont ldd
          # "not found" — precies de v0.4.9-klasse (Ayatana miste in Depends).
          if ldd /usr/lib/ocideck/ocideck | grep 'not found'; then
            echo "Het .deb dekt niet alle runtimebibliotheken van de binary." >&2
            exit 1
          fi
          # Startproef: onder Xvfb moet de app opkomen en draaien blijven.
          # timeout geeft 124 als hij de volle 20 s overleefde; een crash of
          # direct wegvallen geeft iets anders en is dus rood.
          set +e
          timeout 20 xvfb-run -a ocideck
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "ocideck kwam niet op of viel binnen 20 s weg (exit $rc)." >&2
            exit 1
          fi

  consumer-debian12:
    name: Debian 12-archief proef op een schone Debian 12
    needs: linux-debian12
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    timeout-minutes: 240
    container:
      image: debian:12-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
    steps:
      - name: Node voor de artefactactie
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux-debian12, path: dist }
      - name: Uitpakken, linken en starten
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            xvfb xauth fonts-dejavu-core libgtk-3-0 libsecret-1-0 liblzma5 \
            libayatana-appindicator3-1 libgles2 libegl1 libpulse0
          mkdir -p /tmp/ocideck-test
          tar -xzf "dist/ocideck-linux-debian12-x86_64-${RELEASE_TAG#v}.tar.gz" -C /tmp/ocideck-test
          cd /tmp/ocideck-test/ocideck-linux-debian12-*
          test -x ./ocideck
          if ldd ./ocideck | grep 'not found'; then
            echo "Het Debian 12-archief mist een runtimebibliotheek." >&2
            exit 1
          fi
          set +e
          timeout 20 xvfb-run -a ./ocideck
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "OciDeck kwam niet op of viel binnen 20 s weg (exit $rc)." >&2
            exit 1
          fi

  consumer-rpm:
    name: .rpm proef op een schone Fedora
    needs: linux
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    timeout-minutes: 240
    # Kaal Fedora: de .rpm-Requires zijn sonames, dus dnf moet de libs zelf
    # uit de gewone repo's kunnen trekken — als een consument dat ook kan.
    container:
      image: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
    steps:
      - name: Node voor de artefactactie
        run: dnf install -y --setopt=install_weak_deps=False nodejs
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Installeren, linken en starten
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb dejavu-sans-fonts
          dnf install -y "./dist/ocideck-linux-x86_64-${RELEASE_TAG#v}.rpm"
          if ldd /usr/lib/ocideck/ocideck | grep 'not found'; then
            echo "Het .rpm dekt niet alle runtimebibliotheken van de binary." >&2
            exit 1
          fi
          set +e
          timeout 20 xvfb-run -a ocideck
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "ocideck kwam niet op of viel binnen 20 s weg (exit $rc)." >&2
            exit 1
          fi

  consumer-appimage:
    name: AppImage proef op een schone Ubuntu
    needs: linux
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    timeout-minutes: 240
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Node voor de artefactactie
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Uitpakken, linken en starten
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          # Een AppImage bundelt geen GTK: de runtimebibliotheken hieronder
          # zijn wat een gewone desktop al heeft. Geen -dev-pakketten, geen
          # toolchain — het beeld blijft consumentachtig.
          apt-get install -y --no-install-recommends \
            xvfb fonts-dejavu-core \
            libgtk-3-0t64 libsecret-1-0 liblzma5 libayatana-appindicator3-1 \
            libgles2 libegl1
          cd dist
          chmod +x ocideck-linux-x86_64-*.AppImage
          ./ocideck-linux-x86_64-*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/ocideck
          # De binary vindt zijn eigen lib/ via $ORIGIN (zie packaging/linux/
          # AppRun); wat ldd als "not found" toont, ontbreekt dus echt.
          if ldd squashfs-root/ocideck | grep 'not found'; then
            echo "De AppImage mist een runtimebibliotheek." >&2
            exit 1
          fi
          set +e
          timeout 20 xvfb-run -a squashfs-root/AppRun
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "De AppImage kwam niet op of viel binnen 20 s weg (exit $rc)." >&2
            exit 1
          fi

  consumer-flatpak:
    name: Flatpak installatie en inhoud op een schone Ubuntu
    needs: linux
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    timeout-minutes: 240
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Node voor de artefactactie
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Installeren en inhoud controleren
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends flatpak
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//50
          flatpak --user install -y --noninteractive --bundle "dist/ocideck-linux-x86_64-${RELEASE_TAG#v}.flatpak"
          app="$(flatpak --user info --show-location com.dewinter.ocideck)"
          flatpak --user info --show-metadata com.dewinter.ocideck | grep -Fx 'runtime=org.gnome.Platform/x86_64/50'
          test -x "$app/files/bin/ocideck"
          test -x "$app/files/bin/git"
          test -x "$app/files/lib/ocideck/ocideck"
          test -x "$app/files/libexec/git-core/git-remote-https"
          sh -n "$app/files/bin/ocideck"
          (cd "$app/files" && sha256sum -c share/doc/ocideck-flatpak/FILES.sha256)
          cmp "$app/files/share/doc/ocideck-flatpak/components.cdx.json" "dist/ocideck-linux-x86_64-${RELEASE_TAG#v}.flatpak.cdx.json"

  candidate:
    name: Kandidaat volledig verpakken
    needs: [web, linux, linux-debian12, macos, windows-ophalen, consumer-deb, consumer-debian12, consumer-rpm, consumer-appimage, consumer-flatpak]
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: docker
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-web, path: dist }
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux-debian12, path: dist }
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-macos, path: dist }
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-windows, path: dist }
      - name: Cohort, bestanden en checksums controleren
        run: |
          set -eu
          VERSIE="${RELEASE_TAG#v}"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          COHORT="dist/ocideck-windows-cohort-$VERSIE.json"
          test -f "$COHORT"
          jq -e --arg sha "$RELEASE_SHA" \
            --arg zip "$(sha256sum "dist/ocideck-windows-x64-$VERSIE.zip" | cut -d' ' -f1)" \
            --arg exe "$(sha256sum "dist/ocideck-windows-x64-setup-$VERSIE.exe" | cut -d' ' -f1)" \
            '.tag_commit == $sha and .sha256.zip == $zip and .sha256.installer == $exe and (.run_id | type == "number")' \
            "$COHORT" >/dev/null
          jq -n --arg version "$RELEASE_TAG" --arg commit "$RELEASE_SHA" \
            --argjson windows_run_id "$(jq -r .run_id "$COHORT")" \
            '{version:$version, commit:$commit, windows_run_id:$windows_run_id}' \
            > candidate-manifest.json
          rm "$COHORT"
          cp sbom/ocideck.cdx.json "dist/ocideck-$VERSIE.cdx.json"
          cp sbom/ocideck.spdx.json "dist/ocideck-$VERSIE.spdx.json"
          printf '%s\n' \
            "ocideck-$VERSIE.cdx.json" "ocideck-$VERSIE.spdx.json" \
            "ocideck-web-$VERSIE.tar.gz" "ocideck-linux-x64-$VERSIE.tar.gz" \
            "ocideck-linux-debian12-x86_64-$VERSIE.tar.gz" \
            "ocideck-linux-amd64-$VERSIE.deb" "ocideck-linux-x86_64-$VERSIE.rpm" \
            "ocideck-linux-x86_64-$VERSIE.AppImage" \
            "ocideck-linux-x86_64-$VERSIE.flatpak" \
            "ocideck-linux-x86_64-$VERSIE.flatpak.cdx.json" \
            "ocideck-macos-$VERSIE.zip" "ocideck-windows-x64-$VERSIE.zip" \
            "ocideck-windows-x64-setup-$VERSIE.exe" | LC_ALL=C sort > /tmp/expected
          find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          (cd dist && sha256sum ./* > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -czf "ocideck-release-candidate-$RELEASE_TAG.tar.gz" candidate-manifest.json dist/*
      - name: Kandidaat bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-release-candidate
          path: ocideck-release-candidate-${{ env.RELEASE_TAG }}.tar.gz

  publiceren:
    name: Release publiceren
    needs: gate
    if: ${{ github.event_name == 'push' || inputs.mode == 'publish' }}
    runs-on: docker
    # Deze job muteeert buiten ons gebaande pad: elke call draagt daarom een
    # connect- én responstime-out (de curl-flags in de stappen; een endpoint dat
    # TCP accepteert maar niet antwoordt zou de job anders tot de zes-uur-
    # standaard laten hangen) en deze harde buitenmuur dekt wat toch wegglipt.
    timeout-minutes: 30
    # Voorgebakken CI-image i.p.v. kaal ubuntu + per-run apt-get: node/git/curl/
    # ca-certificates/jq zitten er al in (zie .forgejo/ci-image/Dockerfile) en het
    # image staat door de bouw-jobs al warm op de runner. #11 van het
    # releaseketen-verhardingsplan.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Geverifieerde kandidaat ophalen
        env:
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          TOKEN="${RELEASE_TOKEN:-$RUN_TOKEN}"
          RID="$(git cat-file -p "refs/tags/$GITHUB_REF_NAME" | sed -n 's/^Candidate-Run: \([0-9][0-9]*\)$/\1/p')"
          case "$RID" in ''|*[!0-9]*) echo "Ongeldig kandidaat-runnummer." >&2; exit 1 ;; esac
          if [ "${{ inputs.mode }}" = publish ] && [ "$RID" != "${{ inputs.candidate_run_id }}" ]; then
            echo "Herstart vraagt een ander kandidaat-runnummer dan de vaste tag." >&2; exit 1
          fi
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          curl -fsS --connect-timeout 15 --max-time 60 \
            -H "Authorization: token $TOKEN" "$API/actions/runs/$RID" > /tmp/candidate-run.json
          jq -e --arg sha "$(git rev-parse HEAD)" \
            '.workflow_id == "release.yml" and .commit_sha == $sha and .status == "success"' \
            /tmp/candidate-run.json >/dev/null
          curl -fsS --connect-timeout 15 --max-time 60 \
            -H "Authorization: token $TOKEN" "$API/actions/runs/$RID/artifacts" > /tmp/artifacts.json
          URL="$(jq -r 'first(.[] | select(.name == "ocideck-release-candidate" and .expired == false) | .archive_download_url) // empty' /tmp/artifacts.json)"
          case "$URL" in "$GITHUB_SERVER_URL"/*) ;; *) echo "Kandidaat-URL ontbreekt of wijst buiten de forge." >&2; exit 1 ;; esac
          curl -fsSL --connect-timeout 15 --max-time 300 \
            -H "Authorization: token $TOKEN" "$URL" -o /tmp/candidate-artifact.zip
          test "$(unzip -Z1 /tmp/candidate-artifact.zip | wc -l | tr -d ' ')" = 1
          unzip -p /tmp/candidate-artifact.zip "ocideck-release-candidate-$GITHUB_REF_NAME.tar.gz" > /tmp/candidate.tar.gz
          test -s /tmp/candidate.tar.gz
          if tar -tzf /tmp/candidate.tar.gz | grep -E '^/|(^|/)\.\.(/|$)' ; then
            echo "Onveilig pad in kandidaatbundel." >&2; exit 1
          fi
          tar -xzf /tmp/candidate.tar.gz
          jq -e --arg version "$GITHUB_REF_NAME" --arg commit "$(git rev-parse HEAD)" \
            '.version == $version and .commit == $commit and (.windows_run_id | type == "number")' \
            candidate-manifest.json >/dev/null
          (cd dist && sha256sum -c SHA256SUMS)
          echo "Kandidaatrun $RID voor $GITHUB_REF_NAME@$(git rev-parse HEAD) geverifieerd."

      - name: Releasetekst opmaken
        run: |
          set -eu
          VERSIE="${GITHUB_REF_NAME#v}"
          sed -e "s/@VERSIE@/$VERSIE/g" -e "s/@TAG@/$GITHUB_REF_NAME/g" \
            .forgejo/release-body.md > /tmp/body.md
          cat /tmp/body.md

      - name: Release aanmaken en bestanden eraan hangen
        env:
          # Het automatisch geïnjecteerde token van de run. Staat er een
          # RELEASE_TOKEN als secret, dan wint die — nodig als het ingebouwde
          # token in een toekomstige Forgejo-versie geen releases meer mag
          # schrijven. Zie docs/BUILD.md.
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          TOKEN="${RELEASE_TOKEN:-$RUN_TOKEN}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          test -n "$TOKEN" || {
            echo "Geen GITHUB_TOKEN of RELEASE_TOKEN beschikbaar om de release te publiceren." >&2
            exit 1
          }

          # Een streepje in de tag betekent semver-voorloper (`v0.1.0-rc1`), en
          # die hoort als prerelease gemarkeerd te staan: Forgejo laat hem dan
          # niet als "laatste release" gelden, dus wie de downloadknop volgt
          # krijgt hem niet voorgeschoteld.
          case "$GITHUB_REF_NAME" in
            *-*) VOORLOPER=true ;;
            *)   VOORLOPER=false ;;
          esac
          # draft:true (#2311): deze job maakt de release aan en vult hem, maar
          # publiceert hem NIET — de minisign-handtekening bestaat pas nadat
          # release_auto.sh lokaal heeft getekend. Pas ná een geverifieerde
          # handtekening flipt die het draft-vlag naar gepubliceerd; elke fout
          # hieronder laat de wereld dus een draft zien in plaats van een
          # halve publieke release. De website-downloads-workflow volgt via
          # een dispatch vanuit datzelfde tekenstuk.
          jq -n --arg tag "$GITHUB_REF_NAME" \
                --arg name "OciDeck $GITHUB_REF_NAME" \
                --rawfile body /tmp/body.md \
                --argjson pre "$VOORLOPER" \
                '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:$pre}' \
            > /tmp/release.json

          # Herstarten moet gewoon werken. De waarschijnlijkste reden om deze
          # workflow opnieuw te draaien is dat de Windows-build op de spiegel te
          # laat kwam; dan bestaat de release van de vorige poging al, en een
          # tweede POST loopt stuk. Dus: bestaat hij, dan hergebruiken.
          #
          # Elke curl hier draagt --connect-timeout + --max-time (#2312): een
          # endpoint dat TCP accepteert maar nooit antwoordt hing deze job
          # anders tot de runnerlimiet. Bij HTTP 000 was de mutatie misschien
          # tóch gelukt — daarom reconcilert ALLE niet-201-uitkomsten eerst
          # read-only via GET-by-tag voordat er iets anders gebeurt.
          # `|| CODE=000` houdt `set -e` tegen: een transportfout is géén
          # bewijs dat de mutatie niet is geland — HTTP 000 loopt daarom
          # bewust dezelfde reconcile-tak in als een geweigerde POST.
          CODE=$(curl -s -o /tmp/created.json -w '%{http_code}' --connect-timeout 15 --max-time 60 \
            -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d @/tmp/release.json) || CODE=000
          if [ "$CODE" = "201" ]; then
            ID=$(jq -r '.id' /tmp/created.json)
            echo "Release $GITHUB_REF_NAME aangemaakt (id $ID)."
          else
            echo "POST /releases gaf HTTP $CODE — reconcileren via GET-by-tag."
            BESTAAND=$(curl -s -o /tmp/bestaand.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 60 \
              -H "Authorization: token $TOKEN" "$API/releases/tags/$GITHUB_REF_NAME") \
              || BESTAAND=000
            if [ "$BESTAAND" != "200" ]; then
              if [ "$CODE" = "000" ]; then
                echo "Externe toestand onbekend: de POST bereikte de server mogelijk wel," >&2
                echo "maar het antwoord niet terug, en ook de reconcile-GET faalde." >&2
              else
                echo "Release aanmaken gaf HTTP $CODE en hij bestaat ook niet:" >&2
              fi
              cat /tmp/created.json >&2
              exit 1
            fi
            ID=$(jq -r '.id' /tmp/bestaand.json)
            echo "Bestaande release hergebruikt (id $ID)."
          fi

          # Een rerun mag een werkend asset nooit verwijderen vóór de vervanger
          # aantoonbaar compleet bij Forgejo staat. Bij gelijke bytes hergebruiken
          # we het bestaande asset. Bij andere of dubbele bytes uploaden we eerst
          # onder een unieke kandidaatnaam, downloaden en hashen die kandidaat,
          # hernoemen hem daarna naar de definitieve naam en ruimen pas dan de
          # oude ids op. Een fout laat dus altijd óf het oude asset óf een reeds
          # geverifieerde kandidaat achter.
          curl -fsS --connect-timeout 15 --max-time 60 \
            -H "Authorization: token $TOKEN" "$API/releases/$ID/assets" \
            > /tmp/bijlagen.json
          VERSIE="${GITHUB_REF_NAME#v}"
          printf '%s\n' \
            SHA256SUMS \
            "ocideck-$VERSIE.cdx.json" \
            "ocideck-$VERSIE.spdx.json" \
            "ocideck-web-$VERSIE.tar.gz" \
            "ocideck-linux-x64-$VERSIE.tar.gz" \
            "ocideck-linux-debian12-x86_64-$VERSIE.tar.gz" \
            "ocideck-linux-amd64-$VERSIE.deb" \
            "ocideck-linux-x86_64-$VERSIE.rpm" \
            "ocideck-linux-x86_64-$VERSIE.AppImage" \
            "ocideck-linux-x86_64-$VERSIE.flatpak" \
            "ocideck-linux-x86_64-$VERSIE.flatpak.cdx.json" \
            "ocideck-macos-$VERSIE.zip" \
            "ocideck-windows-x64-$VERSIE.zip" \
            "ocideck-windows-x64-setup-$VERSIE.exe" \
            | LC_ALL=C sort > /tmp/verwachte-assets
          find dist -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > /tmp/werkelijke-assets
          if ! diff -u /tmp/verwachte-assets /tmp/werkelijke-assets; then
            echo "dist/ bevat niet exact de veertien verwachte release-assets; publicatie geweigerd." >&2
            exit 1
          fi

          while IFS= read -r NAAM; do
            BESTAND="dist/$NAAM"
            LOKAAL_SHA="$(sha256sum "$BESTAND" | awk '{print $1}')"
            OUD_AANTAL="$(jq -r --arg n "$NAAM" '[.[] | select(.name==$n)] | length' /tmp/bijlagen.json)"

            # Eén bestaand asset met exact dezelfde bytes is al de gewenste
            # eindtoestand. Downloaden toetst de serverbytes, niet metadata.
            if [ "$OUD_AANTAL" = 1 ]; then
              OUD_URL="$(jq -r --arg n "$NAAM" '.[] | select(.name==$n) | .browser_download_url' /tmp/bijlagen.json)"
              curl -fsSL --connect-timeout 15 --max-time 300 \
                -H "Authorization: token $TOKEN" "$OUD_URL" -o /tmp/bestaand-asset
              OUD_SHA="$(sha256sum /tmp/bestaand-asset | awk '{print $1}')"
              if [ "$OUD_SHA" = "$LOKAAL_SHA" ]; then
                echo "  = $NAAM (bestaande, identieke bytes hergebruikt)"
                continue
              fi
            fi

            KANDIDAAT=".$NAAM.kandidaat-${GITHUB_RUN_ID:-handmatig}-${GITHUB_RUN_ATTEMPT:-1}"
            CODE=$(curl -s -o /tmp/asset.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 300 -X POST \
              "$API/releases/$ID/assets?name=$KANDIDAAT" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$BESTAND") || CODE=000
            if [ "$CODE" != "201" ]; then
              # Onzekere mutatie: bij HTTP 000 kan de upload geland zijn zónder
              # dat het antwoord terugkwam. Een tweede POST zou dan twee
              # schrijvers maken — dus eerst read-only reconcileren op de
              # kandidaatnaam (#2312).
              echo "Kandidaat-upload voor $NAAM gaf HTTP $CODE — reconcileren op naam."
              curl -fsS --connect-timeout 15 --max-time 60 \
                -H "Authorization: token $TOKEN" "$API/releases/$ID/assets" \
                > /tmp/reconcile-assets.json || {
                  echo "Externe toestand onbekend: reconcile-GET faalde ook; oude asset(s) blijven staan." >&2
                  exit 1
                }
              KANDIDAAT_ID="$(jq -r --arg n "$KANDIDAAT" \
                '[.[] | select(.name==$n)][0].id // empty' /tmp/reconcile-assets.json)"
              if [ -z "$KANDIDAAT_ID" ]; then
                echo "Kandidaat voor $NAAM staat er niet (HTTP $CODE) — bevestigd mislukt:" >&2
                cat /tmp/asset.json >&2
                exit 1
              fi
              echo "Kandidaat stond er toch al (id $KANDIDAAT_ID) — verder met die."
            else
              KANDIDAAT_ID="$(jq -r '.id' /tmp/asset.json)"
              test -n "$KANDIDAAT_ID" && test "$KANDIDAAT_ID" != null
            fi
            KANDIDAAT_URL="$(jq -r --argjson kid "$KANDIDAAT_ID" \
              '.[] | select(.id==$kid) | .browser_download_url' \
              /tmp/reconcile-assets.json 2>/dev/null || true)"
            if [ -z "$KANDIDAAT_URL" ]; then
              KANDIDAAT_URL="$(jq -r '.browser_download_url' /tmp/asset.json)"
            fi
            test -n "$KANDIDAAT_URL" && test "$KANDIDAAT_URL" != null
            curl -fsSL --connect-timeout 15 --max-time 300 \
              -H "Authorization: token $TOKEN" "$KANDIDAAT_URL" -o /tmp/kandidaat-asset
            KANDIDAAT_SHA="$(sha256sum /tmp/kandidaat-asset | awk '{print $1}')"
            if [ "$KANDIDAAT_SHA" != "$LOKAAL_SHA" ]; then
              echo "Geüploade kandidaat voor $NAAM heeft SHA256 $KANDIDAAT_SHA, verwacht $LOKAAL_SHA; oude asset(s) blijven staan." >&2
              exit 1
            fi

            jq -n --arg name "$NAAM" '{name:$name}' > /tmp/asset-naam.json
            CODE=$(curl -s -o /tmp/hernoemd.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 60 -X PATCH \
              "$API/releases/$ID/assets/$KANDIDAAT_ID" \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d @/tmp/asset-naam.json) || CODE=000
            # Forgejo documenteert 201 voor deze PATCH; 200 wordt door oudere
            # Gitea-compatibele versies gebruikt. Beide betekenen dat de
            # kandidaat nu de definitieve naam draagt.
            if [ "$CODE" != 200 ] && [ "$CODE" != 201 ]; then
              # Ook hier reconcileren: bij een onzeker antwoord kan de hernoeming
              # tóch gelukt zijn — dan staat onze kandidaat-id al onder $NAAM.
              curl -fsS --connect-timeout 15 --max-time 60 \
                -H "Authorization: token $TOKEN" "$API/releases/$ID/assets" \
                > /tmp/reconcile-assets.json || {
                  echo "Hernoemen van $NAAM gaf HTTP $CODE en reconcile faalde — toestand onbekend; oude asset(s) blijven staan." >&2
                  exit 1
                }
              if ! jq -e --arg n "$NAAM" --argjson kid "$KANDIDAAT_ID" \
                '[.[] | select(.name==$n and .id==$kid)] | length == 1' \
                /tmp/reconcile-assets.json >/dev/null; then
                echo "Geverifieerde kandidaat voor $NAAM kon niet worden hernoemd (HTTP $CODE); oude asset(s) blijven staan." >&2
                cat /tmp/hernoemd.json >&2
                exit 1
              fi
              echo "Hernoemen bleek tóch gelukt (reconcile via assets-lijst)."
            fi

            jq -r --arg n "$NAAM" '.[] | select(.name==$n) | .id' /tmp/bijlagen.json \
              | while IFS= read -r OUD_ID; do
                  [ -n "$OUD_ID" ] || continue
                  curl -fsS -o /dev/null -X DELETE --connect-timeout 15 --max-time 60 \
                    -H "Authorization: token $TOKEN" \
                    "$API/releases/$ID/assets/$OUD_ID" || {
                      # DELETE is opruiming: reconcilert of hij weg is. Een
                      # falende GET is géén 404 — ook dat kan 'onbekend' zijn;
                      # de eindcontrole hieronder vangt een overblijvend asset.
                      CHECK=$(curl -s -o /dev/null -w '%{http_code}' \
                        --connect-timeout 15 --max-time 60 \
                        -H "Authorization: token $TOKEN" \
                        "$API/releases/$ID/assets/$OUD_ID" || true)
                      case "$CHECK" in
                        404)
                          echo "Oude asset $OUD_ID was na onzekere DELETE al weg." ;;
                        200)
                          echo "Oude asset $OUD_ID kon niet worden verwijderd." >&2
                          exit 1 ;;
                        *)
                          echo "Toestand oude asset $OUD_ID onbekend (HTTP $CHECK); eindcontrole dekt dit af." >&2 ;;
                      esac
                    }
                done
            echo "  + $NAAM (kandidaat geverifieerd, oude versie veilig vervangen)"
          done < /tmp/verwachte-assets

          # Unieke verwachte bijlagen controleren. Extra handmatige bijlagen
          # zoals SHA256SUMS.minisig zijn toegestaan, maar elk door deze run
          # geproduceerd bestand moet exact één keer bestaan én dezelfde bytes
          # bevatten als dist/.
          echo "Unieke verwachte bijlagen controleren…"
          curl -fsS --connect-timeout 15 --max-time 60 \
            -H "Authorization: token $TOKEN" "$API/releases/$ID/assets" \
            > /tmp/bijlagen-na-upload.json
          while IFS= read -r NAAM; do
            AANTAL="$(jq -r --arg n "$NAAM" '[.[] | select(.name==$n)] | length' /tmp/bijlagen-na-upload.json)"
            if [ "$AANTAL" != 1 ]; then
              echo "Release bevat $AANTAL bijlagen met verwachte naam '$NAAM' (verwacht exact 1)." >&2
              exit 1
            fi
            URL="$(jq -r --arg n "$NAAM" '.[] | select(.name==$n) | .browser_download_url' /tmp/bijlagen-na-upload.json)"
            curl -fsSL --connect-timeout 15 --max-time 300 \
              -H "Authorization: token $TOKEN" "$URL" -o /tmp/eind-asset
            SERVER_SHA="$(sha256sum /tmp/eind-asset | awk '{print $1}')"
            LOKAAL_SHA="$(sha256sum "dist/$NAAM" | awk '{print $1}')"
            if [ "$SERVER_SHA" != "$LOKAAL_SHA" ]; then
              echo "Definitieve bijlage $NAAM heeft SHA256 $SERVER_SHA, verwacht $LOKAAL_SHA." >&2
              exit 1
            fi
          done < /tmp/verwachte-assets

          echo
          # Nog steeds draft (#2311): publicatie volgt pas in release_auto.sh,
          # nadat de minisign-handtekening lokaal is aangebracht én
          # teruggelezen geverifieerd. Een release die je hier ziet staan is
          # dus bewust nog niet publiek.
          echo "Assets compleet; release ${GITHUB_REF_NAME} blijft draft tot de"
          echo "lokale tekenstap (scripts/release_auto.sh) hem publiceert."

      # De losse .deb blijft een release-asset; daarnaast publiceren we exact
      # dezelfde bytes naar Forgejo's eigen, ondertekende Debian-registry zodat
      # installaties via apt ook gewone updates krijgen. Een apart token houdt
      # de bevoegdheid beperkt tot packages; het bestaande CI_IMAGE_TOKEN heeft
      # precies write:package. Een ontbrekend token of een
      # conflicterende versie maakt de release rood in plaats van stil een
      # verouderde pakketbron achter te laten.
      - name: Debian-pakketbron bijwerken
        env:
          PACKAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
        run: |
          VERSIE="${GITHUB_REF_NAME#v}"
          scripts/publish_debian_package.sh \
            "dist/ocideck-linux-amd64-$VERSIE.deb"
