# Automatic release-bundle browser acceptance (#3212).
name: web-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.tool-versions'
      - 'Makefile'
      - 'tool/web-wasm-check/**'
      - 'tool/release_size_limits.json'
      - 'tool/*web*.dart'
      - 'test/web_gate_triggers_test.dart'
      - '.forgejo/workflows/web-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.tool-versions'
      - 'Makefile'
      - 'tool/web-wasm-check/**'
      - 'tool/release_size_limits.json'
      - 'tool/*web*.dart'
      - 'test/web_gate_triggers_test.dart'
      - '.forgejo/workflows/web-gate.yml'

permissions:
  contents: read

concurrency:
  group: web-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.50.0@sha256:e43e18573ee176a5f19165230e959d559d3f5d0116d9f151619529f99cba2841
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # De werkkopie is van een andere uid dan root; zonder dit weigert git
      # bewerkingen. `/opt/flutter` (ingebakken) heeft dezelfde behandeling
      # nodig, want Flutter draait git op zijn eigen checkout.
      - name: Werkkopie en Flutter vertrouwen
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Gepinde Flutter controleren
        run: make check-toolchain

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile

      # Zelfde sleutel als static-gate/linux-gate/release, met opzet: één cache
      # bedient alle poorten. Op versie alleen, geen `hashFiles` en geen
      # `restore-keys` — zie #1748 en `test/dartcv_cache_key_test.dart`.
      - name: dartcv4-versie uit pubspec.lock
        id: dartcv
        run: |
          VERSIE="$(grep -A8 '^  dartcv4:' pubspec.lock | grep 'version:' | sed 's/.*version: "//;s/".*//')"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"
      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ steps.dartcv.outputs.versie }}

      # De poort staat in de Makefile: `make check-web` bouwt de bundel en
      # draait er de drie controles op (harding, release-artefacten, verse
      # gebundelde documentatie). Ze hier overtypen zou een tweede waarheid
      # opleveren die uit elkaar gaat lopen — dezelfde reden waarom static-gate
      # `make check-static` aanroept.
      - name: De webbundel bouwen en controleren
        run: make check-web

      - name: Node voor de gepinde browserproef
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Gepinde Chromium-proef installeren
        run: |
          npm ci --prefix tool/web-wasm-check
          cd tool/web-wasm-check
          npx playwright install --with-deps chromium

      - name: WASM, JavaScript-terugval en rendering zonder isolatie
        env:
          OCIDECK_WASM_SCREENSHOT_DIR: build/web-browser
        run: |
          mkdir -p build/web-browser
          make check-web-browser > build/web-browser/run.log 2>&1 || { cat build/web-browser/run.log; exit 1; }
          cat build/web-browser/run.log

      - name: Browserbewijs bewaren, ook bij fouten
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: web-browser-${{ github.sha }}
          path: build/web-browser/
          if-no-files-found: warn
          retention-days: 7
