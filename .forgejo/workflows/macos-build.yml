# Bouwt de macOS-desktopversie op de Mac-runner (mac-brenno, label macos,
# host-modus — Apple staat macOS alleen op Apple-hardware toe, dus deze build
# draait niet op de pawprint-server maar op een aangemelde Mac). Staat die Mac
# uit, dan wacht de run tot hij er weer is; een nieuwe push naar main vervangt
# een wachtende run gewoon.
#
# Host-modus betekent: de job draait direct op de Mac, met de toolchain die
# daar staat — dezelfde gepinde officiële Flutter die check-toolchain lokaal
# al bewaakt. Er wordt hier dus bewust níets geïnstalleerd, en er valt hier dus
# ook niets te cachen.
name: macos-build

# Handmatig, plus een smalle post-merge-trekker — dezelfde afweging als in
# linux-build.yml, om dezelfde reden.
#
# Het argument uit #790 was: bij elke `v*`-tag bouwt `release.yml` deze app al,
# dus na een merge nog eens bouwen voegt niets toe. Dat klopt voor het inpakken
# en niet voor het bouwen: géén poort bouwt de macOS-app, want `make check`
# draait `flutter test`. Op Linux kostte dat de release van v0.4.9 — een plugin
# eiste een systeembibliotheek die niemand installeerde, en de eerste machine
# die het merkte was de releaseketen. Hier kan hetzelfde: een Flutter-bump die
# de Podfile, een plugin of de gegenereerde Xcode-config raakt, breekt de build
# pas bij de tag.
#
# Dus bouwt hij weer na een merge, maar alleen wanneer er iets veranderde dat de
# *native* build kan breken. Bij gewoon Dart-werk zwijgt hij. Staat de Mac uit,
# dan wacht de run; een volgende merge vervangt een wachtende run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'macos/**'
      - 'third_party/**'
      - '.tool-versions'
      - '.forgejo/workflows/macos-build.yml'

jobs:
  build-macos:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: macOS-release bouwen
        run: flutter build macos --release

      # Deze runner is persistent (build/ blijft staan tussen runs), dus een
      # incrementele build zou verouderde doc-assets kunnen meenemen. Toets dat
      # de docs in de .app byte-voor-byte gelijk zijn aan docs/ op schijf.
      - name: Gebundelde documentatie vers?
        run: dart run tool/check_bundled_docs_fresh.dart build/macos

      - name: Bundel inpakken
        # ditto bewaart symlinks en resource forks — een .app die door een
        # gewone zip gaat, start niet meer.
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" ocideck-macos.zip

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-macos
          path: ocideck-macos.zip
