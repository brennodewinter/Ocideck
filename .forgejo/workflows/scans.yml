# De geheimen- en SAST-scan van OciDeck (#778). Zelfde doelen als lokaal:
# `make check-secrets` (gitleaks + trufflehog) en `make sast` (semgrep).
#
# **Waarom dit een eigen workflow is en geen job in `ci.yml`.** Het issue vroeg
# om een tweede job náást `gate`, en dat kan niet meer: `on:` geldt per
# workflow, en `ci.yml` is sinds #790 de uitbrengpoort die alleen op een
# `v*`-tag vuurt. Een job daarin zou pas scannen als het geheim al op main
# staat en er een tag omheen zit — precies te laat. Een eigen bestand is de
# enige manier om deze scans op een ander moment te laten draaien dan de poort.
#
# **Waarom dit per PR draait en niet meer per push naar main.** De reden voor
# #790 was de klok: een poortrun kostte 22 minuten en `make check` draaide toch
# al vóór elke push. Die redenering gaat over de dúúr, niet over het principe —
# en deze scans duren lokaal 17 en 2 seconden. Voor een geheim is het moment
# bovendien niet inwisselbaar: gevonden vóór de merge is een wijziging, gevonden
# erna staat het in de historie en is intrekken de enige echte remedie. Daarom
# draait dit op de PR, waar het geheim nog te keren is.
#
# **Waarom niet óók op `push: main`, zoals #778 het eerst opzette.** Omdat
# gitleaks en trufflehog de héle historie scannen en niet de wijziging: de run ná
# de merge herhaalt exact wat de PR-run een paar minuten eerder al zag. Die
# tweede run voegde geen enkel signaal toe en was juist de enige bron van ruis —
# snel opeenvolgende merges naar main annuleerden elkaars lopende run
# (concurrency), en zo'n afgebroken run meldt zich als `failure` en mailt.
# Weggehaald: het beveiligingssignaal zit vóór de merge, de post-merge-run was
# alleen kosten. Wat hiermee vervalt is dekking van een commit die rechtstreeks
# op main wordt gezet zónder PR — en zo werkt deze repo niet.
#
# **Waarom op het voorgebakken scan-image en niet meer op een kaal ubuntu.** Deze
# workflow vuurde bij élke PR en bouwde de omgeving voorheen per run opnieuw op:
# apt-tools installeren en drie scanners van het net halen (gitleaks + trufflehog
# als release-tarball, semgrep uit een verse pip-venv). Gemeten ~3 minuten per run,
# waarvan vrijwel alles installeren was en amper 19 seconden scannen (#778); en
# drie downloads per run zijn drie kansen op een netstoring die niets met deze
# repo te maken heeft. Dat werk is nu voorgebakken in
# `pawprint.vigilis.online/librekat/ocideck-scans:<pins>` (zie
# `.forgejo/ci-image/scans.Dockerfile` en `docs/CHECKS.md`): de drie scanners
# zitten er sha256-geverifieerd in, dus de per-run-installatie én het net vervallen.
#
# **Waarom dit mocht, terwijl scanners CACHEN bewust niet mocht.** `scans.yml`
# weigerde ooit een `actions/cache` op de scanner-binaries omdat een cache-restore
# een sha256-geverifieerde download van een BEVEILIGINGSscanner zou vervangen door
# een artefact van een eerdere run, zónder de hercontrole die `check-toolchain` de
# Flutter-toolchain wél geeft — "groen" zou stil iets anders kunnen gaan betekenen.
# Een voorgebakken image neemt dat op twee punten weg: (1) de sha256-verificatie is
# niet weg maar naar bouwtijd verplaatst (zie de Dockerfile), en (2) deze workflow
# krijgt de ontbrekende hercontrole terug — de stap "Ingebakken scanner-versies ==
# de pins" hieronder toetst fail-closed dat het image draagt wat de pins zeggen,
# net zoals `check-toolchain` dat voor Flutter doet.
#
# **Pin-koppeling.** Het image-tag ís de drie scanner-pins
# (`gl<gitleaks>-th<trufflehog>-sg<semgrep>`). De pins staan hieronder in `env` —
# hun ENIGE andere plek is `.github/pinned-ci-versions.json`, en
# `pinned_versions_manifest_test` houdt die twee gelijk. Bump je een pin, dan
# verandert het tag mee; loopt het image achter (of vergat iemand het tag bij te
# werken), dan valt de hercontrole hieronder om — fail-closed, geen stille drift.
# `ci-image-scans.yml` publiceert het nieuwe tag automatisch bij een pin-wijziging.
name: scans

on:
  pull_request:
  workflow_dispatch:

# **Waarom een superseded run mag worden afgebroken.** Duwt iemand een nieuwe
# commit op een PR terwijl de vorige scan nog loopt, dan zet die de lopende run
# opzij. Afbreken kost hier niets, en dat is geen aanname over snelheid maar een
# eigenschap van wat er gemeten wordt: `gitleaks git` en `trufflehog git` scannen
# de héle historie, dus de latere run dekt onverkort alles wat de afgebroken run
# zou hebben gezien. Bij een poort die alleen de wijziging bekijkt zou dit fout zijn.
#
# De grootste bron van zulke afbrekingen — snel opeenvolgende merges naar main —
# is met het schrappen van de `push`-trigger hierboven verdwenen; wat rest is het
# zeldzamere geval van een PR die tijdens de run een nieuwe commit krijgt. Een
# afgebroken run meldt zich als `failure` en kan mailen; dat het er nu bijna geen
# meer zijn, is precies de bedoeling.
concurrency:
  group: scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scans:
    runs-on: docker
    # De drie scanners zitten voorgebakken in dit image; het tag ís de drie pins.
    # Het image is anoniem pullbaar (publieke org) en de dind heeft het lokaal;
    # valt de registry toch weg, dan start de job niet — dezelfde beschikbaarheids-
    # grens als de runner zelf.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-scans:gl8.30.1-th3.95.9-sg1.171.0
    env:
      # De enige plek náást `.github/pinned-ci-versions.json` waar deze drie
      # versies staan; `pinned_versions_manifest_test` houdt ze gelijk. Ze zijn
      # hier geen download-parameter meer (dat gebeurt op bouwtijd in het image)
      # maar de verwachte waarde waartegen de hercontrole hieronder toetst.
      GITLEAKS_VERSION: 8.30.1
      TRUFFLEHOG_VERSION: 3.95.9
      SEMGREP_VERSION: 1.171.0
    steps:
      # De hercontrole die scanners-in-een-image pas verdedigbaar maakt: toets dat
      # het ingebakken image exact de gepinde versies draagt. Dit is het equivalent
      # van `check-toolchain` voor Flutter — zonder deze stap zou een achtergebleven
      # of verkeerd getagd image stil kunnen scannen met andere scanners, en dan
      # betekent "groen" niet meer hetzelfde over de tijd. Fail-closed: wijkt één
      # versie af, dan valt de poort hier om, vóór er iets gescand is. `trufflehog
      # --version` schrijft naar stderr, vandaar `2>&1`.
      - name: Ingebakken scanner-versies == de pins
        run: |
          set -eu
          fail=0
          check() {
            name="$1"; want="$2"; got="$3"
            if printf '%s' "$got" | grep -qF -- "$want"; then
              echo "ok: $name $want"
            else
              echo "MISMATCH: $name wil $want, image meldt: $got"; fail=1
            fi
          }
          check gitleaks   "$GITLEAKS_VERSION"   "$(gitleaks version 2>&1)"
          check trufflehog "$TRUFFLEHOG_VERSION" "$(trufflehog --version 2>&1)"
          check semgrep    "$SEMGREP_VERSION"    "$(semgrep --version 2>&1)"
          test "$fail" -eq 0

      - uses: actions/checkout@v4
        with:
          # ZONDER DIT IS DE HELE WORKFLOW THEATER. `actions/checkout` kloont
          # standaard één commit diep, en `gitleaks git` en `trufflehog git`
          # scannen de histórie: op een ondiepe kloon kijken ze naar bijna niets
          # en melden groen. Een geheim dat drie commits terug is toegevoegd en
          # daarna "verwijderd" staat er nog steeds — dat is nu juist het geval
          # dat deze scan moet vinden.
          fetch-depth: 0

      # De repo is van een andere uid dan root; zonder dit weigert git elke
      # bewerking en falen de historie-scans op iets dat niets met een geheim te
      # maken heeft.
      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # De commando's zelf staan bewust niet hier maar in de Makefile: `make
      # check-secrets` en `make sast` zijn precies wat een bijdrager lokaal
      # draait. Ze hier overtypen zou twee waarheden opleveren die uit elkaar
      # gaan lopen.
      #
      # `--no-verification` zit in het doel zelf en moet daar blijven: zonder
      # die vlag stuurt trufflehog kandidaat-sleutels naar de uitgevende dienst
      # om te zien of ze leven. Dat is uitgaand verkeer met een mogelijk echt
      # geheim erin, vanaf een buildmachine.
      - name: Geheimen
        run: make check-secrets

      # `make sast` gebruikt de lokale regels uit semgrep/ocideck.yaml en
      # `--metrics=off`. Nooit `--config auto`: dat haalt regels over het
      # netwerk tijdens het scannen en stuurt telemetrie mee.
      - name: SAST
        run: make sast
