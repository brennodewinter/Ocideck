name: Linux desktop start

on:
  workflow_dispatch:
    inputs:
      startup_regression:
        description: Rebuild with a blocked production startup and require a failed start
        type: boolean
        default: false
      wayland_regression:
        description: Also rebuild without the workaround and require the Wayland probe to fail
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'native/**'
      - 'third_party/**'
      - 'packaging/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.tool-versions'
      - '.forgejo/ci-image/**'
      - '.forgejo/workflows/linux-start-smoke.yml'
      - 'scripts/**'
      - 'test/linux_session_workflow_test.dart'
      - 'test/release_linux_sessions_test.py'

permissions:
  contents: read

concurrency:
  # Iedere push naar main behoudt zijn eigen proef. Voor PR’s volstaat de laatste revisie.
  group: linux-desktop-start-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-start:
    runs-on: docker
    # Een koude native build kan op een drukke runner langer dan een uur duren.
    timeout-minutes: 120
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.50.0@sha256:e43e18573ee176a5f19165230e959d559d3f5d0116d9f151619529f99cba2841
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Direct Dart-script: geen pub/native hooks vóór de SDK-controle.
      - name: Draaiende Flutter tegen de pin toetsen
        run: make check-toolchain

      - name: Ontbrekende Linux-buildlibs
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends liblzma-dev libsecret-1-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libpulse-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libmpv-dev libgl1-mesa-dri libegl-mesa0

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-linux-smoke-${{ github.event_name }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-smoke-${{ github.event_name }}-
            pub-linux-${{ hashFiles('pubspec.lock') }}

      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile

      - name: dartcv4-versie uit pubspec.lock
        id: dartcv
        run: |
          VERSIE="$(grep -A8 '^  dartcv4:' pubspec.lock | grep 'version:' | sed 's/.*version: "//;s/".*//')"
          test -n "$VERSIE"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"

      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-smoke-${{ github.event_name }}-${{ steps.dartcv.outputs.versie }}
          restore-keys: |
            dartcv-linux-${{ steps.dartcv.outputs.versie }}

      - name: Proefgereedschap installeren
        run: bash scripts/prepare_linux_probe.sh desktop

      - name: Linux-releasebundel bouwen
        run: bash scripts/run_release_linux_build.sh flutter build linux --release --no-pub

      - name: Dezelfde releasebundel voor beide sessies bewaren
        run: tar -C build/linux/x64/release -czf linux-desktop-bundle.tar.gz bundle

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-desktop-bundle
          path: linux-desktop-bundle.tar.gz
          retention-days: 2

      - name: Gereedschap voor de optionele schaalregressie installeren
        if: ${{ inputs.wayland_regression == true || inputs.wayland_regression == 'true' }}
        run: apt-get install -y --no-install-recommends openbox xdotool x11-utils python3-pil tesseract-ocr sway grim libwayland-dev

      - name: Wayland-basis vóór de tegenproef
        if: ${{ inputs.wayland_regression == true || inputs.wayland_regression == 'true' }}
        run: scripts/run_linux_window_probe.sh wayland build/linux/x64/release/bundle/ocideck probe-evidence/window-wayland

      - name: Wayland-regressie zonder schaalworkaround
        if: ${{ inputs.wayland_regression == true || inputs.wayland_regression == 'true' }}
        run: |
          set -eu
          runner=linux/runner/my_application.cc
          grep -Fx '  follow_subsurface_scale(view);' "$runner"
          sed -i 's/^  follow_subsurface_scale(view);$/  if (false) follow_subsurface_scale(view);/' "$runner"
          bash scripts/run_release_linux_build.sh flutter build linux --release --no-pub
          if scripts/run_linux_window_probe.sh wayland build/linux/x64/release/bundle/ocideck \
            probe-evidence/window-wayland-regression >probe-evidence/wayland-regression.log 2>&1; then
            echo 'De Wayland-proef accepteerde de bundel zonder workaround.' >&2
            exit 1
          fi
          cat probe-evidence/wayland-regression.log
          grep -E 'window-[12]: (Flutter content stops|Settings is not visible)' probe-evidence/wayland-regression.log

      - name: Regresstoets met geblokkeerde opstart
        if: ${{ inputs.startup_regression == true || inputs.startup_regression == 'true' }}
        run: |
          set -eu
          # Rebuild from the real entry point and leave the existing watchdog active.
          git restore -- linux/runner/my_application.cc
          grep -Fx '    await configureNativeWindow();' lib/main.dart
          sed -i 's/^    await configureNativeWindow();$/    await Completer<void>().future;/' lib/main.dart
          bash scripts/run_release_linux_build.sh flutter build linux --release --no-pub
          app=build/linux/x64/release/bundle/ocideck
          if bash scripts/linux_start_probe.sh probe-evidence/startup-regression "$app"; then
            echo 'De startproef accepteerde een app die bij het opstarten vastloopt.' >&2
            exit 1
          fi
          grep -F 'WARN opstart: nog geen eerste frame na 10 s' probe-evidence/startup-regression/start.*/ocideck.log

      - name: Opstartbewijs bewaren
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-start-probe
          path: probe-evidence/
          if-no-files-found: ignore

  desktop-session:
    name: Linux start en venster (${{ matrix.backend }})
    needs: linux-start
    runs-on: docker
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland]
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.50.0@sha256:e43e18573ee176a5f19165230e959d559d3f5d0116d9f151619529f99cba2841
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: linux-desktop-bundle
          path: desktop-bundle
      - name: Runtime en sessiegereedschap installeren
        run: |
          apt-get update
          bash scripts/prepare_linux_probe.sh desktop
          apt-get install -y --no-install-recommends openbox xdotool x11-utils python3-pil tesseract-ocr sway grim wtype libwayland-dev libsecret-1-0 libayatana-appindicator3-1 libwebkit2gtk-4.1-0 libpulse0 libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libmpv2 libgl1-mesa-dri libegl-mesa0
      - name: De gedeelde releasebundel uitpakken
        run: tar -C desktop-bundle -xzf desktop-bundle/linux-desktop-bundle.tar.gz
      - name: Start, venster, schaal en muis op ${{ matrix.backend }}
        env:
          OCIDECK_PROBE_SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/run_linux_window_probe.sh '${{ matrix.backend }}' desktop-bundle/bundle/ocideck probe-evidence/${{ matrix.backend }}
      - name: Presentatie verdelen, scherm loskoppelen en herstellen
        if: matrix.backend == 'wayland'
        env:
          OCIDECK_PROBE_SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/run_linux_window_probe.sh wayland desktop-bundle/bundle/ocideck probe-evidence/wayland/presentation --presentation
      - name: Sessiebewijs bewaren, ook bij fouten
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-desktop-${{ matrix.backend }}-${{ github.sha }}
          path: probe-evidence/${{ matrix.backend }}/
          if-no-files-found: warn
          retention-days: 7
