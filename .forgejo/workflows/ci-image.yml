# Bouwt en publiceert het voorgebakken CI-basisimage
# (`.forgejo/ci-image/Dockerfile`) naar de eigen Forgejo-registry.
#
# WANNEER. Op afroep (`workflow_dispatch`) én automatisch zodra de Dockerfile of
# de Flutter-pin (`.tool-versions`) op `main` wijzigt — zo kan het image nooit
# stil achterlopen op de pin. Het tag ís de pin (`flutter-<versie>`), dus een
# pin-bump publiceert een nieuw tag zonder een oud te overschrijven.
#
# EENMALIG IN TE RICHTEN (zie docs/CHECKS.md "Voorgebakken CI-image"):
#   * repo-secret `CI_IMAGE_TOKEN` — een Forgejo-token met `write:package`, en
#     repo-variabele `CI_IMAGE_USER` — de EIGENAAR van dat token (de login-naam).
#   * de runner moet `docker` kunnen aanroepen (de dind-runner op pawprint kan
#     dat); draait hij zonder docker-toegang, gebruik dan de handmatige route
#     `make ci-image-publish` vanaf een machine met docker/colima.
#   * zet het gepubliceerde package op PUBLIEK, zodat de gate-workflows het
#     zonder inlog kunnen pullen (of richt pull-credentials op de runner in).
#
# VERTROUWENSGRENS. Zelfde als de runner en de bestaande `actions/cache`: onze
# eigen job bouwt het image op onze eigen runner en duwt het naar onze eigen
# registry. De Dockerfile toetst de Flutter-tarball sha256 vóór het uitpakken,
# dus een gemanipuleerde toolchain valt om bij de build — niet pas in de poort.
name: ci-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.forgejo/ci-image/Dockerfile'
      - '.forgejo/workflows/ci-image.yml'
      - '.tool-versions'

# Twee pushes vlak na elkaar (pin-bump + Dockerfile) hoeven niet dubbel te
# bouwen; de laatste dekt de nieuwste staat.
concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: docker
    steps:
      # Zonder registry-token kan deze workflow niets publiceren. Dat is géén
      # fout: vóór de eenmalige inrichting (of op een fork) hoort de run gewoon
      # groen over te slaan, niet rood te worden. Anders zou juist de PR die dit
      # image toevoegt na de merge een rode `main`-run opleveren.
      - name: Is de registry-publicatie ingericht?
        id: guard
        env:
          TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
          USER: ${{ vars.CI_IMAGE_USER }}
        run: |
          set -eu
          # Beide nodig: het token is het geheim, de gebruikersnaam is de EIGENAAR
          # van dat token (een Forgejo-gebruiker met write:package). Bewust NIET
          # `github.actor` — dat is wie de run triggert, en die hoeft niet de
          # token-eigenaar te zijn; dan zou de push stil op de verkeerde login
          # falen. Een repo-variabele `CI_IMAGE_USER` maakt het expliciet.
          if [ -z "${TOKEN:-}" ] || [ -z "${USER:-}" ]; then
            echo "CI_IMAGE_TOKEN (secret) en/of CI_IMAGE_USER (variabele) niet gezet — publicatie overgeslagen."
            echo "Richt ze eenmalig in (docs/CHECKS.md 'ci-image.yml') of draai 'make ci-image-publish'."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      # De job draait in een kaal ubuntu:24.04 (de runner-default), zonder node —
      # en `actions/checkout`/`actions/cache` zijn node-acties. Installeer daarom
      # eerst node, plus de docker-CLI die met de dind-daemon praat (het adres
      # komt uit de volgende stap). `git` erbij zodat checkout via git werkt, en
      # `iproute2` voor de `ip route` die dat adres oplevert.
      - name: Gereedschap in de container (node + docker-CLI + iproute2)
        if: steps.guard.outputs.publish == 'yes'
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs ca-certificates git docker.io iproute2

      # WAAR DRAAIT DE DAEMON. Deze job draait ÍN de dind, in een netwerk dat de
      # runner per workflow-run aanmaakt (`WORKFLOW-<hash>`). De gateway van dat
      # netwerk ÍS de dind-daemon — die luistert op alle interfaces
      # (`dockerd --host=tcp://0.0.0.0:2375`) — maar het adres verschilt per run
      # (gezien: 172.19.0.1, 172.23.0.1). Vooraf opschrijven kan dus niet;
      # uitlezen wel: de default gateway van deze container ÍS dat adres.
      #
      # WAAROM NIET VIA `DOCKER_HOST`. De runnerconfig zet
      # `runner.envs.DOCKER_HOST: tcp://docker-in-docker:2375`, en die injectie
      # wint van een `env:` in deze workflow — die kwam dus nooit aan. Erger: die
      # naam is een alias op het BUITENSTE compose-netwerk en bestaat niet in de
      # dind, dus elke docker-aanroep strandde op
      # `lookup docker-in-docker on 127.0.0.11:53: no such host`. Dat is de reden
      # dat deze workflow in zijn hele bestaan geen enkele run groen had en beide
      # images altijd met de hand zijn gepubliceerd (`make ci-image*-publish`).
      #
      # Een `-H`-vlag op de CLI kent dat probleem niet: een vlag wint altijd van
      # de omgeving, wat de runner ook injecteert. Vandaar een stap-output en
      # `-H` op élke docker-aanroep hieronder; `test/ci_image_docker_host_test.dart`
      # bewaakt dat er geen kale `docker`-aanroep terugsluipt.
      - name: Adres van de docker-daemon bepalen
        if: steps.guard.outputs.publish == 'yes'
        id: dockerd
        run: |
          set -eu
          GW="$(ip -4 route show default | awk '{print $3; exit}')"
          test -n "$GW" || {
            echo "geen default gateway in deze container — de dind-daemon is zo niet te vinden"
            exit 1
          }
          echo "host=tcp://$GW:2375" >> "$GITHUB_OUTPUT"
          echo "docker-daemon verwacht op tcp://$GW:2375"

      # De dind-service start parallel op; wacht tot de daemon luistert, anders
      # faalt de eerste docker-aanroep op een nog-dichte socket.
      - name: Wacht op de docker-daemon
        if: steps.guard.outputs.publish == 'yes'
        env:
          DH: ${{ steps.dockerd.outputs.host }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            docker -H "$DH" info >/dev/null 2>&1 \
              && { echo "daemon bereikbaar"; docker -H "$DH" version; exit 0; }
            sleep 2
          done
          echo "docker-daemon kwam niet op binnen 60s op $DH"
          docker -H "$DH" info
          exit 1

      - if: steps.guard.outputs.publish == 'yes'
        uses: actions/checkout@v4

      - name: Gepinde Flutter-versie lezen
        if: steps.guard.outputs.publish == 'yes'
        id: pin
        run: |
          set -eu
          V="$(sed -n 's/^flutter \(.*\)-stable$/\1/p' .tool-versions)"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Inloggen op de Forgejo-registry
        if: steps.guard.outputs.publish == 'yes'
        env:
          DH: ${{ steps.dockerd.outputs.host }}
        run: |
          set -eu
          echo "${{ secrets.CI_IMAGE_TOKEN }}" \
            | docker -H "$DH" login pawprint.vigilis.online \
                -u "${{ vars.CI_IMAGE_USER }}" --password-stdin

      - name: Bouwen en pushen
        if: steps.guard.outputs.publish == 'yes'
        env:
          DH: ${{ steps.dockerd.outputs.host }}
        run: |
          set -eu
          IMG="pawprint.vigilis.online/librekat/ocideck-ci"
          TAG="flutter-${{ steps.pin.outputs.version }}"
          docker -H "$DH" build \
            --build-arg FLUTTER_VERSION="${{ steps.pin.outputs.version }}" \
            -t "$IMG:$TAG" \
            -f .forgejo/ci-image/Dockerfile .forgejo/ci-image
          docker -H "$DH" push "$IMG:$TAG"
          echo "Gepubliceerd: $IMG:$TAG"
