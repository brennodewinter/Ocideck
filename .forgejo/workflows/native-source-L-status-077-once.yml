name: Original native L status and evidence once
on:
  push:
    branches: [codex/native-source-L-status-077-once]
permissions:
  contents: read
jobs:
  original-native-L-status:
    runs-on: ocideck-macos-arm64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, repository pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read original owned L status and preserve evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          p=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.native-source-L-status-driver.py'
          assert not p.exists()
          p.write_bytes(base64.b64decode(''))
          PY
          python3 "$GITHUB_WORKSPACE/.native-source-L-status-driver.py"
      - name: Export original read-only snapshot
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, repository pin
        with:
          name: original-native-L-status-evidence
          path: native-source-L-status/**
          if-no-files-found: error
          retention-days: 90
