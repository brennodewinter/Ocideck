# De poort op **Linux**, op afroep (#741, #790, #796, #797).
#
# **Waarom dit los staat van de tagpoort.** De uitbrengpoort is sinds #797 de
# Mac-runner: die doet dezelfde `make check-no-coverage` in ongeveer drie
# minuten waar deze container er dertig over deed — vier kernen van een Xeon uit
# 2018 tegen een M5 Max. Wat je daarmee verliest is dat de suite nog ergens op
# Linux draait, en dat is niet niks: `git` 2.43 op Ubuntu 24.04 kent
# `--end-of-options` niet, en dat soort verschil vind je op geen enkele Mac.
#
# Daarom is deze poort niet weggegooid maar verplaatst naar `workflow_dispatch`:
# één druk op de knop vóór een release, of wanneer een wijziging aan paden,
# subprocessen of `git`-aanroepen komt. Wie hem nooit draait, draait hem nooit —
# dat is een bewuste afweging en geen ongeluk, en ze staat ook in docs/CHECKS.md.
#
# **De toolchain.** De omgeving komt uit het voorgebakken CI-image
# `pawprint.vigilis.online/librekat/ocideck-ci:flutter-<pin>` (zie
# `.forgejo/ci-image/Dockerfile` en `static-gate.yml`): OS + node + de
# build-toolchain + de gepinde, sha256-geverifieerde stable-Flutter (+ precache)
# zitten erin, dus de per-run-installatie vervalt. De provenance is gelijk
# gebleven — de sha256-toets verhuisde naar bouwtijd — en `check-toolchain` draait
# onverkort in de suite op de ingebakken Flutter: kanaal `stable`, officiële
# herkomst, gelijkheid met de pin. Een kant-en-klaar cirruslabs-image (kanaal
# "[user-branch]") zou daar nog steeds op omvallen. Het tag ís de pin, dus
# achterlopen valt fail-closed om i.p.v. stil.
#
# **Wat er nog wél op `actions/cache` staat.** De repo-gekoppelde artefacten die
# met `pubspec.lock` meebewegen en niet in een toolchain-image horen: de
# pub-pakketten en de dartcv OpenCV-build (veruit de duurste stap na de tests).
# Zelfde vertrouwensgrens als de runner — wie de runner beheert, beheert de cache.
# Op `continue-on-error`: valt de cache-API weg, dan compileert/haalt de stap
# gewoon opnieuw, en de poort blijft de poort.
#
# **Per-PR (preventie) én op `push` naar `main` (detectie) — #1123 + de
# serialisatie hieronder.** `static-gate.yml` vangt de statische poorten per PR,
# maar bewust niet de testsuite — precies de reden dat een registratiepoort die
# *een test* is (bijv. `source_map_coverage_test`, docs-registratie, SBOM- en
# l10n-invarianten) én een reeks Linux-specifieke of load-gevoelige tests
# (pad-separators, subproces-timeouts, I/O-races) tóch stil op `main` konden
# landen: groen op de snelle maintainer-Mac, rood pas post-merge op deze runner.
# Daarom draait deze poort nu óók **per PR** die `lib/**` of `test/**` (en de
# directe afhankelijkheden daarvan) raakt — dezelfde volle `make
# check-no-coverage`, nu vóór de merge. De push-naar-`main`-run blijft als
# detectievangnet voor wat tussen PR's tóch op `main` verandert.
#
# **Waarom dit niet langer "te traag om te blokkeren" is.** De suite draaide ooit
# alleen post-merge uit vrees voor overbelasting: tot vier zware jobs tegelijk op
# één dind gaven I/O-contentie — precies wat de load-gevoelige tests deed
# flakeren. De oplossing is serialiseren, niet weglaten: deze job draait op een
# aparte runner **`linux-serial` met capacity 1** (runner-config op pawprint, zie
# docs/CHECKS.md), terwijl `static-gate`/`scans` de capacity-4-baan houden. Zo
# draait er nooit meer dan één zware gate tegelijk — elke PR komt aan de beurt, de
# wachtrij-latency is de bewuste ruil, en de contentie die de flakiness
# veroorzaakte is weg. De dekkingsvloer blijft ook hier weg
# (`check-no-coverage`); die hoort op de machine van de committer, zie
# docs/CHECKS.md.
name: linux-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Preventie vóór de merge: alleen bij wijzigingen die de suite kunnen breken —
  # code, tests, hun tooling, de deps/toolchain, de Linux-build en deze workflow
  # zelf. Docs-only of pure CI-config-PR's slaan hem over (kunnen de suite niet
  # breken) en betalen de wachtrij niet.
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.tool-versions'
      - 'Makefile'
      - 'analysis_options.yaml'
      - 'linux/**'
      - '.forgejo/workflows/linux-gate.yml'

# De serialisatie zit in de runner (`linux-serial`, capacity 1), niet hier: deze
# `concurrency` zorgt er alleen voor dat een PR (of `main`) zijn eigen lopende run
# opzij zet bij een nieuwere commit. Verschillende PR's zitten via `github.ref` in
# verschillende groepen en breken elkaar dus níet af — ze wachten netjes op het
# ene runner-slot. `workflow_dispatch` zit via `github.event_name` in een eigen
# groep, zodat een druk-op-de-knop en een merge elkaar nooit afbreken.
concurrency:
  group: linux-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-linux:
    # `linux-serial`: een tweede runner op pawprint met capacity 1, zodat er nooit
    # meer dan één zware gate tegelijk draait (zie de kop en docs/CHECKS.md).
    # `static-gate`/`scans` blijven op `docker` (capacity 4).
    runs-on: linux-serial
    # Voorgebakken CI-image (zie de kop van `static-gate.yml` en docs/CHECKS.md):
    # OS + node + build-toolchain + de gepinde, sha256-geverifieerde Flutter
    # (+ precache) zitten erin, dus de per-run-installatie vervalt. Het tag ís de
    # pin; loopt het image achter, dan valt `check-toolchain` (binnen
    # `make check-no-coverage`) om — fail-closed. Alleen de repo-gekoppelde dingen
    # (pub + dartcv OpenCV-build) blijven op `actions/cache`.
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.44.9
    steps:
      - uses: actions/checkout@v4

      - name: Werkkopie en Flutter vertrouwen
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      # De pakketten volgen `pubspec.lock` letterlijk; verandert er één
      # afhankelijkheid, dan is dat een nieuwe sleutel. De terugvalsleutel
      # levert dan nog steeds de vorige set, zodat pub alleen het verschil
      # ophaalt in plaats van alles.
      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      # De dartcv4-hook compileert OpenCV (native OpenCV-binding, #870) — veruit de
      # duurste stap na de tests. Blijft bewust op `actions/cache` (volgt
      # `pubspec.lock`), niet in het image; zelfde sleutel als static-gate, zodat
      # één cache beide poorten bedient.
      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dartcv-linux-

      # `check-no-coverage` en niet `check`: de volledige suite draait onverkort,
      # alleen zonder `--coverage`. Die instrumentatie houdt per test een
      # VM-Service-verbinding open tot het eind van de run en was op deze runner
      # 33 min 49 s van een gate van 46 minuten — veruit de fase die het slechtst
      # parallelliseert op vier kernen.
      #
      # Die 74% is niet de winst: de suite moet nog steeds draaien. Lokaal
      # nagemeten scheelt het weglaten van de instrumentatie 39% CPU, wat op
      # vier kernen neerkomt op ~13 minuten van die 46. Reëel, geen factor.
      #
      # De dekkingsvloer en de per-bestandsvloer draaien hier dus níet meer. Dat
      # is geen versoepeling maar een verplaatsing: ze zitten onverkort in
      # `make check`, dat vóór main op de machine van de committer draait — zie
      # CONTRIBUTING.md en docs/CHECKS.md. Wat deze poort op een tag beantwoordt
      # is "draait alles nog, op andermans hardware", niet "hoeveel raakt het".
      - name: De poort
        run: make check-no-coverage
