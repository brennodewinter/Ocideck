name: Exact L native full release gate once
on:
  push:
    branches: [codex/native-source-L-077-once]
permissions:
  contents: read
jobs:
  native-full-L:
    runs-on: ocideck-macos-arm64
    timeout-minutes: 790
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, repository pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact L full native gate in owned warm stage
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          w=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          def git(*a): return subprocess.check_output(['git',*a],cwd=w,text=True,timeout=30).strip()
          assert os.environ['GITHUB_REF']=='refs/heads/codex/native-source-L-077-once'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')=='6a7321e574dd799cbade57659216e3e0f923a66f'
          assert git('diff','--name-only','HEAD^','HEAD')=='.forgejo/workflows/native-source-L-077-once.yml'
          p=w/'.native-source-L-driver';p.mkdir(mode=0o700)
          payload={'runner.py': '', 'gate.py': '', 'resource.py': ''}
          for n,s in payload.items(): (p/n).write_bytes(base64.b64decode(s))
          PY
          python3 "$GITHUB_WORKSPACE/.native-source-L-driver/runner.py"
      - name: Preserve complete owned native evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1, repository pin
        with:
          name: native-source-L-evidence
          path: native-source-L/**
          if-no-files-found: error
          retention-days: 90
