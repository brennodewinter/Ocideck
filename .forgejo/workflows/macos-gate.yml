# Goldens en de draaiende app op de Mac-runner (mac-brenno, label macos, host-modus).
#
# **Waarom deze workflow bestaat.** De golden-tests (`make test-golden`) zijn
# pixel-specifiek en draaien alleen op macOS — `static-gate.yml` draait op Linux
# en kan ze niet meenemen. Zonder deze poort dreef `main` rood op 23 goldens
# (#1988) zonder dat een CI-check het zag: de enige die de goldens draaide was
# de committer lokaal, en een vergeten `make test-golden` is precies hoe een
# sub-promille renderlaag-verschuiving onopgemerkt blijft tot iemand de poort
# nodig heeft en dan aantreft dat ze "altijd al rood was".
#
# **De golden-job** draait `make test-golden`. Dat draait de 51
# golden-tests (~2 minuten op de Mac-runner) en vergelijkt tegen de committed
# PNGs. Faalt hij, dan staat de diff in `test/golden/failures/` — met eigen ogen
# bevestigen vóór `UPDATE=1`, want blind regenereren maakt de poort groen en
# blind.
#
# **Waarom host-modus en niet op de container.** Apple staat macOS alleen op
# Apple-hardware toe, dus deze job draait direct op de Mac, met dezelfde
# gepinde Flutter die `check-toolchain` bewaakt. Er wordt niets geïnstalleerd
# en er valt niets te cachen — zelfde aanpak als `macos-build.yml`.
#
# **Waarom alleen op `push: main` en niet per PR.** De goldens zijn
# machine-specifiek (Ahem-font op deze Mac), en de Mac-runner staat niet altijd
# aan — een required PR-check die wacht tot de Mac opstart blokkeert de
# review-wachtrij. Deze poort is een post-merge vangnet: vangt een regressie
# binnen minuten na de merge in plaats van pas wanneer iemand lokaal `make
# check` draait. Staat de Mac uit, dan wacht de run; een volgende merge
# vervangt een wachtende run.
#
# De releasekandidaat draait `make test-golden` op de exacte commit vóór de tag.
# De losse main-poort blijft een snelle vangnetcontrole na gewone merges.
#
# **Waarom niet samengevoegd met `macos-build.yml`.** Die workflow draait alleen
# wanneer native-buildpaden veranderen (`pubspec.yaml`, `macos/**`, …); een
# golden-regressie komt uit élke code-wijziging, niet alleen uit native work.
# De build is bovendien duur (minuten); de golden-suite is goedkoop (~2 min).
# Gescheiden houden houdt beide triggers schoon.
name: macos-gate

on:
  workflow_dispatch:
  push:
    branches: [main]

# Zelfde concurrency-gedrag als static-gate: een nieuwe main-push zet de
# lopende vangnetrun opzij. Een kandidaat draait zijn eigen golden-poort in
# release.yml en valt niet in deze concurrencygroep.
concurrency:
  group: macos-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-gate:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      # Toolchainfeiten vóór de build: run 6375 faalde vóór de tests in de
      # dartcv4/Xcode-proefcompilatie en de log bevatte daarna niets waarmee de
      # oorzaak te verklaren viel. Goedkoop, altijd, en hetzelfde rapport landt
      # in het diagnose-artifact onderaan (#2937).
      - name: Toolchain-preflight
        run: |
          set -u
          mkdir -p build/golden-diagnose
          {
            echo "== systeem =="
            sw_vers || true
            uname -m || true
            echo "== xcode =="
            xcode-select -p || true
            xcodebuild -version || true
            xcrun --sdk macosx --show-sdk-version || true
            echo "== cmake =="
            cmake --version | head -1 || true
            echo "== flutter =="
            flutter --version | head -4 || true
            echo "== deployment target (project) =="
            grep -h "MACOSX_DEPLOYMENT_TARGET" \
              macos/Runner.xcodeproj/project.pbxproj | sort -u || true
          } | tee build/golden-diagnose/preflight.txt

      # Host-modus: de toolchain staat al op de Mac, net als bij macos-build.
      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Golden visual-regression suite
        run: make test-golden

      # Bouwdiagnostiek bij elke falende stap. Faalt de native buildhook vóór
      # de tests (run 6375: dartcv4 → CMAKE_TRY_COMPILE via xcodebuild), dan is
      # de compileruitvoer het bewijs — en die verdwijnt met de job. We nemen
      # mee: de CMake-configure/error/output-logs en de hook-invoer/-uitvoer
      # (stdout/stderr/input/output.json) uit de hooks_runner-werkmap, plus het
      # preflightrapport en het testrapport voor zover geschreven. Geen
      # omgevingsdump: tokens en sleutels horen niet in een artifact (#2937).
      - name: Bouwdiagnostiek verzamelen
        if: failure()
        run: |
          dest=build/golden-diagnose
          mkdir -p "$dest"
          cp build/test-report.json "$dest/" 2>/dev/null || true
          if [ -d .dart_tool/hooks_runner ]; then
            find .dart_tool/hooks_runner -type f \
              \( -name 'CMakeConfigureLog.yaml' -o -name 'CMakeError.log' \
                 -o -name 'CMakeOutput.log' -o -name 'input.json' \
                 -o -name 'output.json' -o -name 'stderr.txt' \
                 -o -name 'stdout.txt' \) -print0 \
              | tar cf - --null -T - | (cd "$dest" && tar xf -)
          fi
          # Onderscheid de twee rood-oorzaken expliciet: een native bouwfout
          # vóór teststart is geen golden-mismatch en vraagt géén UPDATE=1.
          if [ -s build/test-report.json ] \
             && grep -q '"testID"' build/test-report.json; then
            echo "DIAGNOSE: de suite rapporteerde testgevallen — echte" \
              "testfout of visuele mismatch; zie de golden-diff."
          else
            echo "DIAGNOSE: geen testresultaten geschreven — de run stierf" \
              "in de native buildhook vóór teststart. Geen golden-PNGs" \
              "regenereren; zie de CMake-logs in dit artifact."
          fi

      - name: Diagnostiek uploaden
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: golden-gate-diagnose
          path: build/golden-diagnose/
          if-no-files-found: warn
          retention-days: 30

  desktop-lifecycle:
    runs-on: macos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile
      - name: Echte macOS-app en Cmd+Q-sluitbewaking
        run: |
          set -euo pipefail
          mkdir -p build/desktop-smoke
          make test-desktop-smoke DEVICE=macos 2>&1 | tee build/desktop-smoke/run.log
      - name: Bewijs van beide appstarts bewaren
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: desktop-lifecycle-macos-${{ github.sha }}
          path: build/desktop-smoke/
          if-no-files-found: warn
          retention-days: 7
