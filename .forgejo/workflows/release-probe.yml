# TIJDELIJK — verwijderen vóór de PR.
#
# Beantwoordt de drie vragen die de release-workflow aangaan en die je niet uit
# code kunt aflezen, in één run van een halve minuut in plaats van in een
# mislukte tagbuild van twintig:
#
#   1. mag het automatisch geïnjecteerde token releases aanmaken;
#   2. kan de runner bij github.com (daar komt de Windows-build vandaan);
#   3. kan de runner bij de webserver (daar gaat de webbundel heen).
name: release-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      - name: Gereedschap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates jq openssh-client netcat-openbsd

      - name: 1. Token — mag het releases schrijven?
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          API="https://pawprint.vigilis.online/api/v1/repos/${{ github.repository }}"
          if [ -z "${TOKEN:-}" ]; then echo "GEEN GITHUB_TOKEN geïnjecteerd"; else echo "token aanwezig (${#TOKEN} tekens)"; fi
          echo "-- wie ben ik --"
          curl -s -o /tmp/me.json -w "GET /user: %{http_code}\n" \
            -H "Authorization: token $TOKEN" https://pawprint.vigilis.online/api/v1/user
          jq -r '.login // .message // "?"' /tmp/me.json || cat /tmp/me.json
          echo "-- lezen --"
          curl -s -o /dev/null -w "GET /releases: %{http_code}\n" \
            -H "Authorization: token $TOKEN" "$API/releases"
          echo "-- schrijven (wordt meteen weer opgeruimd) --"
          CODE=$(curl -s -o /tmp/rel.json -w "%{http_code}" -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d '{"tag_name":"v0.0.0-ci-probe","target_commitish":"main","name":"CI-proef, wordt verwijderd","body":"Proefrelease van release-probe.yml. Zie je dit staan, dan is het opruimen misgegaan — weg ermee.","draft":true,"prerelease":true}')
          echo "POST /releases: $CODE"
          cat /tmp/rel.json | head -c 400; echo
          ID=$(jq -r '.id // empty' /tmp/rel.json)
          if [ -n "$ID" ]; then
            curl -s -o /dev/null -w "DELETE /releases/$ID: %{http_code}\n" -X DELETE \
              -H "Authorization: token $TOKEN" "$API/releases/$ID"
            curl -s -o /dev/null -w "DELETE /tags/v0.0.0-ci-probe: %{http_code}\n" -X DELETE \
              -H "Authorization: token $TOKEN" "$API/tags/v0.0.0-ci-probe"
          fi

      - name: 2. Bereikt de runner github.com?
        run: |
          set -u
          curl -s -o /dev/null -w "github.com/api rate_limit: %{http_code}\n" https://api.github.com/rate_limit
          curl -s -o /dev/null -w "releases-API van de spiegel: %{http_code}\n" \
            https://api.github.com/repos/brennodewinter/Ocideck/releases
          curl -s -o /dev/null -w "objects.githubusercontent.com: %{http_code}\n" \
            https://objects.githubusercontent.com/

      - name: 3. Bereikt de runner de webserver?
        run: |
          set -u
          nc -z -w 5 braniebananie.nl 22 && echo "braniebananie.nl:22 open" || echo "braniebananie.nl:22 NIET bereikbaar"
          ssh-keyscan -T 5 braniebananie.nl 2>/dev/null | grep -c . | sed 's/^/host keys gevonden: /'
          curl -s -o /dev/null -w "https://ocideck.librekat.nl/: %{http_code}\n" https://ocideck.librekat.nl/
