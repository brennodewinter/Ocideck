# De statische poort van OciDeck, per pull request (#1118).
#
# **Waarom deze workflow bestaat.** De uitbrengpoort (`ci.yml`) vuurt alleen op
# een `v*`-tag en de Linux-poort (`linux-gate.yml`) alleen op afroep, dus tussen
# releases houdt niets de statische poorten tegen op een PR. Zo dreef `main` stil
# rood: een reeks merges duwde bestanden, klassen, een methode en registraties
# over hun plafond zonder dat een poort het per PR ving, en dat kwam pas boven
# toen iemand er een fix op wilde landen (#1118). Deze workflow zet dezelfde
# snelle statische controles die `make check` lokaal draait óók op elke PR neer,
# op het moment dat een overschrijding nog een wijziging is in plaats van
# historie op `main`.
#
# **Waarom alleen de statische deelverzameling en niet de hele poort.** De
# volledige suite en de dekkingsmeting kosten op deze container tientallen
# minuten (zie `linux-gate.yml` en #796) — precies de reden dat de poort ooit
# naar een tag verhuisde. De statische poorten daarentegen zijn seconden per
# stuk. `make check-static` is exact `$(STATIC_GATES)` uit de Makefile, dezelfde
# lijst die `check` draait, dus er ontstaat geen tweede waarheid die kan
# uiteenlopen. De dekkingsvloer en de per-bestandsvloer blijven in `make check`
# op de machine van de committer, vóór main — die twee vangt deze workflow
# bewust niet, en dat staat ook in docs/CHECKS.md.
#
# **Waarom op het voorgebakken CI-image en niet op een kaal ubuntu.** Deze
# workflow vuurt bij élke PR, en bouwde de omgeving voorheen per run opnieuw op
# (apt-toolchain + Flutter-download). Dat is nu voorgebakken in
# `pawprint.vigilis.online/librekat/ocideck-ci:flutter-<pin>` (zie
# `.forgejo/ci-image/Dockerfile` en `docs/CHECKS.md`): OS, node, de
# build-toolchain en de gepinde, sha256-geverifieerde Flutter (+ precache) zitten
# er al in, dus de per-run-installatie vervalt. Alleen de repo-gekoppelde dingen
# (pub-pakketten en de dartcv OpenCV-build) blijven op `actions/cache`.
#
# **Pin-koppeling.** Het image-tag ís de Flutter-pin (`flutter-3.47.1`). Loopt het
# image achter op `.tool-versions`, dan draagt het een andere Flutter dan de pin
# en valt `check-toolchain` (dat onverkort binnen `make check-static` meedraait)
# om — fail-closed, geen stille drift. Een pin-bump werkt daarom `.tool-versions`
# én dit tag in dezelfde commit bij; `ci-image.yml` publiceert het nieuwe tag
# automatisch bij een `.tool-versions`-wijziging. Het image is anoniem pullbaar
# (publieke org), en de dind heeft het lokaal; valt de registry toch weg, dan
# start de job niet — dezelfde beschikbaarheidsgrens als de runner zelf.
name: static-gate

on:
  pull_request:
  # Ook ná de merge, en dat is geen dubbelop. Een PR-run toetst de *voorvertoning*
  # van die ene samenvoeging met `main` zoals die er op dát moment bijstond. Loopt
  # er een tweede PR mee die hetzelfde bestand raakt, dan zijn beide runs groen en
  # is de uitkomst het toch niet: zo dreef `main` op 21-08-2026 vijf keer rood op
  # de regel- en klasseplafonds, telkens één of twee regels over de rand.
  #
  # Tot nu toe was `linux-gate.yml` het eerste dat de échte samenvoeging zag, en
  # dat is de dure poort op de serieruimte — de uitslag komt tientallen minuten
  # later. In de tussentijd merget de volgende sessie eroverheen en rapporteert
  # dezelfde rode poort nog eens. Deze trigger zet dezelfde snelle controles op
  # `main` neer, zodat een botsing binnen minuten zichtbaar is in plaats van na
  # de suite. Voorkómen doet hij het niet; dat kan alleen door élke PR vlak vóór
  # de merge opnieuw tegen de actuele `main` te draaien.
  push:
    branches: [main]
  workflow_dispatch:

# Duwt iemand een nieuwe commit op een PR terwijl de vorige poortrun nog loopt,
# dan zet die de lopende run opzij. Afbreken kost hier niets: de statische poort
# bekijkt de héle boom op de nieuwste commit, dus de latere run dekt onverkort
# wat de afgebroken run zou hebben gezien. Een afgebroken run meldt zich als
# `failure` en kan mailen; dat het er bijna geen zijn, is de bedoeling.
concurrency:
  group: static-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    runs-on: docker
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.1
    steps:
      - uses: actions/checkout@v4

      # De werkkopie is van een andere uid dan root; zonder dit weigert git
      # bewerkingen. `/opt/flutter` (ingebakken) heeft dezelfde behandeling nodig,
      # want Flutter draait git op zijn eigen checkout.
      - name: Werkkopie en Flutter vertrouwen
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      # De dartcv4-hook compileert OpenCV bij élke `dart run tool/…` in
      # `make check-static` — op een verse checkout ~1 GB bron+build onder
      # `.dart_tool/hooks_runner` en veruit de duurste stap van deze poort. De
      # build is inhoud-geadresseerd op zijn inputs, dus een herstelde cache laat
      # de hook de recompile overslaan; wijkt er iets af, dan bouwt hij gewoon
      # opnieuw — geen controle vervangen. Dezelfde sleutel als de linux-gate (ook
      # Linux, dezelfde build-hash), zodat één cache beide poorten bedient. Dit
      # blijft op `actions/cache` (niet in het image): het volgt `pubspec.lock`.
      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ hashFiles('pubspec.lock') }}

      # De commando's zelf staan in de Makefile: `make check-static` is precies de
      # statische deelverzameling die een bijdrager lokaal in `make check` draait.
      # Ze hier overtypen zou twee waarheden opleveren die uit elkaar gaan lopen.
      - name: De statische poort
        run: make check-static

      # De registratie-invarianten (#1123): een handvol snelle tests die betrappen
      # wanneer een nieuw bestand/docs/afhankelijkheid/UI-string niet geregistreerd
      # is. Die poorten zíjn tests, dus `check-static` ziet ze niet — en zonder deze
      # stap kon zulke drift (bv. source_map) tóch per PR passeren. Zelfde job, dus
      # dezelfde status-check-context; alleen deze stap erbij, geen tweede lijst.
      - name: De registratie-invarianten
        run: make check-registrations
