# De statische poort van OciDeck, op afroep.
#
# **Waarom alleen handmatig.** De maintainer draait `make check-full` lokaal op
# de exacte commit die wordt gemerged en vermeldt die commit in de PR. Deze job
# zou daaruit alleen `make check-static` en de registratie-invarianten opnieuw
# uitvoeren, op tragere gedeelde hardware. `workflow_dispatch` blijft als
# diagnose- en herstelroute wanneer een tweede omgeving bewust gewenst is.
#
# **Waarom alleen de statische deelverzameling en niet de hele poort.** De
# volledige suite en de dekkingsmeting kosten op deze container tientallen
# minuten (zie `linux-gate.yml` en #796) — precies de reden dat de poort ooit
# naar een tag verhuisde. De statische poorten daarentegen zijn seconden per
# stuk. `make check-static` is exact `$(STATIC_GATES)` uit de Makefile, dezelfde
# lijst die `check` draait, dus er ontstaat geen tweede waarheid die kan
# uiteenlopen. De dekkingsvloer en de per-bestandsvloer blijven in `make check`
# op de machine van de committer, vóór main — die twee vangt deze workflow
# bewust niet, en dat staat ook in docs/CHECKS.md.
#
# **Waarom op het voorgebakken CI-image en niet op een kaal ubuntu.** Toen deze
# workflow bij elke PR vuurde, bouwde hij de omgeving per run opnieuw op
# (apt-toolchain + Flutter-download). Dat is nu voorgebakken in
# `pawprint.vigilis.online/librekat/ocideck-ci:flutter-<pin>` (zie
# `.forgejo/ci-image/Dockerfile` en `docs/CHECKS.md`): OS, node, de
# build-toolchain en de gepinde, sha256-geverifieerde Flutter (+ precache) zitten
# er al in, dus de per-run-installatie vervalt. Alleen de repo-gekoppelde dingen
# (pub-pakketten en de dartcv OpenCV-build) blijven op `actions/cache`.
#
# **Pin-koppeling.** Het image-tag hoort bij de Flutter-pin. Loopt het image
# achter op `.tool-versions`, dan draagt het een andere Flutter dan de pin en
# valt `check-toolchain` (dat onverkort binnen `make check-static` meedraait) om
# — fail-closed, geen stille drift. Publiceer bij een pin-bump daarom eerst het
# nieuwe image met `make ci-image-publish`, verifieer dat het tag pullbaar is en
# werk daarna pas alle Forgejo-imageverwijzingen bij. `ci-image.yml` blijft de
# automatische route na een wijziging aan `.tool-versions`, maar is te laat om
# een pull-requestpoort naar een nog niet bestaand tag te laten wijzen. Het image
# is anoniem pullbaar (publieke org), en de dind heeft het lokaal; valt de
# registry toch weg, dan start de job niet — dezelfde beschikbaarheidsgrens als
# de runner zelf.
name: static-gate

on:
  workflow_dispatch:

concurrency:
  group: static-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    runs-on: docker
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.5
    steps:
      - uses: actions/checkout@v4

      # De werkkopie is van een andere uid dan root; zonder dit weigert git
      # bewerkingen. `/opt/flutter` (ingebakken) heeft dezelfde behandeling nodig,
      # want Flutter draait git op zijn eigen checkout.
      - name: Werkkopie en Flutter vertrouwen
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      # De dartcv4-hook compileert OpenCV bij élke `dart run tool/…` in
      # `make check-static` — op een verse checkout ~1 GB bron+build onder
      # `.dart_tool/hooks_runner` en veruit de duurste stap van deze poort. De
      # build is inhoud-geadresseerd op zijn inputs, dus een herstelde cache laat
      # de hook de recompile overslaan; wijkt er iets af, dan bouwt hij gewoon
      # opnieuw — geen controle vervangen. Dezelfde sleutel als de linux-gate (ook
      # Linux, dezelfde build-hash), zodat één cache beide poorten bedient. Dit
      # blijft op `actions/cache` (niet in het image): het volgt `pubspec.lock`.
      #
      # **Sleutel op dartcv4-versie alleen, niet op de hele `pubspec.lock`.** De
      # OpenCV-build hangt af van de dartcv4-bron, niet van de rest van de
      # afhankelijkhedenboom. Met `hashFiles('pubspec.lock')` als sleutel
      # invalidéerde élke dep-bump de cache en bouwde de hook OpenCV vanaf nul
      # (#1746). Door alleen de dartcv4-versie in de sleutel te zetten blijft de
      # cache warm over niet-dartcv4-bumps heen. Bij een echte dartcv4-bump
      # verandert de sleutel en is er geen `restore-keys`-fallback die een stale
      # CMake-cache van de vorige versie terugzet — dat was de oorzaak van de
      # "source does not match" fout die eerder tot `13c8a40ce` leidde.
      - name: dartcv4-versie uit pubspec.lock
        id: dartcv
        run: |
          VERSIE="$(grep -A8 '^  dartcv4:' pubspec.lock | grep 'version:' | sed 's/.*version: "//;s/".*//')"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"
      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ steps.dartcv.outputs.versie }}

      # De commando's zelf staan in de Makefile: `make check-static` is precies de
      # statische deelverzameling die een bijdrager lokaal in `make check` draait.
      # Ze hier overtypen zou twee waarheden opleveren die uit elkaar gaan lopen.
      - name: De statische poort
        run: make check-static

      # De registratie-invarianten (#1123): een handvol snelle tests die betrappen
      # wanneer een nieuw bestand/docs/afhankelijkheid/UI-string niet geregistreerd
      # is. Die poorten zíjn tests, dus `check-static` ziet ze niet. Zelfde job,
      # alleen deze stap erbij, geen tweede lijst.
      - name: De registratie-invarianten
        run: make check-registrations
