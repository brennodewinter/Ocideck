name: Exact signed source L Mac archive QA preparation
on:
  push:
    branches: [codex/mac-private-L-qa-once]
permissions:
  contents: read
env:
  QA_PLAN: |
    {
      "schema": 1,
      "reviewed": true,
      "all_nine_qualified": false,
      "root_minisign_verified": true,
      "source": "e5500074b71b2936cd01dd9dfe8c5e154a95a835",
      "controller": "0bcad3c24b83c1a7c425ee93125218dff5670fd3",
      "qa_parent": "0bcad3c24b83c1a7c425ee93125218dff5670fd3",
      "archive_name": "ocideck-macos-0.7.7.zip",
      "archive": {
        "path": "/Users/brennodewinter/Library/Caches/OciDeck-macos-candidates/e5500074b71b2936cd01dd9dfe8c5e154a95a835/build/macos/dist/OciDeck-0.7.7-macos.zip",
        "sha256": "bb79622f7103f2cf018f9051a78cafc000db25d36fdb3a8cc219e4a1372582f8"
      },
      "manifest": {
        "path": "/private/var/tmp/ocideck-issues-20261105-r077-inputs/channel-manifest-macos.json",
        "sha256": "c574e2a31159b37b36673e03d8ea488c647364a0dccae340b862db629377d5d1"
      },
      "sums": {
        "path": "/private/var/tmp/ocideck-issues-20261105-r077-inputs/SHA256SUMS.macos",
        "sha256": "6a773e5a2bb95f3dc6f2553890cbcef1e871923ca9b912ace4e175d32d14a7f7"
      },
      "manifest_signature": {
        "path": "/private/var/tmp/ocideck-issues-20261105-r077-inputs/channel-manifest-macos.json.minisig",
        "sha256": "a828aeadb478c7a99c68ce39bcf0490b269a40dfe60deca44fe63e473d660bca"
      },
      "sums_signature": {
        "path": "/private/var/tmp/ocideck-issues-20261105-r077-inputs/SHA256SUMS.macos.minisig",
        "sha256": "9b4f28038d8f361e71216dd5653752e52024289cd0ed996987c368d9b60f3a85"
      },
      "base": "/private/var/tmp/ocideck-issues-20261105-r077",
      "helper_sha256": "2d83147bbd76000a66410fa07c87c5ff154f6c405b500a2aded44b5b3419a10e",
      "macos_qualified": true
    }
jobs:
  strong-private-archive-qa:
    runs-on: ocideck-macos-arm64
    timeout-minutes: 15
    steps:
      - name: Refuse incomplete or unreviewed inputs
        id: guard
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          p=json.loads(os.environ['QA_PLAN'])
          assert p['reviewed'] is True and p['macos_qualified'] is True and p['root_minisign_verified'] is True, 'unreviewed/incomplete template: no QA start'
          assert p['source']=='e5500074b71b2936cd01dd9dfe8c5e154a95a835'
          assert p['controller']=='0bcad3c24b83c1a7c425ee93125218dff5670fd3' and p['qa_parent']=='0bcad3c24b83c1a7c425ee93125218dff5670fd3'
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('controller='+p['controller']+'\n')
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # existing repository pin
        with:
          ref: ${{ steps.guard.outputs.controller }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize exact reviewed helper and transport
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          payload={'archive-start.py': '', 'transport.py': ''}
          expected={'archive-start.py': '2d83147bbd76000a66410fa07c87c5ff154f6c405b500a2aded44b5b3419a10e', 'transport.py': '405c00052f614f84fa24fe645ee7430e05fd1009816b643a301e7285cfa07719'}
          for name,value in payload.items():
              content=base64.b64decode(value)
              assert hashlib.sha256(content).hexdigest()==expected[name]
              path=Path(name)
              with path.open('xb') as stream:stream.write(content)
          plan=json.loads(os.environ['QA_PLAN'])
          Path('reviewed-plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          stage=Path('/private/var/tmp/ocideck-issues-20261105-r077-inputs')
          assert stage.is_absolute() and not stage.exists() and not stage.is_symlink()
          assert all(not part.is_symlink() for part in stage.parents)
          assert os.getuid()==501
          stage.mkdir(mode=0o700)
          metadata_payload={'channel-manifest-macos.json': '', 'SHA256SUMS.macos': 'YmI3OTYyMmY3MTAzZjJjZjAxOGY5MDUxYTc4Y2FmYzAwMGRiMjVkMzZmZGIzYThjYzIxOWU0YTEzNzI1ODJmOCAgb2NpZGVjay1tYWNvcy0wLjcuNy56aXAK', 'channel-manifest-macos.json.minisig': '', 'SHA256SUMS.macos.minisig': ''}
          metadata_hashes={'channel-manifest-macos.json': 'c574e2a31159b37b36673e03d8ea488c647364a0dccae340b862db629377d5d1', 'SHA256SUMS.macos': '6a773e5a2bb95f3dc6f2553890cbcef1e871923ca9b912ace4e175d32d14a7f7', 'channel-manifest-macos.json.minisig': 'a828aeadb478c7a99c68ce39bcf0490b269a40dfe60deca44fe63e473d660bca', 'SHA256SUMS.macos.minisig': '9b4f28038d8f361e71216dd5653752e52024289cd0ed996987c368d9b60f3a85'}
          previous_umask=os.umask(0o077)
          try:
              for name,value in metadata_payload.items():
                  content=base64.b64decode(value)
                  assert hashlib.sha256(content).hexdigest()==metadata_hashes[name]
                  with (stage/name).open('xb') as stream:stream.write(content)
          finally:os.umask(previous_umask)
          PY

      - name: Verify signed original archive and run private QA
        shell: bash
        env:
          QA_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B transport.py reviewed-plan.json --root-go reviewed-mac-L-private-transport
      - name: Preserve complete private QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # existing repository pin v3.2.1
        with:
          name: private-source-L-mac-archive-qa
          path: private-qa-evidence/
          if-no-files-found: warn
          retention-days: 90
