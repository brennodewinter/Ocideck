# Bouwt de Linux-desktopversie van OciDeck op de eigen Forgejo-runner (pawprint).
#
# **Handmatig, plus een smalle post-merge-trekker.** Dit draaide ooit bij elke
# push naar main en kostte daar 17,5 minuten runnertijd; #790 zette dat uit met
# het argument dat `release.yml` bij elke `v*`-tag toch al bouwt en dat de poort
# een regressie tegenhoudt, niet het inpakken achteraf.
#
# Dat argument klopte op één punt niet, en dat kostte de release van v0.4.9. Géén
# poort bouwt de Linux-desktop: `make check(-no-coverage)` draait `flutter test`,
# en `flutter build linux` kwam pas in de releaseketen langs. De
# nativeapi-migratie (#1741) bracht een plugin mee die op Linux
# `ayatana-appindicator3-0.1` opeist; niets installeerde dat; CMake viel om
# vóórdat er iets gecompileerd was; de job `linux` faalde, `publiceren` needt
# hem, en er verscheen geen release. Alle poorten stonden die hele tijd groen.
#
# Daarom bouwt hij weer na een merge — maar alleen wanneer er iets veranderde
# dat de *native* build kan breken: de opgeloste afhankelijkheden, de eigen
# Linux-runner, de gevendorde pakketten, het CI-image of de Flutter-pin.
#
# Die laatste stond er eerst niet bij, en dat was mis. Een bump die óók
# afhankelijkheden meeneemt raakt `pubspec.lock` en gaat dan vanzelf af — maar
# een kále pin-bump raakt alleen `.tool-versions`, de workflows en de
# documentatie. Juist die verandert de compiler, de engine en de gegenereerde
# CMake onder de Linux-build; hem overslaan zou dit hele mechanisme laten
# missen waarvoor het bestaat. Bij een gewone
# Dart-wijziging zwijgt hij, dus de 17,5 minuten uit #790 vallen een paar keer
# per maand en niet bij elke push. `make check-linux-deps` vangt de goedkope
# helft al in de PR zelf; deze job is er voor wat je alleen ziet door echt te
# bouwen (find_library, een header, een build-script dat een tool aanroept).
#
# De Flutter-toolchain is dezelfde als in ci.yml: de officiële stable-release
# volgens de pin in .tool-versions, sha256-geverifieerd. (Eerder stond hier het
# cirruslabs-image; dat bleek kanaal "[user-branch]" uit onbekende bron te
# bevatten — niet de toolchain waarmee dit project wil bouwen.)
name: linux-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'linux/**'
      - 'third_party/**'
      - '.tool-versions'
      - '.forgejo/ci-image/**'
      - '.forgejo/workflows/linux-build.yml'

jobs:
  build-linux:
    runs-on: docker
    # Een lege Flutter-cache plus native build, drie pakketten en twee
    # cache-uploads overschreed na de 3.47.7-bump de oude 60-minutengrens pas
    # tijdens de opruimfase, nadat de artefacten al succesvol waren geüpload.
    timeout-minutes: 90
    container:
      image: ubuntu:24.04
    steps:
      # Vóór de checkout: actions/checkout en upload-artifact zijn node-acties,
      # en dit kale image brengt geen node mee.
      - name: Gereedschap en Linux-buildafhankelijkheden installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs make git curl ca-certificates xz-utils jq unzip zip rpm file \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev \
            build-essential
          # build-essential (gcc/g++): dartcv4's native OpenCV-build (#870)
          # zoekt de standaard gcc/g++, niet de aanwezige clang — zonder dit
          # faalt de hook op "CMAKE_C_COMPILER: gcc ... not found".

      - uses: actions/checkout@v4

      # Zelfde cachelijn als ci.yml; de redenering staat daar, inclusief waarom
      # dit geen controle vervangt.
      - name: Gepinde Flutter-versie lezen
        id: pin
        run: |
          set -eu
          VERSION="$(sed -n 's/^flutter \(.*\)-stable$/\1/p' .tool-versions)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter uit de cache
        id: flutter-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-linux-${{ steps.pin.outputs.version }}-stable

      - name: Officiële Flutter volgens de pin
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          VERSION="${{ steps.pin.outputs.version }}"
          ARCHIVE="flutter_linux_${VERSION}-stable.tar.xz"
          BASE="https://storage.googleapis.com/flutter_infra_release/releases"
          curl -fsSLo /tmp/releases.json "$BASE/releases_linux.json"
          SHA=$(jq -r --arg v "$VERSION" \
            '.releases[] | select(.channel=="stable" and .version==$v) | .sha256' \
            /tmp/releases.json)
          test -n "$SHA"
          curl -fsSLo "/tmp/$ARCHIVE" "$BASE/stable/linux/$ARCHIVE"
          echo "$SHA  /tmp/$ARCHIVE" | sha256sum -c -
          tar -xJf "/tmp/$ARCHIVE" -C /opt
          rm "/tmp/$ARCHIVE"

      - name: Flutter op het pad
        run: |
          set -eu
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Linux-release bouwen
        run: flutter build linux --release

      # Toets dat de docs in de bundel byte-voor-byte gelijk zijn aan docs/ op
      # schijf, zodat een incrementele build nooit verouderde documentatie
      # meelevert.
      - name: Gebundelde documentatie vers?
        run: dart run tool/check_bundled_docs_fresh.dart build/linux

      - name: Bundel inpakken
        run: |
          set -eu
          VERSIE="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSIE"
          mkdir -p dist
          tar -C build/linux/x64/release \
            --transform "s,^bundle,ocideck-$VERSIE," \
            -czf "dist/ocideck-linux-x64-$VERSIE.tar.gz" bundle
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Linux-pakketten bouwen
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: 95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6
          OUT: dist
        run: make package-linux VERSION="$VERSIE"

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-linux
          path: dist/ocideck-linux-*

  consumer-deb:
    name: .deb proef op een schone Ubuntu
    needs: build-linux
    runs-on: docker
    timeout-minutes: 20
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Artefactactie voorbereiden
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Installeren, linken en starten
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends xvfb fonts-dejavu-core
          apt-get install -y ./dist/ocideck-linux-amd64-*.deb
          ! ldd /usr/lib/ocideck/ocideck | grep 'not found'
          set +e
          timeout 20 xvfb-run -a ocideck
          rc=$?
          set -e
          test "$rc" -eq 124

  consumer-rpm:
    name: .rpm proef op een schone Fedora
    needs: build-linux
    runs-on: docker
    timeout-minutes: 20
    container:
      image: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
    steps:
      - name: Artefactactie voorbereiden
        run: dnf install -y --setopt=install_weak_deps=False nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Installeren, linken en starten
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb dejavu-sans-fonts
          dnf install -y ./dist/ocideck-linux-x86_64-*.rpm
          ! ldd /usr/lib/ocideck/ocideck | grep 'not found'
          set +e
          timeout 20 xvfb-run -a ocideck
          rc=$?
          set -e
          test "$rc" -eq 124

  consumer-appimage:
    name: AppImage proef op een schone Ubuntu
    needs: build-linux
    runs-on: docker
    timeout-minutes: 20
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Artefactactie voorbereiden
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Uitpakken, linken en starten
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends xvfb fonts-dejavu-core \
            libgtk-3-0t64 libsecret-1-0 liblzma5 libayatana-appindicator3-1 \
            libgles2 libegl1
          cd dist
          chmod +x ocideck-linux-x86_64-*.AppImage
          ./ocideck-linux-x86_64-*.AppImage --appimage-extract >/dev/null
          ! ldd squashfs-root/ocideck | grep 'not found'
          set +e
          timeout 20 xvfb-run -a squashfs-root/AppRun
          rc=$?
          set -e
          test "$rc" -eq 124
