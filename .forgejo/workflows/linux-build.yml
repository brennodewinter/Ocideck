# Bouwt de Linux-desktopversie van OciDeck op de eigen Forgejo-runner (pawprint).
# Draait bij elke push naar main en is handmatig te starten via workflow_dispatch.
# Toolchain: `.forgejo/actions/flutter`, dezelfde als in ci.yml.
#
# Dit is de *doorlopende* Linux-build — hij bewijst per push dat main nog
# bouwt, en het artifact verloopt na negentig dagen. De Linux-download die
# blijft staan komt uit `release.yml`, op een tag.
name: linux-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      # Vóór de checkout: actions/checkout en upload-artifact zijn node-acties,
      # en dit kale image brengt geen node mee.
      - name: Gereedschap en Linux-buildafhankelijkheden installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs make git curl ca-certificates xz-utils jq unzip zip \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev

      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/flutter

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Linux-release bouwen
        run: flutter build linux --release

      - name: Bundel inpakken
        run: tar -C build/linux/x64/release/bundle -czf ocideck-linux-x64.tar.gz .

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-linux-x64
          path: ocideck-linux-x64.tar.gz
