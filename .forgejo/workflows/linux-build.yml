# Bouwt de Linux-desktopversie van OciDeck op de eigen Forgejo-runner (pawprint).
#
# **Handmatig, plus een smalle post-merge-trekker.** Dit draaide ooit bij elke
# push naar main en kostte daar 17,5 minuten runnertijd; #790 zette dat uit met
# het argument dat `release.yml` bij elke `v*`-tag toch al bouwt en dat de poort
# een regressie tegenhoudt, niet het inpakken achteraf.
#
# Dat argument klopte op één punt niet, en dat kostte de release van v0.4.9. Géén
# poort bouwt de Linux-desktop: `make check(-no-coverage)` draait `flutter test`,
# en `flutter build linux` kwam pas in de releaseketen langs. De
# nativeapi-migratie (#1741) bracht een plugin mee die op Linux
# `ayatana-appindicator3-0.1` opeist; niets installeerde dat; CMake viel om
# vóórdat er iets gecompileerd was; de job `linux` faalde, `publiceren` needt
# hem, en er verscheen geen release. Alle poorten stonden die hele tijd groen.
#
# Daarom bouwt hij weer na een merge — maar alleen wanneer er iets veranderde
# dat de *native* build kan breken: de opgeloste afhankelijkheden, de eigen
# Linux-runner, de gevendorde pakketten, het CI-image of de Flutter-pin.
#
# Die laatste stond er eerst niet bij, en dat was mis. Een bump die óók
# afhankelijkheden meeneemt raakt `pubspec.lock` en gaat dan vanzelf af — maar
# een kále pin-bump raakt alleen `.tool-versions`, de workflows en de
# documentatie. Juist die verandert de compiler, de engine en de gegenereerde
# CMake onder de Linux-build; hem overslaan zou dit hele mechanisme laten
# missen waarvoor het bestaat. Bij een gewone
# Dart-wijziging zwijgt hij, dus de 17,5 minuten uit #790 vallen een paar keer
# per maand en niet bij elke push. `make check-linux-deps` vangt de goedkope
# helft al in de PR zelf; deze job is er voor wat je alleen ziet door echt te
# bouwen (find_library, een header, een build-script dat een tool aanroept).
#
# De toolchain is dezelfde digest-gepinde CI-basis als de releasebouwer.
# De officiële SDK is tijdens imagebouw sha256-gecontroleerd; de draaiende
# versie/herkomst/het kanaal worden vóór pub en bouwen tegen .tool-versions
# getoetst. Geen per-run SDK-installatie of SDK-cache die de pin kan vervangen.
name: linux-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'linux/**'
      - 'third_party/**'
      - 'native/audio_tools/**'
      - '.tool-versions'
      - '.forgejo/ci-image/**'
      - '.forgejo/workflows/linux-build.yml'
      - 'scripts/package_linux.sh'
      - 'scripts/flatpak*.py'
      - 'scripts/linux_source_bundle.py'
      - 'scripts/apt_source_download.py'
      - 'packaging/linux/**'

jobs:
  build-linux:
    runs-on: docker
    # De grens blijft gelijk; herstel het koude voorwerk, niet de time-out.
    timeout-minutes: 240
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.50.0@sha256:e43e18573ee176a5f19165230e959d559d3f5d0116d9f151619529f99cba2841
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: De werkkopie vertrouwen
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Direct Dart-script: geen pub/native hooks vóór de SDK-controle.
      - name: Draaiende Flutter tegen de pin toetsen
        run: make check-toolchain

      # Compiler, Node, GTK en de SDK zitten al in het CI-image. Alleen de
      # aanvullende desktop-/verpakkingslibs zijn dezelfde als in release.yml.
      - name: Ontbrekende Linux-buildlibs
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends liblzma-dev libsecret-1-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libpulse-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libmpv-dev rpm file flatpak python3

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get --enforce-lockfile

      - name: dartcv4-versie uit pubspec.lock
        id: dartcv
        run: |
          VERSIE="$(grep -A8 '^  dartcv4:' pubspec.lock | grep 'version:' | sed 's/.*version: "//;s/".*//')"
          test -n "$VERSIE"
          echo "versie=$VERSIE" >> "$GITHUB_OUTPUT"

      - name: dartcv4 native OpenCV-build uit de cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dart_tool/hooks_runner
            build/native_assets
          key: dartcv-linux-${{ steps.dartcv.outputs.versie }}

      # Het gedeelde doel bouwt ook Whisper en toetst verse documentatie met
      # direct Dart, zonder na de app-build opnieuw native hooks te starten.
      # De wrapper begrenst de echte Ninja-aanroep, ook Flutter's eigen -j.
      - name: Linux-release bouwen
        run: bash scripts/run_release_linux_build.sh make build-linux

      - name: Bundel inpakken
        run: |
          set -eu
          VERSIE="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSIE"
          mkdir -p dist
          python3 scripts/linux_source_bundle.py stage "$PWD" build/linux/x64/release/bundle dist "$VERSIE"
          tar -C build/linux/x64/release \
            --transform "s,^bundle,ocideck-$VERSIE," \
            -czf "dist/ocideck-linux-x64-$VERSIE.tar.gz" bundle
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Linux-pakketten bouwen
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          OUT: dist
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//50
          make package-linux VERSION="$VERSIE"

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ocideck-linux
          path: dist/ocideck-linux-*

  consumer-deb:
    name: .deb proef op een schone Ubuntu
    needs: build-linux
    runs-on: docker
    # Een kale Ubuntu installeert de runtime opnieuw; onder runnerbelasting
    # duurde apt al langer dan 20 minuten voordat de startproef begon.
    timeout-minutes: 240
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Artefactactie voorbereiden
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Pakket installeren of uitpakken, linken en starten
        run: bash scripts/probe_linux_package.sh deb ./dist/ocideck-linux-amd64-*.deb probe-evidence
      - name: Bewijs van de pakketproef bewaren
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-probe-deb
          path: probe-evidence/
          if-no-files-found: ignore

  consumer-rpm:
    name: .rpm proef op een schone Fedora
    needs: build-linux
    runs-on: docker
    timeout-minutes: 240
    container:
      image: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
    steps:
      - name: Artefactactie voorbereiden
        run: dnf install -y --setopt=install_weak_deps=False nodejs ca-certificates git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Pakket installeren of uitpakken, linken en starten
        run: bash scripts/probe_linux_package.sh rpm ./dist/ocideck-linux-x86_64-*.rpm probe-evidence
      - name: Bewijs van de pakketproef bewaren
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-probe-rpm
          path: probe-evidence/
          if-no-files-found: ignore

  consumer-appimage:
    name: AppImage proef op een schone Ubuntu
    needs: build-linux
    runs-on: docker
    timeout-minutes: 240
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Artefactactie voorbereiden
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Pakket installeren of uitpakken, linken en starten
        run: bash scripts/probe_linux_package.sh appimage ./dist/ocideck-linux-x86_64-*.AppImage probe-evidence
      - name: Bewijs van de pakketproef bewaren
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-probe-appimage
          path: probe-evidence/
          if-no-files-found: ignore

  consumer-flatpak:
    name: Flatpak installatie en inhoud op een schone Ubuntu
    needs: build-linux
    runs-on: docker
    timeout-minutes: 240
    container:
      image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    steps:
      - name: Artefactactie voorbereiden
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs ca-certificates
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with: { name: ocideck-linux, path: dist }
      - name: Installeren en inhoud controleren
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends flatpak python3
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//50
          flatpak --user install -y --noninteractive --bundle ./dist/ocideck-linux-x86_64-*.flatpak
          app="$(flatpak --user info --show-location com.dewinter.ocideck)"
          flatpak --user info --show-metadata com.dewinter.ocideck | grep -Fx 'runtime=org.gnome.Platform/x86_64/50'
          test -x "$app/files/bin/ocideck"
          test -x "$app/files/bin/git"
          test -x "$app/files/lib/ocideck/ocideck"
          test -x "$app/files/libexec/git-core/git-remote-https"
          sh -n "$app/files/bin/ocideck"
          (cd "$app/files" && sha256sum -c share/doc/ocideck-flatpak/FILES.sha256)
          python3 "$app/files/lib/ocideck/share/doc/ocideck/verify_sources.py" verify "$app/files/lib/ocideck" --copied-files "$app/files/share/doc/ocideck-flatpak/FILES.sha256"
          cmp "$app/files/share/doc/ocideck-flatpak/components.cdx.json" ./dist/ocideck-linux-x86_64-*.flatpak.cdx.json
