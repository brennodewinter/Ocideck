# Bouwt de Linux-desktopversie van OciDeck op de eigen Forgejo-runner (pawprint).
#
# **Alleen handmatig sinds #790.** Dit draaide bij elke push naar main en kostte
# daar 17,5 minuten runnertijd, terwijl `release.yml` op de GitHub-spiegel bij
# elke `v*`-tag al een Linux-, macOS- én Windows-build maakt. Twee keer hetzelfde
# bouwen levert geen extra zekerheid op — de poort (`ci.yml`) is wat een
# regressie tegenhoudt, niet het inpakken achteraf. Wat deze workflow wél waard
# is, is een bundel op afroep zonder een tag te hoeven zetten; vandaar
# workflow_dispatch en niet weggooien.
# De Flutter-toolchain is dezelfde als in ci.yml: de officiële stable-release
# volgens de pin in .tool-versions, sha256-geverifieerd. (Eerder stond hier het
# cirruslabs-image; dat bleek kanaal "[user-branch]" uit onbekende bron te
# bevatten — niet de toolchain waarmee dit project wil bouwen.)
name: linux-build

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: docker
    container:
      image: ubuntu:24.04
    steps:
      # Vóór de checkout: actions/checkout en upload-artifact zijn node-acties,
      # en dit kale image brengt geen node mee.
      - name: Gereedschap en Linux-buildafhankelijkheden installeren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs make git curl ca-certificates xz-utils jq unzip zip \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev \
            build-essential
          # build-essential (gcc/g++): dartcv4's native OpenCV-build (#870)
          # zoekt de standaard gcc/g++, niet de aanwezige clang — zonder dit
          # faalt de hook op "CMAKE_C_COMPILER: gcc ... not found".

      - uses: actions/checkout@v4

      # Zelfde cachelijn als ci.yml; de redenering staat daar, inclusief waarom
      # dit geen controle vervangt.
      - name: Gepinde Flutter-versie lezen
        id: pin
        run: |
          set -eu
          VERSION="$(sed -n 's/^flutter \(.*\)-stable$/\1/p' .tool-versions)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter uit de cache
        id: flutter-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-linux-${{ steps.pin.outputs.version }}-stable

      - name: Officiële Flutter volgens de pin
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          VERSION="${{ steps.pin.outputs.version }}"
          ARCHIVE="flutter_linux_${VERSION}-stable.tar.xz"
          BASE="https://storage.googleapis.com/flutter_infra_release/releases"
          curl -fsSLo /tmp/releases.json "$BASE/releases_linux.json"
          SHA=$(jq -r --arg v "$VERSION" \
            '.releases[] | select(.channel=="stable" and .version==$v) | .sha256' \
            /tmp/releases.json)
          test -n "$SHA"
          curl -fsSLo "/tmp/$ARCHIVE" "$BASE/stable/linux/$ARCHIVE"
          echo "$SHA  /tmp/$ARCHIVE" | sha256sum -c -
          tar -xJf "/tmp/$ARCHIVE" -C /opt
          rm "/tmp/$ARCHIVE"

      - name: Flutter op het pad
        run: |
          set -eu
          git config --global --add safe.directory /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Pub-pakketten uit de cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-linux-

      - name: Afhankelijkheden ophalen
        run: flutter pub get

      - name: Linux-release bouwen
        run: flutter build linux --release

      # Toets dat de docs in de bundel byte-voor-byte gelijk zijn aan docs/ op
      # schijf, zodat een incrementele build nooit verouderde documentatie
      # meelevert.
      - name: Gebundelde documentatie vers?
        run: dart run tool/check_bundled_docs_fresh.dart build/linux

      - name: Bundel inpakken
        run: tar -C build/linux/x64/release/bundle -czf ocideck-linux-x64.tar.gz .

      # v4 van deze actie weigert elke niet-GitHub-server ("GHES not
      # supported"); v3 spreekt het artifact-API dat Forgejo implementeert.
      - name: Artifact bewaren
        uses: actions/upload-artifact@v3
        with:
          name: ocideck-linux-x64
          path: ocideck-linux-x64.tar.gz
