name: Original native L kernel exit and proof once
on:
  push:
    branches: [codex/native-source-L-exitwatch-077-once]
permissions:
  contents: read
jobs:
  original-native-L-exitwatch:
    runs-on: ocideck-macos-arm64
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 repository pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture original make kernel exit without signals, then read existing proofs
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,os,pathlib,subprocess
          w=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          assert os.environ['GITHUB_REF']=='refs/heads/codex/native-source-L-exitwatch-077-once'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],cwd=w,text=True).strip()=='6a7321e574dd799cbade57659216e3e0f923a66f'
          p=w/'.native-L-exitwatch-driver';p.mkdir(mode=0o700)
          payload={'watch.py': '', 'status.py': ''}
          for n,s in payload.items():(p/n).write_bytes(base64.b64decode(s))
          PY
          set +e
          python3 "$GITHUB_WORKSPACE/.native-L-exitwatch-driver/watch.py"
          watch_code=$?
          python3 "$GITHUB_WORKSPACE/.native-L-exitwatch-driver/status.py"
          collect_code=$?
          if [ "$collect_code" -ne 0 ]; then exit "$collect_code"; fi
          exit "$watch_code"
      - name: Preserve exact read-only exit and original proof
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1 repository pin
        with:
          name: original-native-L-kernel-exit-evidence
          path: |
            native-source-L-exitwatch/**
            native-source-L-status/**
          if-no-files-found: error
          retention-days: 90
