      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: certificate_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
