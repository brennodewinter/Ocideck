openapi: 3.1.0
info:
  title: OciServe API
  version: 0.1.0
  x-capability-catalog-version: 8
  x-tenant-capabilities:
    - org:admin
    - org:delete
    - member:invite
    - member:remove
    - member:read
    - role:assign
    - content:create
    - content:edit
    - content:delete
    - content:view
    - author:publish
    - assess:review
    - session:revoke
    - recovery:start
    - auth:policy
    - access_audit:read
    - system_errors:read
    - privacy:manage
    - enrollment:manage
    - training_session:manage
    - attendance:record
    - badges:manage
  description: |
    OciServe is a privacy-first learning and assessment platform.
    This is the initial API contract covering health endpoints and the
    organization/membership management surface. The contract is
    RFC-first (ADR 0010): every error follows RFC 9457 problem+json.
  contact:
    name: OciServe
    url: https://pawprint.vigilis.online
  # No license field: a product license has not yet been chosen (see
  # docs/CHECKS.md §5). Adding a license claim here before the governance
  # decision is made would publish an unconfirmed legal claim in a
  # machine-readable contract. When a license is chosen, set it once in a
  # central metadata source and generate/validate it everywhere.

servers:
  - url: https://pawprint.vigilis.online
    description: Production
  - url: http://localhost:1428
    description: Local development

tags:
  - name: Health
    description: Liveness, readiness and startup probes for orchestration.
  - name: Installation
    description: |
      Initial installation claim. These endpoints are active only before the
      first organization is created. After initialization, GET returns "ready"
      and POST /claim returns 409.
  - name: Account
    description: The authenticated account's own profile.
  - name: Organizations
    description: Tenant boundary management.
  - name: Memberships
    description: Account-to-organization role bindings.
  - name: Members
    description: Membership read, role assignment and lifecycle (suspend/reactivate/revoke).
  - name: Invitations
    description: Privacy-bounded member invitations and atomic acceptance.
  - name: IdentityOps
    description: Async identity operations (session revocation, recovery) against the provider.
  - name: AccessPolicy
    description: Organization-wide authentication policy (ACR/AMR, max auth age).
  - name: Audit
    description: Privacy-bounded access and admin audit read model.
  - name: Diagnostics
    description: Owner-only, privacy-bounded operational diagnostics.
  - name: WebAuth
    description: |
      Backend-for-Frontend (BFF) session endpoints for Flutter web builds
      (Issue #315). These endpoints use server-side sessions with HttpOnly
      cookies instead of exposing OAuth tokens to browser JavaScript.
      CSRF protection (X-CSRF-Token header) is required on mutations.
  - name: Assets
    description: |
      Content-addressed course asset uploads (images, Markdown, PDF). The only
      multipart/form-data route in the API (RFC 7578). Blobs are stored by
      SHA-256 hash and referenced from lesson `asset_hashes`.
  - name: Participants
    description: |
      The deelnemersregister: participant records, self-registration and the
      per-participant sub-resources (enrollments, attempts, evidence, etc.).
  - name: Participations
    description: |
      Aanwezigheidsparticipaties: time spent on an activity, confirmed by a
      beheerder. The server maximes attendance on the session duration and is
      the single source of truth for counted minutes.
  - name: Planning
    description: Managed course offerings, classroom sessions, capacity and attendance.
  - name: Evidence
    description: |
      Bewijsupload met quarantaineprotocol: a slot followed by a byte upload
      whose hash and size are computed server-side. Evidence content is never
      shown to a client until the server marks it `clean`.
  - name: Privacy
    description: |
      AVG-rechten van betrokkenen: export, verwijdering en anonimisering as
      async requests. Access is gated by `checkPrivacyAccess` — own data
      always, another's data requires `privacy:manage`.
  - name: PE
    description: |
      Permanente educatie: PE-regels en PE-toekenningen. Points are computed
      server-side from a confirmed participation and the rule version in
      force at the time; the client never calculates points.
  - name: Skills
    description: |
      Skills, kwalificaties en beoordeling. A qualification links a
      participant to a published skill version; review and revoke are
      append-only events, never overwrites.
  - name: Certificates
    description: |
      Certificaten uitgeven, intrekken en de PDF die het apparaat verlaat.
      Includes a public, rate-limited verification route that returns only
      non-personal data.
  - name: Blueprints
    description: |
      Toetsblauwdrukken: draft/edit/publish lifecycle met ETag-gebaseerde
      optimistic concurrency. A published blueprint version is immutable; an
      attempt to edit a non-draft blueprint returns 409.
  - name: Courses
    description: |
      Cursussen: draft/edit/publish lifecycle. Lessons reference assets by
      SHA-256 hash. Publishing requires `author:publish`; editing a draft
      requires `content:edit`.
  - name: Learning
    description: |
      Self-scoped OciDeck feed, immutable lesson packages and minimal playback
      state. Play-only is a client playback policy, not DRM. Displayed time is
      client-reported progress telemetry and never formal attendance or PE proof.
  - name: Itembank
    description: |
      Itembank: toetsitems met draft/edit/publish lifecycle. Each item has an
      interaction type (multipleChoice, trueFalse, etc.), content and an
      answer model. A published item version is immutable.

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 while the process is alive and not shutting down.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Process is shutting down.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns 200 when OciServe can serve real requests (database reachable,
        migrations applied). Returns 503 otherwise. A downstream outage flips
        readiness red without restarting the process.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Not ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /health/startup:
    get:
      tags: [Health]
      summary: Startup probe
      description: |
        Returns 200 once initial boot (migrations, pools, OIDC discovery) has
        completed. Used by the orchestrator to gate startup before liveness
        takes over.
      security: []
      responses:
        "200":
          description: Startup complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Still starting.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /health:
    get:
      tags: [Health]
      summary: Health alias
      description: |
        Alias for /health/startup — returns 200 once initial boot has completed.
        Provided for human probes and simple monitoring tools that check a
        single /health path.
      security: []
      responses:
        "200":
          description: Startup complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Still starting.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/health:
    get:
      tags: [Health]
      summary: Health alias (API prefix)
      description: |
        Alias for /health/startup under the /api/v1 prefix. Returns 200 once
        initial boot has completed. Exposed so Caddy's /api/* reverse proxy
        reaches the health endpoint without a separate route.
      security: []
      responses:
        "200":
          description: Startup complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Still starting.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/health/live:
    get:
      tags: [Health]
      summary: Liveness probe (API prefix)
      description: |
        Alias for /health/live under the /api/v1 prefix. Returns 200 while the
        process is alive and not shutting down.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Process is shutting down.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (API prefix)
      description: |
        Alias for /health/ready under the /api/v1 prefix. Returns 200 when
        OciServe can serve real requests; 503 otherwise.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Not ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/health/startup:
    get:
      tags: [Health]
      summary: Startup probe (API prefix)
      description: |
        Alias for /health/startup under the /api/v1 prefix. Returns 200 once
        initial boot has completed.
      security: []
      responses:
        "200":
          description: Startup complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Still starting.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/installation:
    get:
      tags: [Installation]
      summary: Installation status
      description: |
        Returns whether the OciServe installation has been claimed. Before
        initialization, returns "setup_required". After initialization, returns
        "ready". No authentication required — Keiko needs to know if setup is
        required before the user has logged in. Does not leak whether a setup
        code has been issued.
      security: []
      responses:
        "200":
          description: Installation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationStatus'

  /api/v1/organizations/{org_id}/me/learning-feed:
    get:
      tags: [Learning]
      summary: List the authenticated participant's learning feed
      description: Resolves the bearer account to its participant server-side and returns only active or completed enrollments, without lesson content or participant identifiers. Withdrawn enrollments are excluded.
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Minimal learning feed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfLearningFeed' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{org_id}/me/course-versions/{version_id}/lessons/{lesson_id}/package:
    get:
      tags: [Learning]
      summary: Download an immutable play-only OciDeck lesson
      description: Requires an active or completed enrollment resolved from the bearer account. The embedded play-only flag is a client playback policy and does not provide DRM or prevent extracting ZIP content.
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lesson_id
          in: path
          required: true
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ZIP-formatted `.ocideck` package containing `deck.md`, the optional immutable `theme.json`, and available private assets.
          headers:
            ETag: { schema: { type: string } }
            Digest: { schema: { type: string }, description: Base64-encoded sha-256 representation digest. }
            X-OciServe-Playback-Policy: { schema: { type: string, const: play-only } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/vnd.ocisuite.ocideck+zip:
              schema: { type: string, format: binary }
        "304": { description: The immutable package matches If-None-Match. }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{org_id}/me/course-versions/{version_id}/lessons/{lesson_id}/opened:
    post:
      tags: [Learning]
      summary: Record that OciDeck successfully opened an enrolled lesson
      description: OciDeck calls this only after the downloaded package passed local integrity checks and opened. The server revalidates the participant's enrollment before writing the privacy-bounded audit event.
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lesson_id
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "204": { description: Successful lesson open recorded. }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{org_id}/me/playback-sessions:
    post:
      tags: [Learning]
      summary: Store an idempotent cumulative playback-session snapshot
      description: The server validates all lesson and slide anchors. Displayed milliseconds are client-reported progress only, not attendance or PE evidence.
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybackSessionSnapshot' }
      responses:
        "204": { description: Snapshot stored or safely replayed. }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{org_id}/me/learning-state:
    get:
      tags: [Learning]
      summary: Get aggregate playback state for the authenticated participant
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Per-lesson aggregate state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningState' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{org_id}/me/privacy-data:
    get:
      tags: [Privacy]
      summary: View the authenticated participant's registered personal data
      description: |
        Resolves the bearer account to its participant server-side and returns
        the personal-data categories registered for this organization. The
        client supplies no participant identifier and needs no participant-
        directory capability. The read is audited, but the response is not
        persisted as another export copy. It is private and not cacheable.
        `data.participant_data_access_history` is newest-first and contains
        flat entries with `time`, `operation`, `data_category`, `purpose`,
        `actor_type`, `actor_role`, and `retain_until`; it never includes a
        staff account identifier or display name. The adjacent
        `participant_data_access_history_metadata` category states
        `available_from` and marks earlier history as unavailable.
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current registered personal data.
          content:
            application/json:
              schema:
                type: object
                required: [participant_id, generated_at, data]
                properties:
                  participant_id: { type: string, format: uuid }
                  generated_at: { type: string, format: date-time }
                  data: { type: object, additionalProperties: true }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/installation/claim:
    post:
      tags: [Installation]
      summary: Claim the initial installation
      description: |
        Creates the first organization and a permanent owner account. Requires
        the temporary bootstrap identity to authenticate with step-up
        authentication (ACR, AMR, auth_time) and a one-time setup code issued
        by `ociserve init`. A successful claim disables that bootstrap identity.
        The claim is atomic:
        concurrent claims produce exactly one winner. Supports idempotent retry
        via the Idempotency-Key header.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Required. Enables safe retry: a second request with the same key
            and body returns the same result. A second request with the same
            key but a different body returns 409.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        "201":
          description: Installation claimed successfully.
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/organizations/{organization_id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          description: |
            Step-up authentication not configured, or setup code is invalid,
            expired or revoked. A generic message avoids oracle attacks.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "409":
          $ref: '#/components/responses/ProblemResponse'
        "413":
          description: Request body exceeds the maximum size.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          description: Content-Type must be application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          description: Too many claim attempts. Includes Retry-After and RateLimit headers.
          headers:
            Retry-After:
              schema:
                type: integer
            RateLimit-Limit:
              schema:
                type: integer
            RateLimit-Remaining:
              schema:
                type: integer
            RateLimit-Reset:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/me:
    get:
      tags: [Account]
      summary: Current account
      description: |
        The Keiko-IAM contract surface (Issue #65). Returns the authenticated
        account's local account identity, memberships
        with id/status/role/effective capabilities, the union of tenant
        capabilities, the platform capabilities, required actions, provider
        features and the capability catalog version.

        Capabilities are computed from current local membership state on
        every request; roles from the access token or provider groups are
        not authoritative. Only active memberships contribute capabilities,
        so a suspended or revoked membership loses access despite a
        still-valid token. A valid token without a local account returns the
        registration view (no account, empty memberships) — never implicit
        tenant access. The response is `private, no-store`.
      responses:
        "200":
          description: Current account profile.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store`.
              example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/me/avatar:
    get:
      tags: [Account]
      summary: Current account photo
      responses:
        "200":
          description: The authenticated account's image bytes.
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Account]
      summary: Set current account photo
      description: |
        Stores a privacy-bounded image of at most 5 MiB. The image is checked
        against its declared PNG, JPEG or WebP media type. On web this mutation
        also requires the BFF CSRF header.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Photo stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "413":
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Account]
      summary: Remove current account photo
      responses:
        "204":
          description: Photo reference removed.
        "401":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/accounts/{account_id}/avatar:
    get:
      tags: [Members]
      summary: Organization member photo
      description: |
        Returns a member's current photo to callers with `member:read` in the
        same organization. Cross-organization account identifiers reveal
        nothing and return 404.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member image bytes.
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/web/login:
    get:
      tags: [WebAuth]
      summary: Start web login flow
      description: |
        Initiates an OIDC Authorization Code flow with PKCE for the web
        client. The server generates a state, nonce, and PKCE verifier,
        stores them in a short-lived HttpOnly cookie, and redirects the
        browser to the IdP's authorization endpoint. The redirect includes
        `code_challenge`, `code_challenge_method=S256`, `state`, and `nonce`
        parameters. When the server requires an ACR, it is sent as
        `acr_values`. Rate-limited per client IP.
      parameters:
        - name: login_hint
          in: query
          required: false
          schema:
            type: string
            maxLength: 320
          description: Optional identity hint for the provider.
        - name: force_authentication
          in: query
          required: false
          schema:
            type: boolean
          description: Request fresh provider authentication with `prompt=login` and `max_age=0`.
      responses:
        "303":
          description: Redirect to the IdP authorization endpoint.
          headers:
            Location:
              schema:
                type: string
              description: The IdP authorization URL with PKCE challenge, state, and nonce.
            Set-Cookie:
              schema:
                type: string
              description: |
                Short-lived HttpOnly state cookie (`ociserve_state`) containing
                the state, PKCE verifier, and nonce. SameSite=Lax, Secure in
                production. Deleted after callback.
        "429":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/web/callback:
    get:
      tags: [WebAuth]
      summary: OIDC callback
      description: |
        Receives the authorization code from the IdP, validates the state
        against the state cookie, exchanges the code for tokens (using the
        PKCE verifier), verifies the ID token (signature, issuer, audience,
        expiry, nonce), encrypts the tokens server-side, creates a session,
        and sets the session cookie. The state cookie is deleted (one-time
        use). Redirects to Keiko with the CSRF token in the URL fragment,
        which is never sent to servers or request logs. Rate-limited per
        client IP. A successful callback is written once per provider
        `auth_time` and active organization membership to the durable audit
        trail; tokens, cookies and session secrets are excluded.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from the IdP.
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State parameter from the IdP, must match the state cookie.
      responses:
        "303":
          description: Login successful. Session cookie set; redirect to Keiko.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                HttpOnly session cookie (`ociserve_sess`). SameSite=Lax,
                Secure in production. Contains an opaque 128-bit handle;
                tokens are stored server-side.
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
              example: "no-store"
            Location:
              schema:
                type: string
              description: Keiko origin with the one-time CSRF token in the URL fragment.
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "429":
          $ref: '#/components/responses/ProblemResponse'
        "500":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/web/me:
    get:
      tags: [WebAuth]
      summary: Current web session
      description: |
        Returns the OIDC subject and issuer for the current web session.
        Requires a valid session cookie. If the session is expired or
        revoked, returns 401 and clears the cookie. The response is
        `no-store`.
      responses:
        "200":
          description: Current session info.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
              example: "no-store"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthMeResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/web/logout:
    post:
      tags: [WebAuth]
      summary: End web session
      description: |
        Destroys the server-side session, clears the session cookie, and
        returns the provider's RP-initiated logout URL when advertised.
        Requires a valid session cookie and the `X-CSRF-Token` header matching
        the CSRF token issued at login. Fail-closed: a missing or mismatched
        CSRF token returns 403. A successful explicit logout is written to the
        durable audit trail before the response is returned.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
          description: CSRF token from the login response.
      responses:
        "200":
          description: Session destroyed. Navigate the browser to `logout_url`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared session cookie (MaxAge=0).
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
              example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  logout_url:
                    type: string
                    format: uri
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/web/backchannel-logout:
    post:
      tags: [WebAuth]
      summary: Revoke a provider-bound web session
      description: |
        Receives an OIDC Back-Channel Logout token directly from the identity
        provider. The signed token must contain the back-channel logout event,
        a fresh `iat`, a `jti`, and a provider session `sid`. Every local BFF
        session bound to that issuer and `sid` is revoked immediately.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
      responses:
        "204":
          description: Matching sessions revoked; also returned when none exist.
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "500":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/web/provider-logout:
    get:
      tags: [WebAuth]
      summary: Continue logout at the identity provider
      description: |
        One-time browser handoff for RP-initiated logout. Reads the encrypted
        ID-token hint from a short-lived HttpOnly cookie, clears that cookie,
        and redirects to the trusted provider's end-session endpoint. The ID
        token is never returned to browser JavaScript.
      security: []
      responses:
        "303":
          description: Redirect to the provider's end-session endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "500":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/logout:
    post:
      tags: [WebAuth]
      summary: Record an explicit native-client logout
      description: |
        Records a successful explicit logout for every active organization
        membership of the authenticated bearer-token account. Keiko calls
        this endpoint before discarding its local access and refresh tokens.
        It does not accept, persist or return token/session material. Reusing
        the same `Idempotency-Key` replays the response without a second audit
        event.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Logout recorded; the client may clear its local session.
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/auth/ocideck-login:
    post:
      tags: [WebAuth]
      summary: Record a completed interactive OciDeck login
      description: Records one privacy-bounded audit event after OciDeck completes its interactive PKCE login. Refresh and restored sessions do not call this route. Only a token issued to the configured OciDeck native client is accepted.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "204": { description: OciDeck login recorded. }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/auth/keiko-login:
    post:
      tags: [WebAuth]
      summary: Record a completed interactive Keiko login
      description: Records one privacy-bounded audit event after Keiko completes its interactive PKCE login. Refresh and restored sessions do not call this route. Only a token issued to the configured Keiko native client is accepted.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "204": { description: Keiko login recorded. }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/memberships:
    get:
      tags: [Members]
      summary: List memberships
      description: |
        Returns a privacy-bounded, cursor-paginated list of memberships for
        the organization. The actor must hold a membership with the
        `member:read` capability. Only `display_name` is exposed from
        accounts — never email, OIDC subject, issuer or credentials.
        `assignable_roles` and `available_actions` are derived from the
        actor's role by the server. Hard limits bound page size and filters
        to prevent scraping and costly queries.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size, clamped to [1, 100].
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque keyset cursor from a previous response's `next_cursor`.
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive substring of display_name.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name_asc, name_desc]
          description: Stable display-name ordering.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, suspended, revoked]
          description: Filter by membership status.
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [owner, organization_admin, instructor, author, assessor, participant]
          description: Filter by role.
      responses:
        "200":
          description: A page of memberships.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store`.
              example: "private, no-store"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipsListResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Members]
      summary: Create a member directly
      description: |
        Creates an immediately usable identity, local account and active
        membership without an invitation or email job. Requires
        `member:invite`; only an owner may create another owner. Passwords are
        sent only to the configured identity provider and are never stored.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
      responses:
        "201":
          description: The directly created membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipItem'
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "409": { $ref: '#/components/responses/ProblemResponse' }
        "503": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/memberships/{membership_id}:
    get:
      tags: [Members]
      summary: Membership detail
      description: |
        Returns a single membership with a strong ETag. The actor must hold
        `member:read`. `If-None-Match` is honoured with 304. Only
        `display_name` is exposed from accounts. `history` contains only
        successful membership changes for this account plus its creation.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: The ETag from a previous response; returns 304 if unchanged.
      responses:
        "200":
          description: The membership detail.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store`.
              example: "private, no-store"
            ETag:
              schema:
                type: string
              description: Strong ETag; hash of the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipDetailResponse'
        "304":
          description: Not modified — the ETag matches.
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags: [Members]
      summary: Change membership role
      description: |
        Updates the role of a membership using JSON Merge Patch (RFC 7396).
        Requires `member:assign`. `If-Match` with the current ETag is
        required for optimistic concurrency; a mismatch returns 412. The
        actor cannot change their own role. Granting the owner role
        requires step-up authentication. The last-active-owner invariant
        is enforced: downgrading the only active owner returns 409.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: The ETag from a previous GET, or `*` to match any current representation; mismatch yields 412.
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: Client-generated key for safe retry after a lost response.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MembershipPatch'
      responses:
        "200":
          description: The updated membership detail.
          headers:
            Cache-Control:
              schema: { type: string }
              example: "private, no-store"
            ETag:
              schema: { type: string }
              description: Strong ETag of the new representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipDetail'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'
        "412":
          description: The If-Match ETag does not match the current state; re-read and retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/suspend:
    post:
      tags: [Members]
      summary: Suspend a membership
      description: |
        Suspends a membership (active → suspended). Requires `member:remove`.
        Self-suspend is blocked. Only an owner can suspend another owner.
        The last-active-owner invariant is enforced.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: Client-generated key for safe retry after a lost response.
      responses:
        "200":
          description: The suspended membership.
          headers:
            Cache-Control:
              schema: { type: string }
              example: "private, no-store"
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipDetail'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/profile:
    put:
      tags: [Members]
      summary: Update personal details
      description: Updates the actor's own profile, or another member when the actor has `org:admin`. The optional reason is stored in the audit event.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: Strong ETag returned by the membership detail endpoint, or `*` to match any current representation. }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MemberProfileInput' } }
      responses:
        "200": { description: Updated member, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipItem' } } } }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }
        "412": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/reactivate:
    post:
      tags: [Members]
      summary: Reactivate a suspended membership
      description: |
        Reactivates a suspended membership (suspended → active). Requires
        `member:remove`. A revoked membership is terminal and cannot be
        reactivated (409).
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: Client-generated key for safe retry after a lost response.
      responses:
        "200":
          description: The reactivated membership.
          headers:
            Cache-Control:
              schema: { type: string }
              example: "private, no-store"
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipDetail'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/revoke:
    post:
      tags: [Members]
      summary: Revoke a membership
      description: |
        Revokes a membership (→ revoked, terminal). Requires `member:remove`.
        Self-revoke is blocked. Only an owner can revoke another owner.
        The last-active-owner invariant is enforced. This changes only the
        local organization membership: the account and provider identity are
        never deleted. Retrying an already completed revocation returns the
        current revoked membership without creating another audit event.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: |
            Client-generated key for safe retry after a lost response. A
            repeated revocation is a successful no-op and returns HTTP 200.
      responses:
        "200":
          description: The revoked membership.
          headers:
            Cache-Control:
              schema: { type: string }
              example: "private, no-store"
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipDetail'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/revoke-sessions:
    post:
      tags: [Members]
      summary: Revoke provider sessions for a member
      description: |
        Asynchronously revokes all provider (Keycloak) sessions for the
        target account. Requires `session:revoke`. Step-up authentication
        is required when acting on another user. Shared-account protection
        blocks acting on a target that has an active membership in another
        organization. Returns 202 with a `Location` header pointing at the
        identity operation tracking the async provider call.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: Client-generated key for safe retry after a lost response.
      responses:
        "202":
          description: Accepted; the identity operation is processing.
          headers:
            Location:
              schema: { type: string }
              description: URL of the identity operation tracking this action.
            Cache-Control:
              schema: { type: string }
              example: "private, no-store"
          content:
            application/json:
              schema:
                type: object
                required: [operation_id]
                properties:
                  operation_id: { type: string, format: uuid }
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/sessions:
    get:
      tags: [Members]
      summary: List active managed web sessions
      description: |
        Lists at most 100 active OciServe web sessions without token, address
        or user-agent data. Own sessions are always allowed; another member
        requires `session:revoke`.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active managed web sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSessionList' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }
        "503": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/sessions/{session_id}:
    delete:
      tags: [Members]
      summary: Revoke one managed web session
      description: |
        Revokes one OciServe web session and records an audit event. Own
        sessions are always allowed; another member requires `session:revoke`.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }
        "503": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/memberships/{membership_id}/start-recovery:
    post:
      tags: [Members]
      summary: Start provider-led recovery for a member
      description: |
        Asynchronously starts a provider-led recovery flow for the target
        account. Requires `recovery:start`. Step-up authentication is
        required when acting on another user. The response is always 202
        Accepted regardless of whether the identity exists, to prevent
        enumeration. Returns a `Location` header for the identity operation.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membership_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: Client-generated key for safe retry after a lost response.
      responses:
        "202":
          description: Accepted; the identity operation is processing.
          headers:
            Location:
              schema: { type: string }
              description: URL of the identity operation tracking this action.
            Cache-Control:
              schema: { type: string }
              example: "private, no-store"
          content:
            application/json:
              schema:
                type: object
                required: [operation_id]
                properties:
                  operation_id: { type: string, format: uuid }
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/identity-operations/{op_id}:
    get:
      tags: [IdentityOps]
      summary: Identity operation status
      description: |
        Returns the product-level status of an identity operation (session
        revocation or recovery). The op_id is an opaque UUIDv7, not an
        authorization proof. The caller can read their own operations
        (self-scoped via RLS); operations the caller initiated as an actor
        on another user require knowing the owning organization. No
        provider tokens, fencing tokens, or lease metadata are exposed.
      parameters:
        - name: op_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The identity operation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityOperation'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/access-policy:
    get:
      tags: [AccessPolicy]
      summary: Read the organization authentication policy
      description: |
        Returns the org-wide authentication policy (required ACR/AMR, max
        auth age, strict mode). Requires `member:read`. Returns defaults
        when no policy has been set.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The authentication policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [AccessPolicy]
      summary: Update the organization authentication policy
      description: |
        Upserts the org-wide authentication policy. Requires `auth:policy`
        (owner only) and step-up authentication. Fail-closed: weakening the
        policy (removing ACR/AMR requirements or increasing max_auth_age)
        is rejected with 409 unless the current policy is already weaker.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
          description: Client-generated key for safe retry after a lost response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPolicy'
      responses:
        "200":
          description: The updated authentication policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/registration-policy:
    put:
      tags: [AccessPolicy]
      summary: Update the organization registration policy
      description: |
        Selects `closed`, `invitation`, or `self_service`. Requires the
        owner-only `auth:policy` capability, step-up authentication, and an
        idempotency key.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_policy]
              properties:
                registration_policy:
                  type: string
                  enum: [closed, invitation, self_service]
      responses:
        "200":
          description: Updated registration policy.
          content:
            application/json:
              schema:
                type: object
                required: [registration_policy]
                properties:
                  registration_policy:
                    type: string
                    enum: [closed, invitation, self_service]
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/access-audit-events:
    get:
      tags: [Audit]
      summary: List access audit events
      description: |
        Returns a privacy-bounded page of access audit events for the
        organization. Requires `access_audit:read`. Cursor pagination over
        (created_at, id) DESC. Only opaque account references, actions,
        results and policy metadata are exposed — no tokens, provider
        bodies, emails, or invitation secrets.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: action
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of access audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessAuditEventList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/system-errors:
    get:
      tags: [Diagnostics]
      summary: List recent sanitized system errors
      description: |
        Returns the bounded in-memory error view from all OciServe components.
        Only an active owner of the organization may read it. Raw error values,
        stack traces, request bodies, credentials and arbitrary log attributes
        are never returned. A server restart clears the view.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Recent system errors, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemErrorList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/smtp-settings:
    get:
      tags: [Organizations]
      summary: Get organisation SMTP settings
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: SMTP settings without the password, content: { application/json: { schema: { $ref: '#/components/schemas/SMTPSettings' } } } }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
    put:
      tags: [Organizations]
      summary: Save organisation SMTP settings
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SMTPSettingsInput' } }
      responses:
        "200": { description: Settings saved, content: { application/json: { schema: { $ref: '#/components/schemas/SMTPSettings' } } } }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/smtp-settings/test:
    post:
      tags: [Organizations]
      summary: Send an SMTP test email
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [to_address], properties: { to_address: { type: string, format: email } } } }
      responses:
        "200": { description: Test result, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, message: { type: string } } } } } }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/smtp-settings/lookup:
    post:
      tags: [Organizations]
      summary: Look up the organisation's SMTP server through DNS MX
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [domain], properties: { domain: { type: string } } } }
      responses:
        "200": { description: DNS lookup result, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/setup:
    get:
      tags: [Organizations]
      summary: Get mandatory organization setup status
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Setup status, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSetupStatus' } } } }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/setup/complete:
    post:
      tags: [Organizations]
      summary: Complete mandatory organization setup
      description: Requires `org:admin` and a successful SMTP test. Installs the published PPL example and unlocks learning-content endpoints.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Setup completed, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSetupStatus' } } } }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "409": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/invitations:
    post:
      tags: [Invitations]
      summary: Create invitation
      description: |
        Creates a pending invitation. Requires `member:invite` (owner or
        organization_admin). The role must be in the actor's assignable roles.
        `Idempotency-Key` is required. The secret is returned exactly once
        in this response and never persisted in replay storage — store it
        securely. Repeating the same request key returns `409` because the
        one-time secret cannot safely be replayed.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        "201":
          description: Invitation created. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithSecret'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
    get:
      tags: [Invitations]
      summary: List invitations
      description: |
        Returns pending and historical invitations. Requires `member:read`.
        No secret is ever included in list responses.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, accepted, expired, revoked] }
      responses:
        "200":
          description: A page of invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/invitations/{invitation_id}:
    get:
      tags: [Invitations]
      summary: Invitation detail
      description: |
        Returns a single invitation. Requires `member:read`. No secret is
        ever included in the detail response.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The invitation detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Invitations]
      summary: Revoke invitation
      description: |
        Revokes a pending invitation. Requires `member:invite`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Invitation revoked.
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/invitation-registration-preview:
    post:
      tags: [Invitations]
      summary: Validate an invitation for first-time registration
      security: []
      description: |
        Public, rate-limited anti-enumeration endpoint. A valid invitation
        number and one-time code return only the invited email address needed
        for registration. Missing, wrong, expired, revoked, exhausted and
        already-used invitations share one generic 400 response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRegistrationPreviewRequest'
      responses:
        "200":
          description: Invitation is available for registration.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationRegistrationPreview'
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "429": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/invitation-registrations:
    post:
      tags: [Invitations]
      summary: Register and accept an invitation
      security: []
      description: |
        Public first-time registration. The password is forwarded directly to
        the configured provider adapter and is never stored, logged, audited
        or retained in an idempotency payload. The provider identity is bound
        to this invitation. Provider activation happens while the invitation
        is locked; invitation acceptance, account and membership then commit
        atomically. Retry with the same Idempotency-Key is safe.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRegistration'
      responses:
        "201":
          description: Identity activated and invitation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResult'
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "429": { $ref: '#/components/responses/ProblemResponse' }
        "503": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/invitation-acceptances:
    post:
      tags: [Invitations]
      summary: Accept invitation
      description: |
        Atomically accepts an invitation. The caller authenticates via OIDC;
        if no local account exists, one is created. A membership is inserted
        in the same serializable transaction. `Idempotency-Key` is required.
        Responses are generic for all failure modes (not found, wrong secret,
        expired, revoked, max attempts) to prevent enumeration.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
      responses:
        "201":
          description: Invitation accepted; membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResult'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/assets:
    post:
      tags: [Assets]
      summary: Upload a course asset
      description: |
        Accepts a `multipart/form-data` upload (RFC 7578) with a single `file`
        part and stores it in the private, content-addressed blob store. The
        returned `hash` is the SHA-256 of the content and can be referenced
        from lesson `asset_hashes`. The actor must hold the `content:create`
        capability.

        The upload is bounded to 2 GiB total file size and streamed to storage.
        The content type
        is validated against an allow-list (`image/png`, `image/jpeg`,
        `image/webp`, `text/markdown`, `application/pdf`) and the magic bytes
        are checked against the claimed type, so a renamed executable or HTML
        file is rejected. Storing the same content twice is idempotent: the
        same hash is returned without rewriting. File names from the client
        are metadata only and never used as a storage path.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: |
            Optional. Storage is content-addressed, so re-uploading identical
            bytes already returns the same hash; the key is accepted for
            client-side retry safety.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The asset file (image, Markdown or PDF).
      responses:
        "201":
          description: Asset stored; returns the content hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadResponse'
        "400":
          description: |
            Malformed multipart, missing `file` field, blob store not
            configured, content exceeds the maximum size, or unsupported
            content type / magic-byte mismatch.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "401":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/assets/{hash}:
    get:
      tags: [Assets]
      summary: Download an organization asset
      description: Returns original asset bytes only when the hash was uploaded within this organization.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: hash, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        "200":
          description: Original asset bytes.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/octet-stream: {}
            application/vnd.ocideck+zip: {}
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/self-register:
    post:
      tags: [Participants]
      summary: Self-register as a participant
      description: |
        Lets an authenticated user register themselves as a participant in an
        organization whose registration policy allows self-service. No prior
        local account or membership is required: both the account and a
        participant membership are created as part of the flow. The org policy
        is the gate. When the policy is closed the server returns 403.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfRegisterRequest'
      responses:
        "201":
          description: Participant created (or re-attached to the existing account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfRegisterResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          description: Organization does not allow self-service registration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/participations:
    post:
      tags: [Participations]
      summary: Record a participation
      description: |
        Creates a participation record (time on an activity). The actor must
        hold `content:create`. Semantically one-time per activity instance:
        an `Idempotency-Key` is required so a repeated submission does not
        double-count minutes. The server is the source of truth for counted
        minutes — it maximes attendance on the session duration.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipationCreateRequest'
      responses:
        "201":
          description: Participation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/participations/{participation_id}:
    get:
      tags: [Participations]
      summary: Participation detail
      description: |
        Returns a single participation. The actor must hold `content:view`
        and be the linked participant, or hold `assess:review` or
        `privacy:manage`. Staff access is audit-logged.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The participation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/participations/{participation_id}/confirm:
    post:
      tags: [Participations]
      summary: Confirm a participation
      description: |
        Confirms a participation, fixing the counted time. The actor must hold
        `content:create`. Only confirmed time counts toward PE; the server
        records who confirmed and why. A reason is optional but, when given,
        is audited.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional confirmation reason; audited when present.
      responses:
        "200":
          description: Participation confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/evidence-uploads:
    post:
      tags: [Evidence]
      summary: Request an evidence upload slot
      description: |
        Step 1 of the quarantine protocol: declares the file metadata
        (filename, declared type/size/hash) and reserves a slot. The actor
        must hold `content:create`. An `Idempotency-Key` is required so a
        retried request does not create a second slot. The slot starts in
        `pending` status; the client then uploads the bytes through the
        content endpoint. That endpoint computes the stored hash and size
        server-side and completes the slot atomically.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceSlotRequest'
      responses:
        "201":
          description: Slot reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/organizations/{organization_id}/evidence-uploads/{evidence_id}/content:
    put:
      tags: [Evidence]
      summary: Upload evidence bytes
      description: |
        Step 2 of the quarantine protocol: the client uploads the raw bytes.
        The server stores them in the blob store (validating magic bytes
        against the declared type) and transitions the slot to `uploaded`
        using the server-computed hash and size — not client-reported values.
        A quarantine worker then verifies and promotes the slot to `clean`.
        The actor must hold `content:create` and the slot must be `pending`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Bytes stored; slot transitioned to `uploaded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: Slot is not in the `pending` state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Evidence]
      summary: Download verified evidence
      description: |
        Serves the evidence bytes. The slot must be in the `clean` state —
        evidence that has not been server-side verified (`pending`,
        `uploaded`, `rejected`) is never downloadable. The actor must hold
        `content:view` and be the linked participant, or hold `assess:review`
        or `privacy:manage`. Staff access is audit-logged.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The verified evidence bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          description: Slot is not `clean` (not yet verified), or capability missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/evidence-uploads/{evidence_id}:
    get:
      tags: [Evidence]
      summary: Evidence upload detail
      description: |
        Returns the state of an evidence slot, including the verification
        status and rejection reason once scanned. The actor must hold
        `content:view` and be the linked participant, or hold `assess:review`
        or `privacy:manage`. Staff access is audit-logged. Evidence content is
        never embedded — only metadata and the blob hash.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The evidence slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/privacy-requests:
    get:
      tags: [Privacy]
      summary: List organization privacy requests
      description: |
        Returns privacy-request metadata across the organization. Export
        results and failure details are excluded. Requires `privacy:manage`.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, in_progress, completed, failed] } }
        - { name: request_type, in: query, required: false, schema: { type: string, enum: [export, delete, anonymize] } }
        - { name: created_from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: created_to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: A filtered page of privacy request metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestSummaryList' }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }

  /api/v1/organizations/{organization_id}/privacy-requests/{request_id}:
    get:
      tags: [Privacy]
      summary: Privacy request detail
      description: |
        Returns a single privacy request (export, delete or anonymize).
        Access is gated by `checkPrivacyAccess`: a participant may read their
        own requests; reading another's requires `privacy:manage`. The
        request is async — poll this endpoint to follow `pending` →
        `in_progress` → `completed`/`failed`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The privacy request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-awards:
    post:
      tags: [PE]
      summary: Award PE points
      description: |
        Computes and records PE points for a confirmed participation using the
        rule version in force. The actor must hold `content:create`. An
        `Idempotency-Key` is required — awarding is semantically one-time.
        The participation must already be confirmed; awarding against an
        unconfirmed participation returns 400. Points are computed server-side
        from the participation minutes and the rule; the client never sends a
        point value.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PEAwardCreateRequest'
      responses:
        "201":
          description: PE award recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEAwardResponse'
        "400":
          description: |
            Malformed body, or the participation is not yet confirmed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-awards/{award_id}:
    get:
      tags: [PE]
      summary: PE award detail
      description: |
        Returns a single PE award, including the rule version used and the
        computed points. The actor must hold `content:view` and be the linked
        participant, or hold `assess:review` or `privacy:manage`. Staff access
        is audit-logged.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: award_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The PE award.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEAwardResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-awards/{award_id}/correct:
    post:
      tags: [PE]
      summary: Correct a PE award
      description: |
        Corrects a PE award. The correction is recorded as an event and does
        not overwrite the original decision; the award transitions to
        `corrected`. The actor must hold `content:create`. Only an `active`
        award can be corrected; correcting a non-active award returns 409.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: award_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional correction reason; audited when present.
      responses:
        "200":
          description: Award corrected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEAwardResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: The award is not `active`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/pe-awards/{award_id}/revoke:
    post:
      tags: [PE]
      summary: Revoke a PE award
      description: |
        Revokes a PE award. Like correction, revocation is an append-only
        event; the award transitions to `revoked`. The actor must hold
        `content:create`. Only an `active` award can be revoked; revoking a
        non-active award returns 409.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: award_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional revocation reason; audited when present.
      responses:
        "200":
          description: Award revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PEAwardResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: The award is not `active`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/qualifications:
    post:
      tags: [Skills]
      summary: Issue a qualification
      description: |
        Links a participant to a published skill version by issuing a
        qualification in `pending` status. The actor must hold
        `content:create`. An `Idempotency-Key` is required. The skill version
        must be published; issuing against an unpublished version returns 400.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationCreateRequest'
      responses:
        "201":
          description: Qualification issued (pending review).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/qualifications/{qual_id}:
    get:
      tags: [Skills]
      summary: Qualification detail
      description: |
        Returns a single qualification with its status history snapshot. The
