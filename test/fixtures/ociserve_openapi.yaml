            type: string
            format: uuid
        - name: qual_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The qualification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/qualifications/{qual_id}/review:
    post:
      tags: [Skills]
      summary: Review a qualification
      description: |
        Approves or rejects a `pending` qualification. The review is an
        append-only event; the qualification transitions to `approved` or
        `rejected`. The actor must hold `assess:review` or `content:create`.
        Reviewing an already-reviewed qualification returns 409. Evidence
        hashes may be attached to substantiate the decision.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: qual_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualificationReviewRequest'
      responses:
        "200":
          description: Qualification reviewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: The qualification has already been reviewed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/qualifications/{qual_id}/revoke:
    post:
      tags: [Skills]
      summary: Revoke a qualification
      description: |
        Revokes a qualification. Revocation is an append-only event; the
        qualification transitions to `revoked`. The actor must hold
        `assess:review` or `content:create`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: qual_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional revocation reason; audited when present.
      responses:
        "200":
          description: Qualification revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-rules:
    get:
      tags: [PE]
      summary: List PE rules
      description: Returns the PE rules in the organization. The actor must hold `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of PE rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [PE]
      summary: Create a PE rule
      description: |
        Creates a new PE-regel in `draft` status. The actor must hold
        `content:create`. An `Idempotency-Key` is required. The rule body
        (definition) is edited via the draft endpoint.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PERuleCreateRequest'
      responses:
        "201":
          description: PE rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-rules/{rule_id}:
    get:
      tags: [PE]
      summary: PE rule detail
      description: Returns a single PE rule. The actor must hold `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The PE rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-rules/{rule_id}/draft:
    get:
      tags: [PE]
      summary: Get the PE rule draft
      description: |
        Returns the editable draft definition with a strong ETag. The actor
        must hold `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from a previous response; returns 304 if unchanged.
      responses:
        "200":
          description: The draft definition.
          headers:
            ETag:
              schema:
                type: string
              description: Strong ETag; use in If-Match on PUT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleDraftResponse'
        "304":
          description: Not modified.
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [PE]
      summary: Save the PE rule draft
      description: |
        Replaces the draft definition. The actor must hold `content:create`.
        `If-Match` with the current ETag (or `*` for any current representation) is required for optimistic
        concurrency; a mismatch returns 412.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: The current ETag, or `*` to match any current representation; a mismatch returns 412.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  type: object
                  additionalProperties: true
                  description: The PE rule definition.
      responses:
        "200":
          description: Draft saved.
          headers:
            ETag:
              schema:
                type: string
              description: The new ETag after the save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleDraftResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "412":
          description: ETag mismatch — the draft was modified by another request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/pe-rules/{rule_id}/publish:
    post:
      tags: [PE]
      summary: Publish a PE rule version
      description: |
        Freezes the current draft into an immutable, published version. The
        actor must hold `content:create`. An `Idempotency-Key` is required.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleVersionResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/pe-rules/{rule_id}/versions:
    get:
      tags: [PE]
      summary: List PE rule versions
      description: |
        Returns all published versions of a PE rule. The actor must hold
