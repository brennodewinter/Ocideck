  /api/v1/organizations/{organization_id}/themes:
    get:
      tags: [Themes]
      summary: List theme profiles
      description: |
        Returns theme profiles in the organization. The actor must hold
        `content:view`. Built-in profiles (LibreKAT, Standaard, Security,
        Vigilis) are seeded on first list. Supports `limit` (default 50, max
        100) and `cursor` for pagination.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A paginated list of theme profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Themes]
      summary: Create a theme profile
      description: |
        Creates a new theme profile. The actor must hold `content:create`.
        An `Idempotency-Key` is required. The `definition` is an opaque JSON
        object stored and served unchanged; OciServe validates only that it is
        a JSON object.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeCreateRequest'
      responses:
        "201":
          description: Theme created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeItem'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: A theme with this name already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/themes/{theme_id}:
    get:
      tags: [Themes]
      summary: Theme profile detail
      description: |
        Returns a single theme profile with a strong ETag. The actor must hold
        `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: theme_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The theme profile.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeItem'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Themes]
      summary: Update a theme profile
      description: |
        Updates a theme profile's name and definition. Requires `If-Match`
        with the current ETag or `*` to match any current representation.
        The actor must hold `content:edit`. Built-in
        profiles are read-only and cannot be updated.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: theme_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeUpdateRequest'
      responses:
        "200":
          description: Theme updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeItem'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: ETag mismatch or name conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Themes]
      summary: Delete a theme profile
      description: |
        Deletes a theme profile. The actor must hold `content:create`.
        Built-in profiles cannot be deleted. A theme in use by a course or
        published version cannot be deleted.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: theme_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Theme deleted.
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: Theme is in use or is built-in.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

