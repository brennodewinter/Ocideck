                $ref: '#/components/schemas/CertificateResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/certificates/{certificate_id}:
    get:
      tags: [Certificates]
      summary: Certificate detail
      description: |
        Returns a single certificate. The actor must hold `content:view` and
