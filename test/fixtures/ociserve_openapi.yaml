  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts:
    get:
      tags: [Participants]
      summary: List attempts
      description: |
        Returns a participant's assessment attempts. The actor must hold
        `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Participants]
      summary: Start an attempt
      description: |
        Starts a new assessment attempt from a blueprint version. The actor
        must hold `content:create`. An `Idempotency-Key` is required. When the
        published criteria contain a time limit, the server computes and
        returns the immutable deadline.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptStartRequest'
      responses:
        "201":
          description: Attempt started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts/{attempt_id}:
    get:
      tags: [Participants]
      summary: Attempt detail
      description: |
        Returns a single attempt with its items. The actor must hold
        `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The attempt with items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetailResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts/{attempt_id}/items/{attempt_item_id}/answer:
    put:
      tags: [Participants]
      summary: Save an answer
      description: |
        Saves or updates the answer for a single attempt item. The actor
        must hold `content:edit`. Answers are revisioned; a concurrent
        update or a new answer at or after the server deadline returns 409.
        Retrying an answer already stored under the same idempotency key still
        returns that original answer.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerPutRequest'
      responses:
        "200":
          description: Answer saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: Concurrent update conflict, closed attempt, or deadline passed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts/{attempt_id}/answers:
    get:
      tags: [Participants]
      summary: List answers
      description: |
        Returns all answers for an attempt. The actor must hold
        `content:view`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
