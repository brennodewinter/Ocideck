      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of published versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PERuleVersionList'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/certificates:
