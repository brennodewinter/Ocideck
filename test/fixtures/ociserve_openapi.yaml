      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: certificate_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The certificate PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
