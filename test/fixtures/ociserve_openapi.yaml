                $ref: '#/components/schemas/CertificateResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/certificates/{certificate_id}/pdf:
    get:
      tags: [Certificates]
      summary: Download the certificate PDF
      description: |
        Returns the stored PDF as a binary download. The actor must hold
