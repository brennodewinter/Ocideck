  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts/{attempt_id}/submit:
    post:
      tags: [Participants]
      summary: Submit an attempt
      description: |
        Submits the attempt for scoring. The actor must hold
        `content:create`. The attempt transitions from `in_progress` to
        `submitted`; submitting a non-in-progress attempt returns 409. A late
        finalization scores only answers accepted before the deadline and uses
        that deadline as the effective submission time.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attempt submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          description: The attempt is not in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts/{attempt_id}/score:
    get:
      tags: [Participants]
      summary: Get attempt score
      description: |
        Returns the score or the opaque item IDs still awaiting human review.
        The actor must hold `assess:review` or `content:create`. The participant
        linked to this attempt may read their own score after it is released.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The attempt score.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptScoreResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'

    post:
      tags: [Participants]
      summary: Complete manual attempt scoring
      description: |
        Supplies one human correctness decision for every pending item. The
        attempt remains `submitted` until this complete review succeeds and
        then transitions atomically to `scored`. The actor must hold
        `assess:review` or `content:create`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptManualScoreRequest'
      responses:
        "200":
          description: Manual review completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
          $ref: '#/components/responses/ProblemResponse'

  /api/v1/organizations/{organization_id}/participants/{participant_id}/attempts/{attempt_id}/release:
    post:
      tags: [Participants]
      summary: Release attempt results
      description: |
        Releases the scored attempt to the participant. The actor must hold
        `assess:review` or `content:create`. The attempt transitions to
        `released`.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attempt released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        "400":
          $ref: '#/components/responses/ProblemResponse'
        "401":
          $ref: '#/components/responses/ProblemResponse'
        "403":
          $ref: '#/components/responses/ProblemResponse'
        "404":
          $ref: '#/components/responses/ProblemResponse'
        "409":
