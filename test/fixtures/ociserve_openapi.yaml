            schema: { $ref: '#/components/schemas/SessionAttendanceRequest' }
      responses:
        "204": { description: Attendance confirmed and lesson completion recalculated. }
        "400": { $ref: '#/components/responses/ProblemResponse' }
        "401": { $ref: '#/components/responses/ProblemResponse' }
        "403": { $ref: '#/components/responses/ProblemResponse' }
        "404": { $ref: '#/components/responses/ProblemResponse' }

components:
  schemas:
    CourseOfferingCreateRequest:
      type: object
      required: [name]
      description: Provide course_id to create an immutable snapshot from a draft or use the latest published version. course_version_id remains available for callers that already selected a version.
      properties:
        course_id: { type: string, format: uuid }
        course_version_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        image_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Optional organization-owned PNG, JPEG, or WebP image.
        self_enrollment_enabled: { type: boolean, default: false }

    CourseOfferingResponse:
      type: object
      required: [id, course_version_id, name, self_enrollment_enabled, status, created_at, classroom_lessons]
      properties:
        id: { type: string, format: uuid }
        course_version_id: { type: string, format: uuid }
        name: { type: string }
        image_hash:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        self_enrollment_enabled: { type: boolean }
        status: { type: string, enum: [draft, open, closed, archived] }
        created_at: { type: string, format: date-time }
        classroom_lessons:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string }
              title: { type: string }

    CourseOfferingList:
      type: object
      required: [offerings]
      properties:
        offerings:
          type: array
          items: { $ref: '#/components/schemas/CourseOfferingResponse' }

    TrainingSessionCreateRequest:
      type: object
      required: [lesson_id, title, starts_at, ends_at, timezone, location, capacity]
      properties:
        lesson_id: { type: string }
        title: { type: string, minLength: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string, description: Original IANA timezone used for human planning. }
        location: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }

    TrainingSessionResponse:
      type: object
      required: [id, course_offering_id, lesson_id, title, starts_at, ends_at, timezone, location, capacity, booked, waitlisted, status]
      properties:
        id: { type: string, format: uuid }
        course_offering_id: { type: string, format: uuid }
        lesson_id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string }
        location: { type: string }
        capacity: { type: integer }
        booked: { type: integer }
        waitlisted: { type: integer }
        status: { type: string, enum: [scheduled, cancelled, completed] }

    TrainingSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/TrainingSessionResponse' }

    ManagedRegistrationRequest:
      type: object
      required: [participant_id, session_ids]
      properties:
        participant_id: { type: string, format: uuid }
        session_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        allow_waitlist: { type: boolean, default: false }

    SessionBookingResponse:
      type: object
      required: [id, session_id, status]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        status: { type: string, enum: [booked, waitlisted, cancelled] }

    ManagedRegistrationResponse:
      type: object
      required: [enrollment_id, bookings]
      properties:
        enrollment_id: { type: string, format: uuid }
        bookings:
          type: array
          items: { $ref: '#/components/schemas/SessionBookingResponse' }

    SessionRosterEntry:
      type: object
      required: [participant_id, display_name, booking_status, minutes, confirmed, lesson_completed]
      properties:
        participant_id: { type: string, format: uuid }
        display_name: { type: string }
        booking_status: { type: string, enum: [booked, waitlisted, cancelled] }
        attendance_kind: { type: string, enum: [full, partial, absent] }
        minutes: { type: integer, minimum: 0 }
        confirmed: { type: boolean }
        lesson_completed: { type: boolean }

    SessionRoster:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items: { $ref: '#/components/schemas/SessionRosterEntry' }

    AttendanceEntry:
      type: object
      required: [participant_id, kind]
      properties:
        participant_id: { type: string, format: uuid }
        kind: { type: string, enum: [full, partial, absent] }
        minutes:
          type: integer
          minimum: 0
          description: Required for partial attendance; ignored for full and absent.

    SessionAttendanceRequest:
      type: object
      required: [entries]
      properties:
        reason:
          type: string
          description: Required when changing previously confirmed attendance.
        entries:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AttendanceEntry' }

    AssetUploadResponse:
      type: object
      required: [hash, size, content_type]
      properties:
        hash:
          type: string
          description: |
            SHA-256 hash of the stored content (hex-encoded). Content-addressed:
            identical bytes always produce the same hash.
        size:
          type: integer
          format: int64
          description: Size of the stored content in bytes.
        content_type:
          type: string
          description: |
            The content type recorded for the blob. Falls back to
            `application/octet-stream` when the client omits it, subject to
            the allow-list and magic-byte check.

    SelfRegisterRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          description: Display name for the participant record.

    SelfRegisterResponse:
      type: object
      required: [id, display_name, has_account]
      properties:
        id:
          type: string
          format: uuid
          description: The participant record id.
        display_name:
          type: string
        has_account:
          type: boolean
          description: Whether the participant is already linked to an account.

    ParticipationCreateRequest:
      type: object
      required: [participant_id, type, activity_id, activity_label, minutes]
      properties:
        participant_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [physical, online, manual]
          description: How the attendance was recorded.
        activity_id:
          type: string
          description: Identifier of the activity (session or course unit).
        activity_label:
          type: string
          description: Human-readable activity label.
        minutes:
          type: integer
          description: Declared minutes; the server maximes this on the session duration.

    ParticipationResponse:
      type: object
      required: [id, participant_id, type, activity_id, activity_label, minutes, confirmed, created_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [physical, online, manual]
        activity_id:
          type: string
        activity_label:
          type: string
        minutes:
          type: integer
        confirmed:
          type: boolean
          description: Whether a beheerder has confirmed the counted time.
        confirmed_by:
          type: string
          format: uuid
          description: Account id of the confirmer. Present only when confirmed.
        confirmed_at:
          type: string
          format: date-time
          description: Present only when confirmed.
        confirmation_reason:
          type: string
          description: Optional reason recorded at confirmation. Present only when set.
        created_at:
          type: string
          format: date-time

    EvidenceSlotRequest:
      type: object
      required: [filename, declared_type, declared_size, declared_hash]
      properties:
        participant_id:
          type: string
          format: uuid
          description: Optional; the participant the evidence belongs to.
        filename:
          type: string
          description: |
            Client-provided filename. Metadata only — never used as a storage
            path; displayed safely.
        declared_type:
          type: string
          description: Claimed MIME type of the file.
        declared_size:
          type: integer
          format: int64
          description: Claimed size in bytes.
        declared_hash:
          type: string
          description: Claimed content hash (for integrity verification).

    EvidenceResponse:
      type: object
      required: [id, filename, declared_type, declared_size, declared_hash, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
          description: Present when the evidence is linked to a participant.
        filename:
          type: string
        declared_type:
          type: string
        declared_size:
          type: integer
          format: int64
        declared_hash:
          type: string
        blob_hash:
          type: string
          description: Present after the upload is completed.
        blob_size:
          type: integer
          format: int64
          description: Present after the upload is completed.
        status:
          type: string
          enum: [pending, uploaded, clean, rejected, failed]
          description: |
            Quarantine lifecycle. `clean` means the server verified the file
            and it may be shown; `rejected` and dead-letter `failed` carry a
            `rejection_reason`.
        rejection_reason:
          type: string
          description: Present when status is `rejected` or `failed`.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: Present only when the upload step is completed.
        verified_at:
          type: string
          format: date-time
          description: Present only after the verification/scan ran.

    PrivacyRequestResponse:
      type: object
      required: [id, organization_id, participant_id, request_type, status, requested_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        request_type:
          type: string
          enum: [export, delete, anonymize]
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
          description: Async lifecycle; poll to follow progress.
        result:
          type: object
          additionalProperties: true
          description: |
            Request-type-specific result payload. Present only when the
            request completed; for an export this references the produced
            artifact.
        error:
          type: string
          description: Present only when status is `failed`.
        requested_by:
          type: string
          format: uuid
          description: Account id of the requester.
        completed_at:
          type: string
          format: date-time
          description: Present only when the request reached a terminal state.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PrivacyRequestSummary:
      type: object
      required: [id, participant_id, participant_display_name, request_type, status, requested_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        participant_id: { type: string, format: uuid }
        participant_display_name: { type: string }
        request_type: { type: string, enum: [export, delete, anonymize] }
        status: { type: string, enum: [pending, in_progress, completed, failed] }
        requested_by: { type: string, format: uuid }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PrivacyRequestSummaryList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/PrivacyRequestSummary' }
        next_cursor: { type: string }

    PEAwardCreateRequest:
      type: object
      required: [participant_id, participation_id, rule_version_id]
      properties:
        participant_id:
          type: string
          format: uuid
        participation_id:
          type: string
          format: uuid
          description: Must be a confirmed participation.
        rule_version_id:
          type: string
          format: uuid
          description: The published PE rule version to apply.

    PEAwardResponse:
      type: object
      required: [id, participant_id, participation_id, rule_version_id, points, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        participation_id:
          type: string
          format: uuid
        rule_version_id:
          type: string
          format: uuid
          description: The rule version used to compute the points.
        points:
          type: number
          format: double
          description: Points computed server-side from the participation and rule.
        status:
          type: string
          enum: [active, corrected, revoked]
        created_at:
          type: string
          format: date-time

    QualificationCreateRequest:
      type: object
      required: [participant_id, skill_version_id]
      properties:
        participant_id:
          type: string
          format: uuid
        skill_version_id:
          type: string
          format: uuid
          description: Must reference a published skill version.
        expires_at:
          type: string
          format: date-time
          description: Optional expiry timestamp.

    QualificationReviewRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
          description: true to approve, false to reject.
        reason:
          type: string
          description: Optional review reason; audited when present.
        evidence_hashes:
          type: array
          items:
            type: string
          description: Optional evidence blob hashes substantiating the decision.

    QualificationResponse:
      type: object
      required: [id, participant_id, skill_version_id, status, issued_by, issued_at, snapshot, created_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        skill_version_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected, revoked, expired]
        issued_by:
          type: string
          format: uuid
          description: Account id of the issuer.
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present only when an expiry was set.
        snapshot:
          type: object
          additionalProperties: true
          description: |
            Immutable snapshot of the skill version at issue time, so a later
            change to the skill definition does not rewrite history.
        created_at:
          type: string
          format: date-time

    PERuleCreateRequest:
      type: object
      required: [slug, category]
      properties:
        slug:
          type: string
        category:
          type: string

    PERuleResponse:
      type: object
      required: [id, slug, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PERuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PERuleResponse'

    PERuleDraftResponse:
      type: object
      required: [definition, etag, updated_at]
      properties:
        definition:
          type: object
          additionalProperties: true
        etag:
          type: string
        updated_at:
          type: string
          format: date-time

    PERuleVersionResponse:
      type: object
      required: [id, version, definition, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        definition:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PERuleVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PERuleVersionResponse'

    CertificateCreateRequest:
      type: object
      required: [participant_id, title]
      properties:
        participant_id:
          type: string
          format: uuid
        qualification_id:
          type: string
          format: uuid
        pe_award_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string

    CertificateResponse:
      type: object
      required: [id, participant_id, title, certificate_number, status, issued_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        certificate_number:
          type: string
        status:
          type: string
          enum: [issued, revoked]
        issued_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revocation_reason:
          type: string
        created_at:
          type: string
          format: date-time

    CertificateVerifyResponse:
      type: object
      required: [title, status, issued_at]
      properties:
        title:
          type: string
        status:
          type: string
          enum: [issued, revoked]
        issued_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        revocation_reason:
          type: string

    CertificateVerifyRequest:
      type: object
      required: [certificate_number, verification_secret]
      properties:
        certificate_number:
          type: string
        verification_secret:
          type: string
          minLength: 64
          maxLength: 64

    SkillCreateRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
        title:
          type: string

    SkillResponse:
      type: object
      required: [id, slug, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SkillList:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillResponse'

    SkillDraftResponse:
      type: object
      required: [definition, etag, updated_at]
      properties:
        definition:
          $ref: '#/components/schemas/SkillDefinition'
        etag:
          type: string
        updated_at:
          type: string
          format: date-time

    SkillVersionResponse:
      type: object
      required: [id, version, definition, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        definition:
          $ref: '#/components/schemas/SkillDefinition'

    SkillDefinition:
      type: object
      properties:
        description: { type: string }
        badge_class_url:
          type: string
          format: uri
          description: Optional public Open Badges BadgeClass URL associated with this skill.
        validity_months: { type: integer, minimum: 0, maximum: 1200 }
        requirements:
          type: array
          items:
            type: object
            required: [course_id, title]
            properties:
              course_id: { type: string, format: uuid }
              title: { type: string }
        renewal:
          type: object
          required: [activity_type, minimum_minutes, period_months]
          properties:
            activity_type: { type: string }
            minimum_minutes: { type: integer, minimum: 1 }
            period_months: { type: integer, minimum: 1 }
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    SkillVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SkillVersionResponse'

    BlueprintCreateRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
        title:
          type: string

    BlueprintResponse:
      type: object
      required: [id, slug, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlueprintCriteria:
      type: object
      additionalProperties: false
      properties:
        item_count:
          type: integer
          minimum: 1
          default: 10
        interaction_types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [multipleChoice, trueFalse, multipleCorrect, ordering, imagePair, openText]
        item_ids:
          type: array
          description: Optional explicit pool of published items from which this blueprint may select.
          uniqueItems: true
          items: { type: string, format: uuid }
        exclusions:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        time_limit_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: Optional duration; the server computes an immutable deadline when the attempt starts.

    BlueprintDraftResponse:
      type: object
      required: [blueprint_id, criteria, revision, etag, updated_at]
      properties:
        blueprint_id:
          type: string
          format: uuid
        criteria:
          $ref: '#/components/schemas/BlueprintCriteria'
        revision:
          type: integer
        etag:
          type: string
        updated_at:
          type: string
          format: date-time

    BlueprintDraftPreview:
      type: object
      required: [requested_item_count, matching_item_count, sufficient]
      properties:
        requested_item_count: { type: integer, minimum: 1 }
        matching_item_count: { type: integer, minimum: 0 }
        sufficient: { type: boolean }

    BlueprintVersionResponse:
      type: object
      required: [id, blueprint_id, version, criteria, published_at]
      properties:
        id:
          type: string
          format: uuid
        blueprint_id:
          type: string
          format: uuid
        version:
          type: integer
        criteria:
          $ref: '#/components/schemas/BlueprintCriteria'
        published_at:
          type: string
          format: date-time

    BlueprintList:
      type: object
      required: [blueprints]
      properties:
        blueprints:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintResponse'

    CourseCreateRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          maxLength: 128
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 500
        image_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Optional hash of a PNG, JPEG, or WebP uploaded by this organization.

    CourseItem:
      type: object
      required: [id, slug, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        theme_id:
          type: string
          format: uuid
          nullable: true
          description: The theme profile applied to this course, if any.
        image_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: Hash of the organization-owned course image, if present.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourseList:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseItem'
        next_cursor:
          type: string
          description: Present when more results are available.

    CourseDraftResponse:
      type: object
      required: [course_id, schema_version, lessons, revision, etag, updated_at]
      properties:
        course_id:
          type: string
          format: uuid
        schema_version:
          type: integer
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CourseLesson'
        revision:
          type: integer
        etag:
          type: string
        theme_id:
          type: string
          format: uuid
          nullable: true
          description: The theme profile linked to this course, if any.
        updated_at:
          type: string
          format: date-time

    CourseDraftPutRequest:
      type: object
      required: [schema_version, lessons]
      properties:
        schema_version:
          type: integer
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CourseLesson'
        theme_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional. When present, links the course to this theme profile.
            An empty string clears the theme. Omit to leave the theme unchanged.

    CourseLesson:
      type: object
      required: [id, title, content, order]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
          description: |
            Markdown presentation source for the lesson. Slides carrying
            OciDeck's standalone `<!-- skip -->` directive remain part of the
            authored source but are not shown to the learner: the remaining
            slides, in presentation order, form the lesson and its valid
            progress positions.
        order:
          type: integer
        asset_hashes:
          type: array
          items:
            type: string
          description: SHA-256 hashes of assets referenced in the lesson content.
        deck:
          $ref: '#/components/schemas/CourseLessonDeck'
        delivery_mode:
          type: string
          enum: [self_study, classroom]
          description: Omitted values are treated as self_study for legacy lessons.
        attendance_requirement:
          $ref: '#/components/schemas/AttendanceRequirement'

    AttendanceRequirement:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, full, percentage]
        percentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Only valid when mode is percentage.

    CourseLessonDeck:
      type: object
      required: [asset_hash, filename, slide_count, from_slide, through_slide]
      properties:
        asset_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        filename:
          type: string
          maxLength: 128
          description: Display-only name of the original .ocideck package.
        slide_count:
          type: integer
          minimum: 1
        from_slide:
          type: integer
          minimum: 1
          description: First slide in the lesson, inclusive and one-based.
        through_slide:
          type: integer
          minimum: 1
          description: Last slide in the lesson, inclusive and one-based.

    CourseVersionResponse:
      type: object
      required: [id, course_id, version, manifest, published_at]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        version:
          type: integer
        manifest:
          $ref: '#/components/schemas/CourseDraftContent'
        theme_id:
          type: string
          format: uuid
          nullable: true
          description: The theme profile copied at publication time, if any.
        published_at:
          type: string
          format: date-time

    CourseDraftContent:
      type: object
      required: [schema_version, lessons]
      properties:
        schema_version:
          type: integer
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CourseLesson'

    ThemeItem:
      type: object
      required: [id, name, definition, is_builtin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        definition:
          type: object
          additionalProperties: true
          description: |
            Opaque ThemeProfile JSON owned by OciDeck/Keiko. OciServe stores
            and serves this unchanged; only JSON-object validity is checked.
        is_builtin:
          type: boolean
          description: True for the four seeded built-in profiles (read-only).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ThemeList:
      type: object
      required: [themes]
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeItem'
        next_cursor:
          type: string
          description: Present when more results are available.

    ThemeCreateRequest:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
        definition:
          type: object
          additionalProperties: true
          description: Opaque ThemeProfile JSON (see ThemeItem.definition).

    ThemeUpdateRequest:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
        definition:
          type: object
          additionalProperties: true
          description: Opaque ThemeProfile JSON (see ThemeItem.definition).

    ItemCreateRequest:
      type: object
      required: [slug, title, interaction_type]
      properties:
        slug:
          type: string
        title:
          type: string
        interaction_type:
          type: string
          enum: [multipleChoice, trueFalse, multipleCorrect, ordering, imagePair, openText]

    ItemResponse:
      type: object
      required: [id, slug, title, interaction_type, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        interaction_type:
          type: string
          enum: [multipleChoice, trueFalse, multipleCorrect, ordering, imagePair, openText]
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'

    ItemDraftResponse:
      type: object
      required: [item_id, content, answer_model, revision, etag, updated_at]
      properties:
        item_id:
          type: string
          format: uuid
        content:
          type: object
          additionalProperties: true
          description: Interaction-specific item content.
        answer_model:
          type: object
          additionalProperties: true
          description: The scoring/answer key for this interaction type.
        revision:
          type: integer
        etag:
          type: string
        updated_at:
          type: string
          format: date-time

    ItemDraftPutRequest:
      type: object
      required: [content, answer_model]
      properties:
        content:
          type: object
          additionalProperties: true
        answer_model:
          type: object
          additionalProperties: true

    ItemVersionResponse:
      type: object
      required: [id, item_id, version, content, published_at]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        version:
          type: integer
        content:
          type: object
          additionalProperties: true
          description: Immutable snapshot of the item content at publish time.
        published_at:
          type: string
          format: date-time

    ParticipantItem:
      type: object
      required: [id, display_name, has_account, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        has_account:
          type: boolean
        created_at:
          type: string
          format: date-time

    ParticipantsList:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantItem'
        next_cursor:
          type: string

    LearningSummary:
      type: object
      required: [available_courses, enrollments, started, completed, average_progress_percent, confirmed_minutes, displayed_minutes, attempts]
      properties:
        available_courses:
          type: integer
        enrollments:
          type: integer
        started:
          type: integer
        completed:
          type: integer
        average_progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        confirmed_minutes:
          type: integer
        displayed_minutes:
          type: integer
          minimum: 0
          description: Client-reported playback time, rounded to minutes.
        attempts:
          type: integer
          minimum: 0

    CourseLearningStatistics:
      type: object
      required: [course_id, title, enrollments, started, completed, average_progress_percent]
      properties:
        course_id:
          type: string
          format: uuid
        title:
          type: string
        enrollments:
          type: integer
        started:
          type: integer
        completed:
          type: integer
        average_progress_percent:
          type: integer
          minimum: 0
          maximum: 100

    CourseLearnerStatistics:
      type: object
      required: [participant_id, display_name, progress_percent, displayed_minutes]
      properties:
        participant_id:
          type: string
          format: uuid
        display_name:
          type: string
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        displayed_minutes:
          type: integer
          minimum: 0
        last_activity_at:
          type: string
          format: date-time

    CourseLearnerStatisticsList:
      type: object
      required: [course_id, learners]
      properties:
        course_id:
          type: string
          format: uuid
        learners:
          type: array
          items:
            $ref: '#/components/schemas/CourseLearnerStatistics'

    LearningTrendPoint:
      type: object
      required: [month, enrollments, started, completed, confirmed_minutes, displayed_minutes, attempts]
      properties:
        month:
          type: string
          pattern: '^\\d{4}-\\d{2}$'
        enrollments:
          type: integer
        started:
          type: integer
        completed:
          type: integer
        confirmed_minutes:
          type: integer
        displayed_minutes:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0

    OrganizationLearningStatistics:
      type: object
      required: [summary, courses, timeline]
      properties:
        summary:
          $ref: '#/components/schemas/LearningSummary'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseLearningStatistics'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/LearningTrendPoint'

    ParticipantCourseStatistics:
      type: object
      required: [course_id, course_version_id, title, enrolled_at, completed_lessons, total_lessons, progress_percent, started, completed]
      properties:
        course_id:
          type: string
          format: uuid
        course_version_id:
          type: string
          format: uuid
        title:
          type: string
        enrolled_at:
          type: string
          format: date-time
        completed_lessons:
          type: integer
        total_lessons:
          type: integer
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        started:
          type: boolean
        completed:
          type: boolean
        last_activity_at:
          type: string
          format: date-time

    ParticipantLearningStatistics:
      type: object
      required: [summary, courses, attempt_counts]
      properties:
        summary:
          $ref: '#/components/schemas/LearningSummary'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantCourseStatistics'
        attempt_counts:
          type: object
          additionalProperties:
            type: integer

    EnrollRequest:
      type: object
      required: [course_version_id]
      properties:
        course_version_id:
          type: string
          format: uuid
        version_policy:
          type: string
          enum: [pinned, follow_latest, manual_upgrade]
          description: |
            Cursusversie-upgradebeleid (ARCHITECTURE.md §5.3):
            - `pinned`: de deelnemer blijft op de toegewezen versie;
            - `follow_latest`: de nieuwste gepubliceerde opvolger wordt bij het
              laden van de leerfeed actief als er geen toets loopt; alleen
              voortgang voor stabiele les-ID's in het doel wordt meegenomen;
            - `manual_upgrade`: een bevoegde medewerker kiest de opvolger.

    EnrollmentResponse:
      type: object
      required: [id, participant_id, course_version_id, version_policy, enrolled_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        course_version_id:
          type: string
          format: uuid
        course_title:
          type: string
          description: Human-readable course title, included when listing enrollments.
        version_policy:
          type: string
          enum: [pinned, follow_latest, manual_upgrade]
        enrolled_at:
          type: string
          format: date-time

    EnrollmentUpgradeRequest:
      type: object
      required: [target_version_id]
      properties:
        target_version_id:
          type: string
          format: uuid
          description: The course version to upgrade to (must belong to the same course).

    EnrollmentList:
      type: object
      required: [enrollments]
      properties:
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentResponse'

    LearningFeed:
      type: array
      items:
        $ref: '#/components/schemas/FeedItemResponse'

    FeedItemResponse:
      type: object
      required: [id, participant_id, course_version_id, enrolled_at, course_id, course_slug, course_title, version, manifest]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        course_version_id:
          type: string
          format: uuid
        enrolled_at:
          type: string
          format: date-time
        course_id:
          type: string
          format: uuid
        course_slug:
          type: string
        course_title:
          type: string
        version:
          type: integer
        manifest:
          type: object
          additionalProperties: true

    MarkCompleteRequest:
      type: object
      required: [lesson_id]
      properties:
        lesson_id:
          type: string

    ProgressResponse:
      type: object
      required: [lesson_id, completed_at]
      properties:
        lesson_id:
          type: string
        completed_at:
          type: string
          format: date-time

    ProgressList:
      type: array
      items:
        $ref: '#/components/schemas/ProgressResponse'

    AttemptStartRequest:
      type: object
      required: [blueprint_version_id]
      properties:
        blueprint_version_id:
          type: string
          format: uuid

    AttemptResponse:
      type: object
      required: [id, participant_id, blueprint_version_id, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        blueprint_version_id:
          type: string
          format: uuid
        status:
          type: string
          description: Attempt lifecycle state.
        started_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
          description: Server-computed cutoff when the published blueprint has a time limit.
        submitted_at:
          type: string
          format: date-time
        scored_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time

    AttemptList:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AttemptResponse'

    AttemptItemResponse:
      type: object
      required: [id, item_version_id, position, content]
      properties:
        id:
          type: string
          format: uuid
        item_version_id:
          type: string
          format: uuid
        position:
          type: integer
        content:
          type: object
          additionalProperties: true
        option_order:
          type: array
          items:
            type: string
          description: Shuffled option order for this attempt item.
        randomization_context:
          type: object
          additionalProperties: true

    AttemptDetailResponse:
      type: object
      required: [id, participant_id, blueprint_version_id, status, started_at, items]
      properties:
        id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        blueprint_version_id:
          type: string
          format: uuid
        status:
          type: string
        started_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
          description: Server-computed cutoff when the published blueprint has a time limit.
        submitted_at:
          type: string
          format: date-time
        scored_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttemptItemResponse'

    AnswerPutRequest:
      type: object
      required: [answer_data]
      properties:
        answer_data:
          type: object
          additionalProperties: true

    AnswerResponse:
      type: object
      required: [id, attempt_item_id, answer_data, revision, created_at]
      properties:
        id:
          type: string
          format: uuid
        attempt_item_id:
          type: string
          format: uuid
        answer_data:
          type: object
          additionalProperties: true
        revision:
          type: integer
        created_at:
          type: string
          format: date-time

    AnswerList:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerResponse'

    AttemptScoreResponse:
      type: object
      required: [total_items, correct_items, manual_review_items]
      properties:
        total_items:
          type: integer
        correct_items:
          type: integer
        manual_review_items:
          type: array
          description: Opaque attempt item IDs that still require a human decision.
          items:
            type: string
            format: uuid

    AttemptManualScoreRequest:
      type: object
      required: [items, reason]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [attempt_item_id, correct]
            properties:
              attempt_item_id:
                type: string
                format: uuid
              correct:
                type: boolean
        reason:
          type: string
          minLength: 1

    EvidenceList:
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceResponse'

    QualificationList:
      type: object
      required: [qualifications]
      properties:
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/QualificationResponse'

    ParticipationList:
      type: object
      required: [participations]
      properties:
        participations:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationResponse'

    PEAwardList:
      type: object
      required: [awards]
      properties:
        awards:
          type: array
          items:
            $ref: '#/components/schemas/PEAwardResponse'

    CertificateList:
      type: object
      required: [certificates]
      properties:
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateResponse'

    PrivacyRequestList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/PrivacyRequestResponse'

    WebSession:
      type: object
      required: [id, provider, current, created_at, last_active_at, idle_expires_at, absolute_expires_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [ociserve_web] }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }

    WebSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/WebSession' }

    WebAuthLoginResponse:
      type: object
      required: [subject, csrf_token]
      properties:
        subject:
          type: string
          description: OIDC subject identifier from the verified ID token.
        issuer:
          type: string
          description: OIDC issuer URL.
        csrf_token:
          type: string
          description: |
            CSRF token for mutation requests. The web client must include this
            in the `X-CSRF-Token` header on POST/PUT/PATCH/DELETE. The session
            cookie is HttpOnly so the client cannot read it.

    WebAuthMeResponse:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          description: OIDC subject identifier.
        issuer:
          type: string
          description: OIDC issuer URL.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Human-readable status text.
          examples: [live, ready, started, shutting down, not ready, starting]
        build_version:
          type: string
          description: Build version from buildinfo.
          examples: [dev, v0.1.0]

    MembershipPatch:
      type: object
      description: |
        JSON Merge Patch (RFC 7396) for a membership. Only `role` is
        mutable. Omitting `role` is a 400.
      properties:
        role:
          type: string
          enum: [owner, organization_admin, instructor, author, assessor, participant]
          description: The new role.

    MembershipDetail:
      type: object
      required:
        - id
        - account_id
        - participant_id
        - display_name
        - role
        - status
        - created_at
        - course_count
        - effective_capabilities
        - assignable_roles
        - available_actions
        - catalog_version
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        participant_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Privacy-bounded; only display_name is exposed from the account.
        role:
          type: string
          enum: [owner, organization_admin, instructor, author, assessor, participant]
        status:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time
        course_count:
          type: integer
          minimum: 0
          description: Number of distinct courses assigned to this member.
        effective_capabilities:
          type: array
          items: { type: string }
        assignable_roles:
          type: array
          items: { type: string }
          description: Roles the actor is permitted to assign.
        available_actions:
          type: array
          items: { type: string }
        catalog_version:
          type: integer

    AccessPolicy:
      type: object
      required: [required_acr, required_amr, max_auth_age, strict_mode]
      properties:
        required_acr:
          type: string
          description: Required ACR value (empty when none required).
        required_amr:
          type: array
          items: { type: string }
          description: Required AMR values.
        max_auth_age:
          type: integer
          description: Maximum authentication age in seconds (0 = no limit).
        strict_mode:
          type: boolean
          description: When true, tokens not meeting the policy are rejected even if otherwise valid.

    IdentityOperation:
      type: object
      required: [id, op_type, status, attempt, max_attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque UUIDv7 operation identifier.
        op_type:
          type: string
          enum: [revoke_sessions, start_recovery]
        status:
          type: string
          enum: [pending, running, succeeded, failed_retryable, failed_final]
        attempt:
          type: integer
        max_attempts:
          type: integer
        last_error:
          type: string
          description: Omitted when empty.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccessAuditEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AccessAuditEvent'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; omitted when exhausted.

    AccessAuditEvent:
      type: object
      required:
        - id
        - actor_account_id
        - target_account_id
        - action
        - result
        - request_id
        - policy_version
        - step_up_level
        - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_account_id:
          type: string
          format: uuid
          description: Opaque account reference; no email or subject.
        target_account_id:
          type: string
          format: uuid
          description: Opaque account reference; no email or subject.
        actor_display_name:
          type: string
          description: Current display name of the actor, omitted if unavailable.
        target_display_name:
          type: string
          description: Current display name of the target, omitted if unavailable.
        action:
          type: string
        result:
          type: string
        request_id:
          type: string
        policy_version:
          type: integer
        identity_op_id:
          type: string
          description: Omitted when the event did not trigger an identity operation.
        step_up_level:
          type: string
        provider_result:
          type: string
          description: Omitted when empty.
        detail:
          type: string
          maxLength: 500
          description: Optional privacy-bounded explanation for the change.
        created_at:
          type: string
          format: date-time

    SystemErrorList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SystemError'

    SystemError:
      type: object
      required: [id, component, summary, created_at]
      properties:
        id:
          type: integer
          format: int64
        component:
          type: string
          maxLength: 64
        summary:
          type: string
          maxLength: 200
        request_id:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time

    InstallationStatus:
      type: object
      required: [status, oidc_issuer]
      properties:
        status:
          type: string
          enum: [setup_required, ready]
          description: |
            "setup_required" — no organization has been claimed yet.
            "ready" — the installation is claimed and the API is operational.
        oidc_issuer:
          type: string
          description: |
            The OIDC issuer URL that Keiko must use for authentication.
            Published publicly so a new installation can discover the auth
            boundary before login.
          examples: [https://oidc.example.nl]
        native_client_id:
          type: string
          description: |
            The OAuth 2.0 client_id for the native Keiko client. Optional:
            omitted when not configured.
          examples: [keiko-native]
        ocideck_native_client_id:
          type: string
          description: The independently configured OAuth 2.0 client_id for native OciDeck.
          examples: [ocideck-native]

    SelfLearningFeed:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items: { $ref: '#/components/schemas/SelfLearningCourse' }

    SelfLearningCourse:
      type: object
      required: [course_version_id, course_id, course_slug, course_title, version, enrolled_at, lessons]
      properties:
        course_version_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        course_slug: { type: string }
        course_title: { type: string }
        image_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The offering image when present, otherwise the course image.
        version: { type: integer, minimum: 1 }
        enrolled_at: { type: string, format: date-time }
        lessons:
          type: array
          items: { $ref: '#/components/schemas/SelfLearningLesson' }

    SelfLearningLesson:
      type: object
      required: [id, title, order]
      properties:
        id: { type: string }
        title: { type: string }
        order: { type: integer }

    PlaybackSlideDuration:
      type: object
      additionalProperties: false
      required: [anchor, displayed_milliseconds]
      properties:
        anchor: { type: string, pattern: '^[a-z0-9-]+$' }
        displayed_milliseconds: { type: integer, format: int64, minimum: 0, maximum: 43200000 }

    PlaybackSessionSnapshot:
      type: object
      additionalProperties: false
      required: [client_session_id, course_version_id, lesson_id, started_at, completed, slides]
      properties:
        client_session_id: { type: string, format: uuid }
        course_version_id: { type: string, format: uuid }
        lesson_id: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, description: Required when completed is true. }
        last_slide_anchor: { type: string, pattern: '^[a-z0-9-]+$' }
        completed: { type: boolean }
        slides:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/PlaybackSlideDuration' }

    LearningState:
      type: object
      required: [lessons]
      properties:
        lessons:
          type: array
          items: { $ref: '#/components/schemas/LessonLearningState' }

    LessonLearningState:
      type: object
      required: [course_version_id, lesson_id, completed, displayed_milliseconds, last_played_at]
      properties:
        course_version_id: { type: string, format: uuid }
        lesson_id: { type: string }
        completed: { type: boolean }
        last_slide_anchor: { type: string }
        displayed_milliseconds: { type: integer, format: int64, minimum: 0 }
        last_played_at: { type: string, format: date-time }

    ClaimRequest:
      type: object
      required: [setup_code, organization, owner]
      properties:
        setup_code:
          type: string
          description: The one-time setup code issued by `ociserve init`.
          maxLength: 100
        organization:
          type: object
          required: [slug, display_name]
          properties:
            slug:
              type: string
              maxLength: 64
              description: URL-safe organization slug.
            display_name:
              type: string
              maxLength: 200
              description: Human-readable organization name.
        owner:
          type: object
          required: [display_name, email, password]
          properties:
            display_name:
              type: string
              maxLength: 200
              description: Display name of the permanent first owner.
            email:
              type: string
              format: email
              description: Sign-in address of the permanent first owner.
            password:
              type: string
              format: password
              minLength: 12
              maxLength: 1024
              writeOnly: true
              description: Initial password; never returned or logged.

    ClaimResponse:
      type: object
      required: [organization_id, organization_slug, organization_name, account_id]
      properties:
        organization_id:
          type: string
          format: uuid
        organization_slug:
          type: string
        organization_name:
          type: string
        account_id:
          type: string
          format: uuid

    MeResponse:
      type: object
      required:
        - memberships
        - capabilities
        - platform_capabilities
        - required_actions
        - provider_features
        - catalog_version
      properties:
        account:
          type: object
          nullable: true
          description: |
            Local account identity. Null when no local account exists yet
            (registration view — the user has a valid token but has not
            been claimed into any organization).
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
            email:
              type: string
              format: email
              description: Visible only to the authenticated account itself.
            avatar_hash:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Omitted when the account has no photo.
        memberships:
          type: array
          description: |
            All memberships for this account across all organizations.
            Empty when no local account exists. Each membership carries its
            id, status, role and the effective capabilities that membership
            grants. Only active memberships contribute capabilities.
          items:
            type: object
            required:
              - id
              - organization_id
              - organization_slug
              - organization_name
              - role
              - status
              - effective_capabilities
            properties:
              id:
                type: string
                format: uuid
                description: Local membership identifier (opaque).
              organization_id:
                type: string
                format: uuid
              organization_slug:
                type: string
              organization_name:
                type: string
              role:
                type: string
                enum: [owner, organization_admin, instructor, author, assessor, participant]
                description: |
                  Canonical Keiko-IAM role. The legacy `admin` name was
                  renamed to `organization_admin` (migration 0013) with no
                  silent alias.
              status:
                type: string
                enum: [active, suspended, revoked]
                description: |
                  Membership lifecycle state. `active` is the only state
                  populated today; suspend/reactivate/revoke transitions are
                  Issue #69.
              effective_capabilities:
                type: array
                description: |
                  Capabilities this membership grants, derived from the role
                  via the capability catalog. Empty when the membership is
                  not active.
                items:
                  type: string
                examples: [[org:admin, member:invite, content:view]]
        capabilities:
          type: array
          description: |
            The deduplicated union of tenant capabilities across all active
            memberships. Empty when no active memberships exist. These are
            tenant-scoped (organization-bound) capabilities; platform-wide
            capabilities are published separately in `platform_capabilities`.
          items:
            type: string
          examples: [[org:admin, content:create, content:view]]
        platform_capabilities:
          type: array
          description: |
            Platform-wide capabilities, kept separate from tenant
            capabilities so a tenant role can never implicitly grant
            platform power. Empty today; a future platform-admin concept
            (#68) populates it.
          items:
            type: string
          examples: [[]]
        required_actions:
          type: array
          description: |
            Tasks the caller must complete, derived from local account
            state. `complete_profile` is signalled when the account has no
            display name. Empty when the account is complete or absent.
          items:
            type: string
            enum: [complete_profile]
          examples: [[complete_profile]]
        provider_features:
          $ref: '#/components/schemas/ProviderFeatures'
        catalog_version:
          type: integer
          description: |
            The capability catalog version. Keiko can pin to a version and
            detect drift against an OciServe that speaks a different one.
            Bumped whenever the capability set or role→capability mapping
            changes.
          examples: [1]

    ProviderFeatures:
      type: object
      description: |
        What the identity provider supports, in product language and without
        provider identifiers, secrets or Keycloak-specific terms. Keiko uses
        this to show or hide self-service actions. Features that need the
        Keycloak adapter (#70) or session/recovery operations (#72) are
        reported as unavailable until those land, so Keiko never offers an
        action the server cannot honour.
      required:
        - mfa_enrollable
        - passwordless_enrollable
        - session_revocation
        - recovery
      properties:
        mfa_enrollable:
          type: boolean
          description: |
            True when the provider supports enrolling a second factor.
            Derived from the configured required AMR.
        passwordless_enrollable:
          type: boolean
          description: Passkey-only login. Requires the provider adapter (#70).
        session_revocation:
          type: boolean
          description: Server-side session revocation. Requires #72.
        recovery:
          type: boolean
          description: Provider-led account recovery. Requires #72.

    MembershipCreateRequest:
      type: object
      required: [display_name, email, password, role]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        role:
          type: string
          enum: [owner, organization_admin, instructor, author, assessor, participant]

    MembershipItem:
      type: object
      description: |
        A single membership in the members read model. Only `display_name`
        and the optional content-addressed `avatar_hash` are exposed from the
        account — never email, OIDC subject, issuer or credentials.
        `effective_capabilities` are derived from the member's
        role via the capability catalog; only active memberships contribute.
      required:
        - id
        - account_id
        - display_name
        - role
        - status
        - created_at
        - effective_capabilities
      properties:
        id:
          type: string
          format: uuid
          description: Opaque membership identifier.
        account_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: The member's display name.
        avatar_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Omitted when the member has no photo.
        email:
          type: string
          format: email
          description: Present only in member detail for an organization administrator.
        role:
          type: string
          enum: [owner, organization_admin, instructor, author, assessor, participant]
        status:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time
        effective_capabilities:
          type: array
          items:
            type: string
          description: Capabilities this membership grants, from the catalog.
          examples: [[org:admin, member:invite, content:view]]

    MembershipsListResponse:
      type: object
      required:
        - memberships
        - assignable_roles
        - available_actions
        - catalog_version
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipItem'
        next_cursor:
          type: string
          description: |
            Opaque cursor for the next page. Empty when there is no next page.
        assignable_roles:
          type: array
          items:
            type: string
            enum: [owner, organization_admin, instructor, author, assessor, participant]
          description: |
            Roles the actor may assign, derived from the actor's role by the
            server. Empty when the actor lacks `role:assign`.
        available_actions:
          type: array
          items:
            type: string
            enum: [role:assign, member:remove]
          description: |
            Action keys the actor may perform on a membership, derived from
            the actor's capabilities. Sorted for deterministic output.
        catalog_version:
          type: integer
          description: The capability catalog version.

    MembershipDetailResponse:
      type: object
      description: A single membership with actor-derived metadata.
      required:
        - id
        - account_id
        - display_name
        - role
        - status
        - created_at
        - effective_capabilities
        - assignable_roles
        - available_actions
        - catalog_version
        - history
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        role:
          type: string
          enum: [owner, organization_admin, instructor, author, assessor, participant]
        status:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time
        effective_capabilities:
          type: array
          items:
            type: string
        assignable_roles:
          type: array
          items:
            type: string
            enum: [owner, organization_admin, instructor, author, assessor, participant]
        available_actions:
          type: array
          items:
            type: string
            enum: [role:assign, member:remove]
        catalog_version:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/MembershipHistoryEvent'

    MembershipHistoryEvent:
      type: object
      required: [id, action, timestamp]
      properties:
        id:
          type: string
        action:
          type: string
        actor_id:
          type: string
          format: uuid
        actor_display_name:
          type: string
        timestamp:
          type: string
          format: date-time
        detail:
          type: string

    AvatarResponse:
      type: object
      required: [hash]
      properties:
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem type.
          examples:
            - https://pawprint.vigilis.online/errors/not-found
        title:
          type: string
          description: Short, human-readable summary.
          examples: [Not Found]
        status:
          type: integer
          description: HTTP status code.
          examples: [404]
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          maxLength: 500
        instance:
          type: string
          description: Request path.
        request_id:
          type: string
          description: Correlation id echoed from X-Request-Id.
          examples:
            - 01a02327-328a-715d-9fcf-9e57529fdddc
        errors:
          type: array
          description: Field-level validation errors (RFC 9457 §3.2.1).
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [name, reason]
      properties:
        name:
          type: string
          description: Parameter or field name.
        reason:
          type: string
          description: Why the value was rejected.

    InvitationCreate:
      type: object
      required: [invited_email, role]
      properties:
        invited_email:
          type: string
          format: email
          description: The email address to invite.
        role:
          type: string
          enum: [owner, organization_admin, instructor, author, assessor, participant]
          description: The role the invitee will receive upon acceptance.

    MemberProfileInput:
      type: object
      required: [display_name, email, remove_avatar]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        remove_avatar: { type: boolean }
        reason: { type: string, maxLength: 500 }

    OrganizationSetupStatus:
      type: object
      required: [complete, smtp_verified]
      properties:
        complete: { type: boolean }
        smtp_verified: { type: boolean }

    SMTPSettings:
      type: object
      required: [host, port, username, from_address, start_tls, has_password]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string, format: email }
        start_tls: { type: boolean }
        has_password: { type: boolean }

    SMTPSettingsInput:
      type: object
      required: [host, port, from_address, start_tls]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string, format: email }
        start_tls: { type: boolean }
        password: { type: string, writeOnly: true }

    Invitation:
      type: object
      required: [id, invited_email, role, status, expires_at, max_attempts, attempts, created_at, catalog_version]
      properties:
        id:
          type: string
          format: uuid
        invited_email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
          enum: [pending, accepted, expired, revoked, delivery_failed]
        expires_at:
          type: string
          format: date-time
        max_attempts:
          type: integer
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        catalog_version:
          type: integer

    InvitationWithSecret:
      type: object
      required: [id, invited_email, role, status, expires_at, max_attempts, attempts, created_at, catalog_version, secret]
      properties:
        id:
          type: string
          format: uuid
        invited_email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
        max_attempts:
          type: integer
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        catalog_version:
          type: integer
        secret:
          type: string
          description: One-time secret. Returned only on creation. Never again.

    InvitationList:
      type: object
      required: [invitations, catalog_version]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        catalog_version:
          type: integer

    InvitationAccept:
      type: object
      required: [invitation_id, secret]
      properties:
        invitation_id:
          type: string
          format: uuid
        secret:
          type: string
          description: The one-time secret from the invitation creation.
        display_name:
          type: string
          description: Display name for the new account if none exists yet.

    InvitationAcceptResult:
      type: object
      required: [organization_id, account_id, membership_id, role]
      properties:
        organization_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        role:
          type: string

    InvitationRegistrationPreviewRequest:
      type: object
      additionalProperties: false
      required: [invitation_id, secret]
      properties:
        invitation_id: { type: string, format: uuid }
        secret: { type: string }

    InvitationRegistrationPreview:
      type: object
      additionalProperties: false
      required: [invited_email]
      properties:
        invited_email: { type: string, format: email }

    InvitationRegistration:
      type: object
      additionalProperties: false
      required: [invitation_id, secret, display_name, password]
      properties:
        invitation_id: { type: string, format: uuid }
        secret: { type: string }
        display_name: { type: string, minLength: 1 }
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true

  responses:
    ProblemResponse:
      description: An error following RFC 9457 problem+json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC bearer token. The issuer and audience are configured at deploy
        time (OCISERVE_OIDC_ISSUER, OCISERVE_OIDC_AUDIENCE). Health endpoints
        do not require authentication.

security:
  - BearerAuth: []
