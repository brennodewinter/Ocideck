# Gitleaks-configuratie voor OciDeck.
#
# Zonder uitsluitingen levert een scan hier 74 bevindingen op waarvan er 74
# verwacht zijn. Een controle die altijd roept, wordt na twee keer genegeerd —
# dus staat hieronder wat er niét toe doet, en waarom.

[extend]
useDefault = true

[allowlist]
description = "Gegenereerde uitvoer en het detectiecorpus van OciWacht"

paths = [
  # ── Gits eigen boekhouding ─────────────────────────────────────────────────
  # Niet de historie: die wordt gedekt door de aparte `git`-pas van beide
  # scanners. Dit is `.git/` als bestandssysteem — de reflog, de index, de
  # packfiles. Daar staat geen repository-inhoud in die niet ook elders staat,
  # wél tweeduizend regels commit-SHA's, en een 40-teken hex-SHA leest als een
  # API-sleutel. De poort werd daarmee afhankelijk van machinelokale toestand.
  # Zie #522.
  '''^\.git/''',

  # ── Gegenereerde uitvoer ───────────────────────────────────────────────────
  # Deze mappen staan in .gitignore en bevatten kopieën van de testfixtures
  # hieronder. Ze zijn nooit gecommit; ze scannen kost een minuut en levert
  # niets op. (Een scan over de hele boom raakte hierdoor 1,48 GB aan.)
  '''^\.dart_tool/''',
  '''^build/''',

  # Lokale werkinstellingen, ook gitignored. Staan buiten de repo-inhoud.
  '''^\.claude/''',

  # Het lokale XMPP-testbed (docker-jitsi-meet) genereert zijn eigen wegwerp-
  # infrastructuur: zelfondertekende TLS-sleutels onder `.jitsi-config/` en een
  # docker-compose-`.env` met wachtwoorden. Beide staan in
  # testbed/docker-jitsi-meet/.gitignore en worden nooit gecommit — maar
  # `gitleaks dir .` scant het bestandssysteem en negeert die geneste .gitignore.
  # Wie het testbed opzette, zag daardoor élke `make check-secrets`/release rood
  # staan op een vals alarm. `secret_scan_testbed_allowlist_test` bewaakt dat dit
  # gelijk blijft met wat het testbed als gegenereerd bestempelt.
  '''^testbed/docker-jitsi-meet/\.jitsi-config/''',
  '''^testbed/docker-jitsi-meet/\.env$''',

  # ── Het detectiecorpus van OciWacht ────────────────────────────────────────
  # Dit is de kern van de afweging. De privacyscanner moet geheimen kúnnen
  # herkennen, en dat bewijs je alleen met strings die er echt uitzien. Deze
  # bestanden bestaan dus per definitie om geheim-vormige waarden te bevatten;
  # ze aanmerken als lek is dubbelop met hun bestaansreden.
  #
  # DE PRIJS, expliciet: een écht geheim dat per ongeluk in een van deze
  # bestanden belandt, wordt door gitleaks niet opgemerkt. Het valt daar ook
  # visueel niet op, want het staat tussen soortgenoten. Wie hier een fixture
  # toevoegt, draagt die verantwoordelijkheid zelf.
  #
  # Vingerafdrukken per bevinding zouden strenger zijn, maar die bevatten het
  # regelnummer: één regel erbij en de hele lijst staat scheef, waarna de poort
  # rood staat zonder reden. Dat is hoe een controle wordt uitgezet.
  '''^lib/services/privacy/privacy_digital_rules\.dart$''',
  '''^test/privacy_[a-z_]+_test\.dart$''',
  '''^test/native_git_mirror_test\.dart$''',

  # ── De age-testvectoren ────────────────────────────────────────────────────
  # Het gepubliceerde C2SP-corpus (CCTV) bevat per vector een `identity: AGE-SECRET-KEY-1…`
  # — de sleutel waarmee dat ene testbestand opent, publiek sinds het in CCTV staat, en
  # nergens anders mee te openen. Gitleaks heeft er een regel voor en vond er 98.
  # Alleen die map, en alleen de bestanden met een vectornaam (geen `.md`): wie hier een
  # eigen sleutel in zet, loopt gewoon tegen de poort aan. `form_seal_vectors_test`
  # rekent elk bestand na tegen `SHA256SUMS`, dus er komt hier ook niets ongemerkt bij.
  '''^packages/ocideck_form_core/test/fixtures/age_testkit/[a-z0-9_]+$''',

  # ── De testvectoren van het inzendprotocol ────────────────────────────────
  # `intake_protocol_vectors.json` (CC0, FORM_INTAKE.md D5) bestaat om voorbeeldwaarden te
  # dragen onder de namen die het protocol ze geeft: een uitnodigingstoken, het intrekgeheim
  # en hun hashes, een ondertekend verzoek. Gitleaks' `generic-api-key` leest `token` of
  # `secret` in een sleutelnaam plus een waarde met entropie als lek en vond er zes. Het zijn
  # verzonnen waarden bij een zaad dat in het bestand zelf staat; een sleutel die er per
  # ongeluk bij komt, valt hier niet op. Alleen dit ene bestand: de test
  # `intake_protocol_vector_test` leest het en rekent elke waarde na, en een Dart-bestand
  # (waar een echte waarde zou belanden) blijft gewoon gescand.
  '''^packages/ocideck_form_core/test/fixtures/intake_protocol_vectors\.json$''',
]
