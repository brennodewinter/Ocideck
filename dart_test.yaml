# Test tags.
#
# `golden` marks the slide-renderer visual-regression goldens (test/golden/).
# Their PNGs are pixel- and platform-specific, so they are EXCLUDED from the
# default suite (which CI runs on Linux, macOS and Windows) and run on a single
# platform with `make test-golden`. Declared here so `flutter test` doesn't warn
# about an unknown tag.
#
# `integration` marks the docker-jitsi-meet integration test
# (test/xmpp/xmpp_docker_jitsi_integration_test.dart). It is skipped unless
# OCIDECK_XMPP_INTEGRATION=1 is set and the local stack is running —
# `make test-xmpp-integration` sets the flag. Declared here so the default
# suite doesn't warn about an unknown tag.
# `benchmark` loopt in de verplichte aparte meetstap, zonder andere test-
# isolates of coverage-instrumentatie. De functionele schaaltest blijft gewoon
# in de parallelle suite. `make test` en `make coverage` voeren beide stappen uit.
# `codec-matrix` markeert installatieproeven die een expliciete decoder en
# voor de spraakproef ook een geïnstalleerd model vereisen.
# `registration` markeert de snelle registratie-/invariantentests die
# `make check-registrations` draait (#1123). De set wordt uit deze tag afgeleid
# — er is geen Makefile-lijst meer die kan verouderen (#3218). Een nieuwe
# invariantentest markeert zichzelf met `@Tags(['registration'])` boven
# `library;`; test/registration_tag_test.dart bewaakt dat een test die zich
# 'registration'/'invariant' noemt de tag ook echt draagt.
tags:
  benchmark:
  codec-matrix:
  golden:
  integration:
  registration:
