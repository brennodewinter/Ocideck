name: ocideck
description: "Marp Presentation Builder for Desktop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1
  shared_preferences: ^2.3.3
  pasteboard: ^0.5.0
  pdf: ^3.12.0
  archive: ^4.0.9
  video_player: ^2.11.1
  characters: ^1.3.0
  url_launcher: ^6.3.0
  desktop_drop: ^0.7.1
  image: ^4.8.0
  flutter_highlight: ^0.7.0
  flutter_math_fork: ^0.7.4
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  xml: ^6.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/de-winter-wittegeheel.png
    - assets/themes/ocideck.css
    - assets/web_export/
  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
        - asset: assets/fonts/EBGaramond-Italic-Variable.ttf
          style: italic
