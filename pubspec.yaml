name: ocideck
description: "Marp Presentation Builder for Desktop and Web"
publish_to: 'none'
version: 0.5.0+25
repository: https://pawprint.vigilis.online/LibreKAT/Ocideck
issue_tracker: https://pawprint.vigilis.online/LibreKAT/Ocideck/issues

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  file_picker: ^12.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  # nativeapi vervangt screen_retriever + window_manager (uitfasering aangekondigd
  # in Flutter 3.47). Git-dep naar onze fork op GitHub met de willClose-hook die
  # OciDeck nodig heeft voor setPreventClose-equivalent. Zie issue #1741.
  nativeapi:
    git:
      url: https://github.com/brennodewinter/nativeapi-flutter.git
      ref: 0b3aafa797dafd3012a4fdb74f403d6cb20288b1
      path: packages/nativeapi
  shared_preferences: ^2.3.3
  pasteboard: ^0.5.0
  pdf: ^3.13.0
  archive: ^4.0.9
  video_player: ^2.11.1
  characters: ^1.3.0
  crypto: ^3.0.0
  url_launcher: ^6.3.0
  desktop_drop: ^0.8.0
  image: ^4.9.1
  # dartcv4 is de opvolger van het teruggetrokken opencv_core: dat pakket is
  # retired voor Flutter >= 3.38 (wij draaien 3.47.1). De prebuilt OpenCV-pack
  # van opencv_core -> dartcv4 1.1.8 paste niet meer bij de Windows-toolchain,
  # waardoor `flutter build windows` afbrak op find_package(OpenCV). Alleen
  # gebruikt in lib/services/privacy/image_face_scan_io.dart (YuNet-detectie).
  dartcv4: ^2.2.1
  flutter_math_fork: ^0.7.4
  wakelock_plus: ^1.7.0
  # Taalbewuste getalnotatie in tabelcellen (render-time, opt-in per kolom).
  # Transitief al aanwezig via flutter_localizations; hier expliciet gemaakt
  # zodat NumberFormat direct importeerbaar is.
  intl: ^0.20.2
  # Vendored fork: adds native macOS window-geometry/fullscreen methods that
  # the published 0.3.0 dropped, needed for the dual-screen presenter mode.
  desktop_multi_window:
    path: third_party/desktop_multi_window
  fl_chart: ^1.2.0
  flutter_svg: ^2.2.0
  web: ^1.1.1
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  flutter_quill: ^11.5.1
  # Vendored fork: 17 maanden stale, onverifieerde uitgever. Zie
  # third_party/markdown_quill/MODIFICATIONS.md en issue #1743.
  markdown_quill:
    path: third_party/markdown_quill
  markdown: ^7.3.1
  xml: ^7.0.1
  # Wachtwoord voor de WebDAV/Nextcloud-bron versleuteld in de OS-keychain
  # (macOS/iOS Keychain, elders de veilige backend). Alleen het wachtwoord gaat
  # hierheen; server-URL/gebruikersnaam blijven in het prefs-domein.
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  # HTML-parser; zat al transief in de lockfile (o.a. via Quill). Directe dep
  # omdat we klembord-HTML naar Markdown omzetten (#1595), nooit renderen.
  html: ^0.15.6
  cryptography: ^2.9.0
  flutter_webrtc: ^1.5.2
  file_selector: ^1.1.0
  re_highlight: ^0.0.3
  material_ui: ^1.0.1

# dartcv4 2.x levert OpenCV modulair en sluit de meeste modules standaard UIT.
# De README waarschuwt: "even a module is excluded, its dart code is still
# available, but throws a symbol not found exception when called" — precies wat
# er misging na de opencv_core -> dartcv4-migratie (#870/#873): FaceDetectorYN
# viel om op `cv_FaceDetectorYN_create_1 symbol not found`, waardoor de
# privacy-gezichtsscan (OciWacht) op elk platform "niet gekeken" meldde i.p.v.
# te scannen.
#
# De scanner in lib/services/privacy/image_face_scan_io.dart heeft nodig:
# FaceDetectorYN (`objdetect`), het YuNet-model (`dnn`), imdecode (`imgcodecs`)
# en resize (`imgproc`); `core` zit er altijd in. OpenCV's objdetect hangt echter
# óók aan `calib3d`, en calib3d weer aan `features2d` + `flann` — laat je die weg,
# dan bouwt OpenCV objdetect niet en faalt het linken op "library
# 'opencv_objdetect' not found". Vandaar de hele keten hieronder. (`dnn` en
# objdetect maken de OpenCV-binary groter; dat is de prijs van de scan.)
#
# Getoetst door integration_test/native_face_scan_test.dart, dat op een echt
# platform draait — onder `flutter test` laadt de native laag niet.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs
        - flann
        - features2d
        - calib3d
        - dnn
        - objdetect

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drives tool/check_method_length.dart — a syntactic AST measures method
  # bodies accurately (closures, multi-line signatures, getters) instead of a
  # brittle brace heuristic. Pinned to the version Flutter already resolves.
  analyzer: ^13.3.0
  # Deterministic Timer/Future control for the autosave/recovery timer tests.
  fake_async: ^1.3.3
  # A fake VideoPlayerPlatform drives the media-lifecycle tests without real
  # playback (pause-before-dispose, supersession, completion).
  video_player_platform_interface: ^6.4.0
  # A fake UrlLauncherPlatform drives the external-link tests (scheme allowlist,
  # bare-domain/mailto normalisation) without touching a real browser.
  # MockPlatformInterfaceMixin comes from plugin_platform_interface.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  # Parses pubspec.lock / pubspec.yaml in the SBOM generator (tool/sbom_build.dart)
  # and its test. Already resolved transitively; declared here so the tooling can
  # depend on it directly.
  yaml: ^3.1.2

  webview_flutter_platform_interface: any
  vector_math: any

# cnativeapi moet ook uit de fork komen — nativeapi dependt op ^0.1.4 en pub
# zou de gepubliceerde versie kiezen, die de willClose-hook niet heeft.
dependency_overrides:
  cnativeapi:
    git:
      url: https://github.com/brennodewinter/nativeapi-flutter.git
      ref: 0b3aafa797dafd3012a4fdb74f403d6cb20288b1
      path: packages/cnativeapi

flutter:
  uses-material-design: true
  assets:
    # Het YuNet-gezichtsmodel (OpenCV Zoo, MIT). 232 KB, en bewust een asset in
    # plaats van een download: de privacycontrole mag geen netwerkuitgang hebben.
    # De MIT-tekst reist mee: een model verspreiden zonder zijn kennisgeving
    # mag niet (zie lib/services/bundled_licenses.dart).
    - assets/models/face_detection_yunet_2023mar.onnx
    - assets/models/YuNet-LICENSE.txt
    # De OFL-teksten van de vier gebundelde lettertypefamilies. OFL-1.1 §2 staat
    # herdistributie alleen toe mét de copyrightvermelding en de licentie erbij,
    # dus deze horen in de binary, niet alleen in de repo.
    - assets/fonts/OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Roboto-OFL.txt
    - assets/fonts/RobotoMono-OFL.txt
    - assets/fonts/NotoSansMath-OFL.txt
    # Aanvullend terugvalfont voor pijlen en wiskundige tekens in PDF-export
    # (#1968). Een subset van Noto Sans Math — alleen Arrows en Mathematical
    # Operators blocks, ~250 KB in plaats van de volledige 1 MB.
    - assets/fonts/NotoSansMath-subset.ttf
    # Volledige licentieteksten van de gebundelde JavaScript/CSS uit
    # assets/web_export/. Die bestanden dragen hooguit een banner; MIT, BSD-3 en
    # Apache-2.0 vragen de hele tekst bij herdistributie, en de gebruiker die
    # een HTML-export doorstuurt is de verspreidende partij.
    - assets/licenses/
    # Ook het bronbestand van de app-iconen: de macOS AppIcon-set (16–1024) en
    # het web-favicon/PWA-iconen worden hieruit gegenereerd. Niet weggooien
    # omdat de code hem "maar" op twee plekken toont.
    - assets/images/ocideck-logo.png
    - assets/images/ocideck-logo-eu.png
    - assets/images/librekat-logo.png
    - assets/images/vigilis-logo.png
    # Donkere-modus varianten van de drie merken: dezelfde tekening, echt
    # transparante achtergrond, lichte inkt. Gekoppeld aan hun lichte tegenhanger
    # in lib/theme/brand_logo.dart.
    - assets/images/ocideck-logo-dark.png
    - assets/images/librekat-logo-dark.png
    - assets/images/vigilis-logo-dark.png
    - assets/images/flag_fy.png
    - assets/images/cat-branie.jpg
    - assets/images/cat-keiko.jpg
    # Het OpenKAT-logo (Keiko), voor de OpenKAT-sectie op Integraties.
    - assets/images/openkat-logo.png
    - assets/images/cat-otis.jpg
    - assets/themes/ocideck.css
    # Full MITRE CWE weakness list (offline), merged over the curated floor in
    # lib/services/cwe_catalog.dart. Regenerate with tool/build_cwe_catalog.dart.
    - assets/cwe/cwe_full.json
    # Procesverbetering artefact templates (MD sources → JSON). Rebuild with
    # `dart run tool/build_improvement_templates.dart`.
    - assets/improvement/templates.json
    # Het gebundelde gezondheidslexicon (Orphanet, CC BY 4.0) — zie
    # tool/build_privacy_lexicon.dart en docs/LICENSE_COMPLIANCE.md.
    - assets/privacy/health_lexicon.json
    # Overtuigingen (EuroVoc, EU-hergebruiksbeleid) — zie
    # tool/build_eurovoc_lexicon.dart en docs/LICENSE_COMPLIANCE.md.
    - assets/privacy/belief_lexicon.json
    - assets/web_export/
    # Sjablooninhoud als document, één bestand per taal (<id>.nl.md naast
    # <id>.en.md); interfaceteksten van de kiezer blijven via l10n gaan.
    - assets/templates/
    # Full EUPL 1.2 licence text, shown verbatim in the consent screen.
    - LICENSE.md
    - CONTRIBUTORS.md
    # Documentation shipped in the in-app reader (Settings → Documentation).
    # A deliberately curated subset — not every doc under docs/. The app carries
    # what a *user* reaches for: the user guide and reference, licence and
    # compliance, and the technical docs that bear on using and running OciDeck
    # (performance, security design, hosting, migration). Developer-internal docs
    # (architecture, build, checks, source map, API, contributing, dev setup) and
    # the forward-looking design specs (docs/design/**) are NOT bundled; they live
    # in the repository, and the reader links there for the rest. The keep/repo
    # split is enforced by test/docs_registration_test.dart — add a new doc to one
    # side there, or the gate fails.
    #
    # Source-language files; translated variants (e.g. docs/USER_GUIDE.de.md) can
    # be added alongside and are picked up automatically by DocumentationService
    # once declared here.
    - docs/USER_GUIDE.md
    - docs/USER_GUIDE.nl.md
    - docs/SHORTCUTS.md
    - docs/SHORTCUTS.nl.md
    - docs/FILE_FORMAT.md
    - docs/FILE_FORMAT.nl.md
    - docs/README.md
    - docs/README.nl.md
    - docs/FAQ.md
    - docs/FAQ.nl.md
    - docs/TROUBLESHOOTING_GUIDE.md
    - docs/TROUBLESHOOTING_GUIDE.nl.md
    - docs/PRIVACY.md
    - docs/ACCESSIBILITY.md
    - docs/ACCESSIBILITY.nl.md
    - docs/KNOWN_LIMITATIONS.md
    - docs/KNOWN_LIMITATIONS.nl.md
    - docs/GLOSSARY.md
    - docs/GLOSSARY.nl.md
    - docs/LICENSE_COMPLIANCE.md
    - docs/SBOM.md
    - docs/PERFORMANCE_GUIDE.md
    - docs/SECURITY_DESIGN.md
    - docs/HOSTING.md
    - docs/MIGRATION_GUIDE.md
  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
        - asset: assets/fonts/EBGaramond-Italic-Variable.ttf
          style: italic
    # Bundled UI font. Registered under the literal family name "Roboto" so the
    # CanvasKit web engine finds it already present and does NOT download Roboto
    # from fonts.gstatic.com — keeping the web build self-contained (no
    # third-party origin) and working under a strict connect-src 'self' CSP.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    # Extra interface fonts the user can pick for the app UI. Bundled (not
    # system fonts) so the choice also works in the hardened web build and in
    # PDF/PPTX export.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    # Bundled monospace font, registered under both the literal `Roboto Mono`
    # name and the generic `monospace` alias. On the CanvasKit web engine a
    # generic CSS family like `monospace` has no downloadable font file, so
    # Flutter falls back to a proportional default — and the selection
    # rectangles (computed from the fallback's metrics) no longer align with
    # the text on screen (#1784). Registering the file under `monospace` means
    # every `fontFamily: 'monospace'` reference in the codebase resolves to
    # this bundled font with consistent metrics on every platform. The
    # `Roboto Mono` alias makes the option in the code-font settings resolve
    # to the same file. `Roboto Mono` is listed first so the SBOM component
    # carries the real font name, not the alias.
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Variable.ttf
    - family: monospace
      fonts:
        - asset: assets/fonts/RobotoMono-Variable.ttf
    # Aanvullend terugvalfont voor pijlen en wiskundige tekens in de PDF-export
    # (U+2192 →, U+2264 ≤, U+221E ∞). Niet gebruikt als Flutter-textfont, maar
    # als font family gedeclareerd zodat de SBOM-generator het meeneemt (#1968).
    - family: Noto Sans Math
      fonts:
        - asset: assets/fonts/NotoSansMath-subset.ttf
