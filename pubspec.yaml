name: ocideck
description: "Marp Presentation Builder for Desktop and Web"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1
  shared_preferences: ^2.3.3
  pasteboard: ^0.5.0
  pdf: ^3.12.0
  archive: ^4.0.9
  video_player: ^2.11.1
  characters: ^1.3.0
  crypto: ^3.0.0
  url_launcher: ^6.3.0
  desktop_drop: ^0.7.1
  image: ^4.8.0
  flutter_highlight: ^0.7.0
  flutter_math_fork: ^0.7.4
  highlight: ^0.7.0
  wakelock_plus: ^1.5.2
  # Vendored fork: adds native macOS window-geometry/fullscreen methods that
  # the published 0.3.0 dropped, needed for the dual-screen presenter mode.
  desktop_multi_window:
    path: third_party/desktop_multi_window
  fl_chart: ^1.2.0
  flutter_svg: ^2.2.0
  web: ^1.1.1
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  flutter_quill: ^11.5.1
  markdown_quill: ^4.3.0
  markdown: ^7.3.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  screen_retriever_macos:
    path: third_party/screen_retriever_macos
  # 2.9.5+ publishes a Swift module whose private Objective-C dependency is
  # not packaged correctly by CocoaPods on Xcode 26.
  video_player_avfoundation: 2.9.4

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/de-winter-wittegeheel.png
    - assets/themes/ocideck.css
    - assets/web_export/
  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
        - asset: assets/fonts/EBGaramond-Italic-Variable.ttf
          style: italic
