name: ocideck
description: "Marp Presentation Builder for Desktop and Web"
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1
  shared_preferences: ^2.3.3
  pasteboard: ^0.5.0
  pdf: ^3.13.0
  archive: ^4.0.9
  video_player: ^2.11.1
  characters: ^1.3.0
  crypto: ^3.0.0
  url_launcher: ^6.3.0
  desktop_drop: ^0.7.1
  image: ^4.9.1
  opencv_core: ^1.4.5
  flutter_highlight: ^0.7.0
  flutter_math_fork: ^0.7.4
  highlight: ^0.7.0
  wakelock_plus: ^1.5.2
  # Vendored fork: adds native macOS window-geometry/fullscreen methods that
  # the published 0.3.0 dropped, needed for the dual-screen presenter mode.
  desktop_multi_window:
    path: third_party/desktop_multi_window
  fl_chart: ^1.2.0
  flutter_svg: ^2.2.0
  web: ^1.1.1
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  flutter_quill: ^11.5.1
  markdown_quill: ^4.3.0
  markdown: ^7.3.1
  xml: ^7.0.1
  # Wachtwoord voor de WebDAV/Nextcloud-bron versleuteld in de OS-keychain
  # (macOS/iOS Keychain, elders de veilige backend). Alleen het wachtwoord gaat
  # hierheen; server-URL/gebruikersnaam blijven in het prefs-domein.
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drives tool/check_method_length.dart — a syntactic AST measures method
  # bodies accurately (closures, multi-line signatures, getters) instead of a
  # brittle brace heuristic. Pinned to the version Flutter already resolves.
  analyzer: ^12.1.0
  # Deterministic Timer/Future control for the autosave/recovery timer tests.
  fake_async: ^1.3.3
  # A fake VideoPlayerPlatform drives the media-lifecycle tests without real
  # playback (pause-before-dispose, supersession, completion).
  video_player_platform_interface: ^6.4.0
  # A fake UrlLauncherPlatform drives the external-link tests (scheme allowlist,
  # bare-domain/mailto normalisation) without touching a real browser.
  # MockPlatformInterfaceMixin comes from plugin_platform_interface.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  # Parses pubspec.lock / pubspec.yaml in the SBOM generator (tool/sbom_build.dart)
  # and its test. Already resolved transitively; declared here so the tooling can
  # depend on it directly.
  yaml: ^3.1.2

dependency_overrides:
  screen_retriever_macos:
    path: third_party/screen_retriever_macos

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # Het YuNet-gezichtsmodel (OpenCV Zoo, MIT). 232 KB, en bewust een asset in
    # plaats van een download: de privacycontrole mag geen netwerkuitgang hebben.
    - assets/models/face_detection_yunet_2023mar.onnx
    - assets/images/ocideck-logo.png
    - assets/images/ocideck-logo-eu.png
    - assets/images/librekat-logo.png
    - assets/images/de-winter-wittegeheel.png
    - assets/images/flag_fy.png
    - assets/images/flag_tlh.png
    - assets/images/cat-branie.jpg
    - assets/images/cat-keiko.jpg
    - assets/images/cat-otis.jpg
    - assets/themes/ocideck.css
    # Full MITRE CWE weakness list (offline), merged over the curated floor in
    # lib/services/cwe_catalog.dart. Regenerate with tool/build_cwe_catalog.dart.
    - assets/cwe/cwe_full.json
    - assets/web_export/
    # Full EUPL 1.2 licence text, shown verbatim in the consent screen.
    - LICENSE.md
    # User-facing documentation, shown in the in-app reader (Settings →
    # Documentation). Source-language files; translated variants (e.g.
    # docs/USER_GUIDE.de.md) can be added alongside and are picked up
    # automatically by DocumentationService once declared here.
    - docs/USER_GUIDE.md
    - docs/SHORTCUTS.md
    - docs/FILE_FORMAT.md
    - docs/ARCHITECTURE.md
    - docs/BUILD.md
    - docs/CHECKS.md
    - docs/SOURCE_MAP.md
    - docs/LICENSE_COMPLIANCE.md
    - docs/SBOM.md
    - docs/README.md
    - docs/FAQ.md
    - docs/TROUBLESHOOTING_GUIDE.md
    - docs/PRIVACY.md
    - docs/GLOSSARY.md
    - docs/API_DOCUMENTATION.md
    - docs/PERFORMANCE_GUIDE.md
    - docs/SECURITY_DESIGN.md
    - docs/HOSTING.md
    - docs/CONTRIBUTING_GUIDELINES.md
    - docs/DEVELOPMENT_SETUP_GUIDE.md
    - docs/MIGRATION_GUIDE.md
    - docs/design/COLLABORATION.md
    - docs/design/GIT_STORAGE.md
    - docs/design/VERIFICATION.md
    - docs/design/PENTEST_MIAUW.md
    - docs/design/AI_ASSIST.md
    - docs/design/AGENTIC_BUILD_PLAN.md
    - docs/design/OCIWACHT.md
    - docs/design/PROCESS_IMPROVEMENT.md
  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
        - asset: assets/fonts/EBGaramond-Italic-Variable.ttf
          style: italic
    # Bundled UI font. Registered under the literal family name "Roboto" so the
    # CanvasKit web engine finds it already present and does NOT download Roboto
    # from fonts.gstatic.com — keeping the web build self-contained (no
    # third-party origin) and working under a strict connect-src 'self' CSP.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    # Extra interface fonts the user can pick for the app UI. Bundled (not
    # system fonts) so the choice also works in the hardened web build and in
    # PDF/PPTX export.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf

# Welke OpenCV-modules in de gebundelde `dartcv` meegaan (OCIWACHT §13.8).
#
# De beeldcontrole gebruikt er precies vijf: `core` en `imgproc` voor het
# rekenwerk, `imgcodecs` om een afbeelding te decoderen, en `objdetect` plus
# `dnn` voor het YuNet-model. Zonder deze lijst gaat de volledige modulelijst
# mee — inclusief `stitching`, `photo`, `video` en `videoio`, die geen enkele
# aanroep in deze app hebben.
#
# Twee dingen om te weten voordat je hieraan draait:
#
#   * module-exclusie werkt **alleen op Android, Windows en Linux**. Op macOS
#     krijg je hoe dan ook de volle build, en daar is 27 MB gemeten. Deze lijst
#     verandert daar dus niets;
#   * een uitgesloten module houdt zijn Dart-API maar gooit "symbol not found"
#     bij aanroep. Dat is geen compilatiefout — het valt pas om als iemand de
#     functie werkelijk aanroept.
#
# Dat tweede is de reden dat deze lijst er pas kwam nadat CI op Linux én Windows
# een platformbuild maakt en de beeldtests daar echt draait. Die tests roepen
# alle vijf de modules aan, dus een verkeerde lijst valt daar om in plaats van
# bij een gebruiker.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - core
        - imgproc
        - imgcodecs
        - objdetect
        - dnn
