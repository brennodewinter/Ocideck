<!doctype html>
<html>
<head><meta charset="utf-8"><title>wasm-probe</title></head>
<body>
<pre id="out">probe loading…</pre>
<script>
window.__probe = { done: false, texts: [] };
window.Module = {
  print: t => {
    window.__probe.texts.push(t);
    if (t.indexOf('total time') !== -1) window.__probe.done = true;
    console.log('[wasm] ' + t);
  },
  printErr: t => {
    window.__probe.texts.push(t);
    if (t.indexOf('total time') !== -1) window.__probe.done = true;
    console.log('[wasmerr] ' + t);
  },
};
</script>
<script src="libmain.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const model = q.get('model') || 'ggml-tiny.bin';
  const audioFile = q.get('audio') || 'vlot.wav';
  const threads = parseInt(q.get('threads') || '4', 10);
  const lang = q.get('lang') || 'nl';
  const res = {
    model, audio: audioFile, threads, lang,
    sab: typeof SharedArrayBuffer !== 'undefined',
    isocross: crossOriginIsolated === true,
    errors: [],
  };
  const inst = Module;
  const t0 = performance.now();
  try {
    await new Promise(r => {
      if (inst.runtimeInitialized) return r();
      inst.onRuntimeInitialized = r;
    });
    res.moduleInitMs = Math.round(performance.now() - t0);

    let tm = performance.now();
    const mbuf = new Uint8Array(await (await fetch(model)).arrayBuffer());
    res.modelFetchMs = Math.round(performance.now() - tm);
    try { inst.FS_unlink('whisper.bin'); } catch (e) {}
    inst.FS_createDataFile('/', 'whisper.bin', mbuf, true, true);

    tm = performance.now();
    const ctx = inst.init('whisper.bin');
    res.modelInitMs = Math.round(performance.now() - tm);
    if (!ctx) throw new Error('Module.init returned 0 (model load failed)');

    const abuf = await (await fetch(audioFile)).arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ac = new AC();
    const decoded = await ac.decodeAudioData(abuf);
    const oc = new OC(1, Math.ceil(decoded.duration * 16000), 16000);
    const src = oc.createBufferSource();
    src.buffer = decoded; src.connect(oc.destination); src.start(0);
    const rendered = await oc.startRendering();
    const pcm = rendered.getChannelData(0);
    res.audioSec = Math.round(decoded.duration * 10) / 10;

    const tInfer = performance.now();
    const ret = inst.full_default(ctx, pcm, lang, threads, false);
    if (ret !== 0) throw new Error('full_default returned ' + ret);
    await new Promise((resolve, reject) => {
      const to = setTimeout(() => reject(new Error('inference timeout 300s')), 300000);
      const iv = setInterval(() => {
        if (window.__probe.done) { clearInterval(iv); clearTimeout(to); resolve(); }
      }, 200);
    });
    res.inferMs = Math.round(performance.now() - tInfer);
    res.rtf = Math.round((res.inferMs / 1000 / res.audioSec) * 100) / 100;
    inst.free(ctx);
  } catch (e) {
    res.errors.push(String(e && e.stack || e));
  }
  if (performance.memory) {
    res.memMB = Math.round(performance.memory.usedJSHeapSize / 1048576);
  }
  res.totalMs = Math.round(performance.now() - t0);
  res.net = performance.getEntriesByType('resource').map(e => e.name);
  res.out = window.__probe.texts;
  try {
    await fetch('/result', { method: 'POST', body: JSON.stringify(res, null, 2) });
    document.getElementById('out').textContent += '\nRESULT POSTED';
  } catch (e) {
    document.getElementById('out').textContent += '\nPOST FAILED: ' + e;
  }
})();
</script>
</body>
</html>
