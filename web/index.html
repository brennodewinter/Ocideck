<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build`'s --base-href at build time. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- CSP hardening: rationale for each directive in docs/SECURITY_DESIGN.md §1 and docs/BUILD.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; child-src 'self' blob: data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">

  <!-- Companion HTTP header and rationale: docs/HOSTING.md, docs/SECURITY_DESIGN.md §1. -->
  <meta name="referrer" content="no-referrer">

  <meta name="description" content="Feline and human friendly presentations">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OciDeck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OciDeck — Feline and human friendly presentations</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #14161b;
      color: #e8ecf3;
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    }
    #splash p { margin: 0; font-weight: 600; letter-spacing: 0.3px; }
    #splash .sub { font-weight: 400; color: #8b95a6; font-size: 13px; }
    @media (prefers-color-scheme: light) {
      #splash { background: #f8f9fa; color: #1e293b; }
      #splash .sub { color: #64748b; }
    }
  </style>
</head>
<body>
  <!-- Loading splash, no inline script (CSP): rationale in docs/BUILD.md, #589. -->
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="72" height="72">
    <p>OciDeck</p>
    <p class="sub">Laden… · Loading…</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
