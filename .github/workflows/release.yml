# De Windows-bouwlijn. Draait op github.com, niet op de forge.
#
# De forge (Pawprint) is de bron van dit project en bouwt web, Linux en macOS
# zelf. Windows kan daar niet: er staat geen Windows-machine, en een
# desktopbundel laat zich niet cross-compileren. Daarvoor is er een push-mirror
# naar github.com/brennodewinter/Ocideck, en dit bestand is het enige dat daar
# iets doet — één platform, verder niets.
#
# Waarom hier een échte GitHub-*release* wordt gepubliceerd en niet alleen een
# build-artifact: een artifact vraagt een token om te downloaden (óók bij een
# publieke repo) en verloopt na negentig dagen. Een release-asset van een
# publieke repo is een gewone publieke URL die blijft bestaan. Daardoor kan de
# release-workflow op de forge dat bestand gewoon met `curl` ophalen, zonder dat
# er een GitHub-token als geheim op de eigen runner hoeft te staan.
#
# De volledige release — álle platformen, de SBOM en SHA256SUMS — staat op de
# forge: https://pawprint.vigilis.online/LibreKAT/Ocideck/releases
#
# Let op: Forgejo leest `.forgejo/workflows/` en negeert deze map volledig. Wat
# er op de forge draait staat daar; wat hier staat draait alleen op de spiegel.
name: Windows release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege, met één uitzondering: `contents: write` is nodig om de
# release aan te maken en het bestand eraan te hangen. Verder leest deze
# workflow alleen.
permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    # Bewust niet windows-latest: dartcv4 (de OpenCV-laag onder de
    # privacyscanner) haalt een voorgebouwd OpenCV-Windows-pakket op waarvan
    # de binaries niet samengaan met de nieuwste MSVC op dat image
    # ("Found OpenCV Windows Pack but it has no binaries compatible with
    # your configuration"). Op het 2022-image staat de MSVC waarvoor dat
    # pakket gebouwd is. Los deze pin pas wanneer upstream dartcv een pakket
    # voor nieuwere MSVC's uitbrengt.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Letterlijk, en dat is met opzet: `make check-toolchain` leest deze
          # regel en faalt zodra hij afwijkt van de pin in .tool-versions (zie
          # versionClaimPatterns in tool/check_toolchain.dart). Een tweede plek
          # om te vergeten is dit dus niet — het is een tweede plek die bewaakt
          # wordt.
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        # --enforce-lockfile fails if pubspec.lock drifted, so a release can't
        # silently pull a different (unvetted) dependency set than CI vetted.
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        # `make` is not reliably present on the Windows runner, so call Flutter
        # directly.
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      # De bestandsnaam is een afspraak, geen smaak: de release-workflow op de
      # forge haalt exact dit bestand op. Verander je hem hier, verander hem dan
      # ook in .forgejo/workflows/release.yml (job `windows-ophalen`).
      - name: Package
        shell: bash
        run: |
          set -eu
          VERSIE="${GITHUB_REF_NAME#v}"
          (cd build/windows/x64/runner/Release && \
            7z a -tzip "$GITHUB_WORKSPACE/ocideck-windows-x64-$VERSIE.zip" ./*)
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      - name: Publish to the mirror's release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BESTAND="ocideck-windows-x64-$VERSIE.zip"
          # Mét releasetekst en niet stilzwijgend: wie hier via een zoekmachine
          # binnenkomt moet meteen zien dat dit één platform is en waar de rest
          # staat. Bestaat de release al (hertrigger), dan het bestand alleen
          # vervangen.
          NOTES=$(cat <<EOF
          Windows build lane for OciDeck $GITHUB_REF_NAME.

          This mirror exists to build the Windows artifact; the project itself
          lives at <https://pawprint.vigilis.online/LibreKAT/Ocideck>.

          **The complete release** — macOS, Windows, Linux, the web bundle, the
          SBOM and \`SHA256SUMS\` — is published there:
          <https://pawprint.vigilis.online/LibreKAT/Ocideck/releases/tag/$GITHUB_REF_NAME>

          The binary is unsigned, so SmartScreen will warn: choose **More info**
          → **Run anyway**. Verify your download against \`SHA256SUMS\` in the
          release linked above.
          EOF
          )
          # Een streepje = semver-voorloper (`v0.1.0-rc1`, waarmee de keten
          # geoefend wordt); die hoort hier net zo goed als prerelease te staan
          # als aan de forgekant.
          case "$GITHUB_REF_NAME" in
            *-*) VOORLOPER=(--prerelease) ;;
            *)   VOORLOPER=() ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$BESTAND" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$BESTAND" \
              --title "OciDeck $GITHUB_REF_NAME (Windows build)" \
              --notes "$NOTES" "${VOORLOPER[@]}"
          fi
