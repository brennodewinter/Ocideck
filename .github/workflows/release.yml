# De Windows-bouwlijn. Draait op github.com, niet op de forge.
#
# De forge (Pawprint) is de bron van dit project en bouwt web, Linux en macOS
# zelf. Windows kan daar niet: er staat geen Windows-machine, en een
# desktopbundel laat zich niet cross-compileren. Daarvoor is er een push-mirror
# naar github.com/brennodewinter/Ocideck, en dit bestand is het enige dat daar
# iets doet — één platform, verder niets.
#
# De kandidaatbouw bewaart zip, installer en cohort als Actions-artifact. De
# forge haalt die gecontroleerde bytes op voordat er een tag bestaat. Een
# latere tag-push controleert alleen de bronversie en bouwt niets opnieuw.
#
# De volledige release — álle platformen, de SBOM en SHA256SUMS — staat op de
# forge: https://pawprint.vigilis.online/LibreKAT/Ocideck/releases
#
# Let op: Forgejo leest `.forgejo/workflows/` en negeert deze map volledig. Wat
# er op de forge draait staat daar; wat hier staat draait alleen op de spiegel.
name: Windows release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Build without publishing a tag
        required: false
        type: choice
        options: [candidate, publish]
      version:
        description: Future release tag
        required: false
        type: string
      commit_sha:
        description: Exact commit to build
        required: false
        type: string

run-name: Windows ${{ inputs.mode == 'candidate' && 'candidate' || 'release' }} ${{ inputs.version || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
  RELEASE_SHA: ${{ inputs.commit_sha || github.sha }}

# De kandidaatbouw leest broncode en bewaart alleen een Actions-artifact.
permissions:
  contents: read

# Twee dispatches voor dezelfde kandidaat mogen niet door elkaar bouwen.
concurrency:
  group: windows-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows
    if: ${{ inputs.mode == 'candidate' }}
    # dartcv4 2.x levert OpenCV via native-assets build-hooks (CMake) in plaats
    # van een voorgebouwd pack, dus de MSVC-compatibiliteit die de windows-2022
    # pin noodzakelijk maakte is niet meer van toepassing (#870).
    runs-on: windows-latest
    # De rc1-les in één regel: een stap die op een venster wacht dat niemand kan
    # wegklikken liep 1u52m door en had zonder ingrijpen de volle zes uur
    # standaard opgemaakt. De bouw zelf duurt ~20-35 min; 90 is ruim.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Kandidateninvoer valideren
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = main
          test "$RELEASE_TAG" != main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d+ -f1)" = "${RELEASE_TAG#v}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Letterlijk, en dat is met opzet: `make check-toolchain` leest deze
          # regel en faalt zodra hij afwijkt van de pin in .tool-versions (zie
          # versionClaimPatterns in tool/check_toolchain.dart). Een tweede plek
          # om te vergeten is dit dus niet — het is een tweede plek die bewaakt
          # wordt.
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        # --enforce-lockfile fails if pubspec.lock drifted, so a release can't
        # silently pull a different (unvetted) dependency set than CI vetted.
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        # `make` is not reliably present on the Windows runner, so call Flutter
        # directly.
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      # Inno Setup is NIET voorgeïnstalleerd op windows-latest sinds dat label
      # naar Server 2025 wees (Server 2022 droeg het nog). Dus zelf ophalen —
      # rechtstreeks bij de uitgever, niet via Chocolatey: dat zou een extra
      # partij in het releasepad zetten voor een bestand dat upstream gewoon als
      # release-asset publiceert.
      #
      # De pin is tweeledig en dat is met opzet. De URL draagt de versie
      # (INNOSETUP_VERSION, óók in .github/pinned-ci-versions.json, anders valt
      # test/pinned_versions_manifest_test.dart), en de bytes worden tegen een
      # sha256 gelegd. De versie alleen zou volstaan zolang niemand een
      # release-asset vervangt; de hash dekt dat af en faalt lúid in plaats van
      # stil iets anders te draaien — dezelfde redenering als de appimagetool-pin
      # in de Linux-job (zie packaging/README.md).
      #
      # PowerShell en niet bash, en dat is geen smaak maar een reparatie (v0.4.7-rc1).
      # In Git Bash vertaalt de MSYS-laag elk argument dat met `/` begint naar een
      # Windows-pad: `/VERYSILENT` kwam bij Inno Setup aan als
      # `C:/Program Files/Git/VERYSILENT`. Zonder herkende stille-modusvlag opende
      # de installer zijn eigen venster en bleef de job staan wachten op een klik
      # die op een runner nooit komt — 1 uur 52 minuten, tot handmatig afbreken.
      # De wees-processen `innosetup-…exe` en `innosetup-…tmp` in het log waren
      # het bewijs.
      #
      # `Start-Process -Wait` dekt meteen een tweede val: Inno's setup.exe pakt
      # zichzelf uit naar een `.tmp` en keert terug zodra dat kind draait. Zonder
      # -Wait kan de volgende stap ISCC aanroepen vóórdat de installatie klaar is —
      # een race die zich als "ISCC bestaat niet" zou voordoen, en alleen soms.
      - name: Inno Setup installeren (gepind)
        shell: pwsh
        env:
          INNOSETUP_VERSION: 7.1.0
          INNOSETUP_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
        run: |
          $ErrorActionPreference = 'Stop'
          $bestand = "innosetup-$env:INNOSETUP_VERSION-x64.exe"
          $tag = 'is-' + ($env:INNOSETUP_VERSION -replace '\.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/$bestand"
          Invoke-WebRequest -Uri $url -OutFile $bestand
          $hash = (Get-FileHash $bestand -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNOSETUP_SHA256) {
            throw "sha256 van $bestand klopt niet: $hash (verwacht $env:INNOSETUP_SHA256)"
          }
          Write-Host "sha256 geverifieerd: $bestand"
          $p = Start-Process -FilePath ".\$bestand" -Wait -NoNewWindow -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          # Start-Process werpt zelf niets bij een niet-nul kind, en juist
          # /SUPPRESSMSGBOXES onderdrukt de foutvensters — zonder deze controle
          # leest een mislukte installatie als geslaagd en faalt pas ISCC,
          # met "bestaat niet" als dwaalspoor.
          if ($p.ExitCode -ne 0) {
            throw "Inno Setup-installatie faalde met exitcode $($p.ExitCode)."
          }
          # Het pad van de ZOJUIST geïnstalleerde ISCC expliciet doorgeven aan
          # de packager. Zonder dit koos diens find_iscc `command -v iscc`
          # eerst — en rc2 bewees dat het runner-image een Chocolatey-shim
          # draagt: we pinden en verifieerden 7.1.0, en compileerden toen met
          # een ongepind 6.7.1 uit die shim. Een pin die niet gebruikt wordt is
          # decoratie. Zoeken i.p.v. hardcoderen, want waar Inno zijn map zet
          # verschilt per editie (x64 vs x86) en per major.
          $iscc = Get-ChildItem -Path 'C:\Program Files\Inno Setup*\ISCC.exe',
              'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) {
            throw 'Geen ISCC.exe gevonden na de installatie.'
          }
          # De versietoets is twee rc's lang een leerschool geweest, dus de
          # redenering staat er volledig bij. rc3: ISCC.exe draagt geen
          # bruikbare VersionInfo (ProductVersion 0.0.0.0 op een correcte
          # installatie). rc4: de banner zónder argumenten noemt alleen de
          # major ("Inno Setup 7 Command-Line Compiler"), nooit 7.1.0 — maar
          # diezelfde hulptekst adverteert "--version: Prints the compiler
          # engine version". Dat is dus de gedocumenteerde bron, en de match op
          # het kale versienummer maakt de opmaak eromheen irrelevant. pwsh
          # werpt niet op native exitcodes; faalt de match, dan staat de
          # volledige uitvoer in de foutmelding.
          $versie = (& $iscc.FullName --version 2>&1) -join "`n"
          if ($versie -notmatch [regex]::Escape($env:INNOSETUP_VERSION)) {
            throw "ISCC op $($iscc.FullName) meldt zich niet als $env:INNOSETUP_VERSION. Uitvoer van --version:`n$versie"
          }
          "OCIDECK_ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Inno Setup $env:INNOSETUP_VERSION geïnstalleerd: $($iscc.FullName)"

      # Vóór het zippen, niet erna: het script tekent de .exe en de dll's ter
      # plekke als er ooit een certificaat wordt ingesteld (OCIDECK_WIN_SIGN_SHA1).
      # Bouw je de zip eerst, dan draagt die de óngetekende binaries en de
      # installer de getekende — twee downloads die niet hetzelfde zijn.
      # Hier staat geen certificaat, dus dit levert een ongetekende installer met
      # een luide waarschuwing in het log; zie scripts/build_windows_installer.sh.
      #
      # VERSION komt uit de tag en niet uit pubspec.yaml: de zip hiernaast wordt
      # ook naar de tag genoemd, en de forge haalt beide bestanden op onder een
      # naam die uit de tag is afgeleid. Zou het script hier zelf pubspec lezen,
      # dan levert een tag die (nog) niet gelijk is aan de pubspec-versie een
      # bestand op dat de forge niet kan vinden — een release die vastloopt op
      # een naamsverschil is precies het soort hoofdpijn dat hier niet hoort.
      - name: Installer bouwen
        shell: bash
        run: VERSION="${RELEASE_TAG#v}" bash scripts/build_windows_installer.sh

      # De bestandsnamen zijn een afspraak, geen smaak: de release-workflow op de
      # forge haalt exact deze bestanden op. Verander je ze hier, verander ze dan
      # ook in .forgejo/workflows/release.yml (job `windows-ophalen`) — en
      # test/windows_packaging_test.dart legt de twee kanten naast elkaar.
      - name: Package
        shell: bash
        run: |
          set -eu
          VERSIE="${RELEASE_TAG#v}"
          # In één versiemap ocideck-<versie>/, niet los in de huidige map:
          # anders spatte de zip bij het uitpakken over de map waarin je stond
          # (issue #904). 7z kent geen hernoem-bij-inpakken, dus eerst een
          # staging-map vullen en die inpakken.
          STAGE="ocideck-$VERSIE"
          rm -rf "$STAGE"
          mkdir "$STAGE"
          cp -r build/windows/x64/runner/Release/* "$STAGE/"
          7z a -tzip "$GITHUB_WORKSPACE/ocideck-windows-x64-$VERSIE.zip" "$STAGE"
          # De installer legde zichzelf in dist/; naar de workspace-root zodat de
          # publicatiestap hieronder één plek hoeft te kennen.
          mv "dist/ocideck-windows-x64-setup-$VERSIE.exe" "$GITHUB_WORKSPACE/"
          echo "VERSIE=$VERSIE" >> "$GITHUB_ENV"

      # Functionele proef vóór publicatie (#2314): een installer die compileert
      # maar niet installeert, niet start of troep achterlaat mag de release
      # nooit bereiken — precies wat statische controles niet zien. De proef
      # installeert stil als gewone gebruiker in een schone tijdelijke map,
      # toetst payload en associaties, start de app, en verwijdert alles weer.
      #
      # pwsh en niet bash — dezelfde MSYS-reden als bij de Inno-installatie
      # hierboven: onder Git Bash zou /VERYSILENT als pad aankomen en het
      # venster zou op een runner nooit wegklikt worden (v0.4.7-rc1 hing er
      # 1u52m op). En Start-Process -Wait -PassThru met een expliciete
      # ExitCode-check: zonder die leest een mislukte installatie als geslaagd.
      - name: "Smoke-test: installeren, starten, verwijderen"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$env:GITHUB_WORKSPACE\ocideck-windows-x64-setup-$env:VERSIE.exe"
          if (-not (Test-Path $setup)) { throw "De gebouwde setup ontbreekt: $setup" }
          $doel = Join-Path $env:TEMP "ocideck-smoke-$PID"

          # 1. Stil installeren, per gebruiker (/CURRENTUSER — HKA-sleutels
          #    landen dan in HKCU en de proef raakt niets machine-breeds).
          $p = Start-Process -FilePath $setup -Wait -NoNewWindow -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', `
            '/CURRENTUSER', "/DIR=`"$doel`""
          if ($p.ExitCode -ne 0) {
            throw "De installer faalde in stille modus (exit $($p.ExitCode))."
          }
          # setup.exe kan terugkeren zodra zijn uitgepakte kind draait; wacht
          # tot de installatie aantoonbaar klaar is (de de-installer wordt als
          # laatste geschreven).
          $wacht = 0
          while (-not (Test-Path "$doel\unins000.exe") -and $wacht -lt 120) {
            Start-Sleep -Seconds 2; $wacht += 2
          }

          # 2. Payload en associaties: precies wat de installer belooft.
          #    De VC++-runtime staat er bij omdat deze runner hem wél heeft
          #    (Visual Studio) maar een schone Windows-installatie niet —
          #    een missende msvcp140 is precies de klasse fout die hier
          #    onzichtbaar zou blijven (#2630).
          foreach ($f in @('ocideck.exe', 'flutter_windows.dll', 'data\app.so', 'unins000.exe',
                          'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "$doel\$f")) {
              throw "Payload ontbreekt na installatie: $doel\$f"
            }
          }
          $oc = Get-Item 'HKCU:\Software\Classes\.ocideck' -ErrorAction SilentlyContinue
          if (-not $oc -or $oc.GetValue('') -ne 'OciDeck.Package') {
            throw '.ocideck wijst na installatie niet naar OciDeck.Package.'
          }
          $md = Get-Item 'HKCU:\Software\Classes\.md\OpenWithProgids' -ErrorAction SilentlyContinue
          if (-not $md -or ($md.GetValueNames() -notcontains 'OciDeck.Package')) {
            throw '.md mist de "Openen met"-vermelding voor OciDeck.Package.'
          }

          # 3. Startproef: de app moet opkomen, een venster tekenen en draaien
          #    blijven. Een exe die direct wegvalt (mismatched dll, ontbrekende
          #    payload) mag de release nooit bereiken — en een proces dat leeft
          #    maar nooit een frame tekent evenmin: op Windows verschijnt het
          #    venster pas bij het eerste frame, dus voor de gebruiker is dat
          #    "de app start niet". Het logbestand (#2618) zegt welke mijlpaal
          #    er wel kwam; bij een fout staat het hieronder in het releaselog.
          $app = Start-Process -FilePath "$doel\ocideck.exe" -PassThru
          $log = $null; $frame = $false; $wacht = 0
          while (-not $frame -and $wacht -lt 60) {
            Start-Sleep -Seconds 2; $wacht += 2
            $app.Refresh()
            if ($app.HasExited) { break }
            if (-not $log) {
              $log = Get-ChildItem -Path $env:APPDATA -Filter 'ocideck.log' -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'logs' } | Select-Object -First 1
            }
            if ($log) { $frame = Select-String -Path $log.FullName -Pattern 'opstart: eerste frame' -Quiet }
          }
          $app.Refresh()
          if ($log) {
            Write-Host "--- $($log.FullName) ---"
            Get-Content $log.FullName | Write-Host
          }
          if ($app.HasExited) {
            throw "ocideck.exe is binnen $wacht s gestopt (exit $($app.ExitCode))."
          }
          if (-not $log) { throw "ocideck.exe draait, maar schreef binnen $wacht s geen logbestand." }
          if (-not $frame) { throw "ocideck.exe draait, maar tekende binnen $wacht s geen eerste frame." }
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            throw "ocideck.exe stopte kort na het eerste frame (exit $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force

          # 4. Stil verwijderen en aantoonbaar schoon achterlaten. unins000.exe
          #    retourneert vroeg (het echte werk doet een kindproces), dus pollen
          #    tot de map weg is in plaats van op de exitstatus alleen te leunen.
          $p = Start-Process -FilePath "$doel\unins000.exe" -Wait -NoNewWindow -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) {
            throw "De de-installatie faalde (exit $($p.ExitCode))."
          }
          $wacht = 0
          while ((Test-Path $doel) -and $wacht -lt 120) {
            Start-Sleep -Seconds 2; $wacht += 2
          }
          if (Test-Path $doel) {
            throw "De de-installatie liet $doel achter."
          }
          if (Test-Path 'HKCU:\Software\Classes\OciDeck.Package') {
            throw 'De de-installatie liet de ProgID-sleutel achter.'
          }
          Write-Host "Smoke-test groen: $setup installeert, start en ruimt schoon op."

      - name: Cohortattest voor de forge
        shell: bash
        run: |
          set -eu
          VERSIE="${RELEASE_TAG#v}"
          BESTANDEN=("ocideck-windows-x64-$VERSIE.zip" "ocideck-windows-x64-setup-$VERSIE.exe")
          for f in "${BESTANDEN[@]}"; do test -f "$f"; done
          # Cohortattest (#2313): één bestand dat bewijst dat zip en installer
          # uit DEZE run komen — tagcommit, run-id en beide sha256's. De forge
          # accepteert het paar alleen als dit klopt; een halve upload (de zip
          # vervangen, de installer niet) kan dan nooit als één cohort gelden.
          jq -n --arg commit "$RELEASE_SHA" --argjson run "$GITHUB_RUN_ID" \
            --arg zip "$(sha256sum "${BESTANDEN[0]}" | cut -d' ' -f1)" \
            --arg installer "$(sha256sum "${BESTANDEN[1]}" | cut -d' ' -f1)" \
            '{tag_commit: $commit, run_id: $run,
              sha256: {zip: $zip, installer: $installer}}' \
            > "ocideck-windows-cohort-$VERSIE.json"

      - name: Bewaar Windows-cohort voor de forge
        uses: actions/upload-artifact@v4
        with:
          name: ocideck-windows-cohort
          path: |
            ocideck-windows-x64-${{ env.VERSIE }}.zip
            ocideck-windows-x64-setup-${{ env.VERSIE }}.exe
            ocideck-windows-cohort-${{ env.VERSIE }}.json
          if-no-files-found: error

  tag-check:
    name: Tag controleren zonder nieuwe build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tag wijst naar de voorbereide bronversie
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REF_TYPE" = tag
          test "$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d+ -f1)" = "${GITHUB_REF_NAME#v}"
