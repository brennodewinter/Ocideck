# ⚠️  THIS FILE DOES NOT RUN ON THE FORGEJO REMOTE.
#
# Since 2026-07-23 the forge has a registered Actions runner, but Forgejo reads
# the first workflow directory that exists — `.forgejo/workflows/` — and that
# shadows this one. What actually runs there is `linux-build.yml` (the Linux
# desktop bundle on every push to main). This file remains a *reference
# definition*: it says what a release build would be, kept ready for a GitHub
# mirror. Desktop bundles cannot be cross-compiled, so a full release still
# needs per-OS builds this runner cannot provide (#741 tracks the CI gate).
#
# **The real gate is `make check`, run locally before every merge.** It takes
# about three minutes (measured; see docs/CHECKS.md), so a contributor can run
# the same thing this file describes. `make check-full` adds the slow scans.
#
# Written here and not only in the docs because this is the file a contributor
# finds first — seeing `.github/workflows/` reasonably suggests the project
# lives on GitHub and that this exact CI will check their work. Both are false,
# and discovering that after opening a pull request is a poor first experience
# (#592).

name: Release builds

# Produces distributable artifacts for every supported target. Desktop bundles
# cannot be cross-compiled, so each platform builds on its own runner. Triggered
# by a version tag (e.g. v1.0.0) or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: these jobs only read the repo and upload build artifacts
# (via the separate Actions runtime token, not GITHUB_TOKEN), so read-only is
# enough. Grant no more than that to the token a tag build runs with.
permissions:
  contents: read

jobs:
  # Software Bill of Materials (CycloneDX 1.6 + SPDX 2.3). Uploaded as its own
  # release artefact so the CRA (Reg. (EU) 2024/2847, Annex I Part II §1)
  # bill-of-materials accompanies every release. The web bundle also ships a
  # copy under /sbom/ (see `make build-web`).
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Verify the committed SBOM is current, then emit it fresh for upload.
      - name: Verify + generate SBOM (make sbom-verify + sbom)
        run: |
          make sbom-verify
          make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ocideck-sbom
          path: sbom
          if-no-files-found: error

  # Hardened web bundle: self-hosted CanvasKit (no third-party CDN) + CSP-safe
  # loader. Same flags as `make build-web`.
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        # --enforce-lockfile fails if pubspec.lock drifted, so a release can't
        # silently pull a different (unvetted) dependency set than CI vetted.
        run: flutter pub get --enforce-lockfile

      # Same security gates CI runs on every push — a tag must not ship an
      # artifact that skipped them (pinned-bundle hash/OSV check, then the
      # hardened build + CSP/self-hosted-CanvasKit assertion).
      - name: Dependency CVE + bundle hash check (make deps-check)
        run: make deps-check

      - name: Build + verify web hardening (make check-web)
        run: make check-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ocideck-web
          path: build/web
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ocideck-macos
          path: build/macos/Build/Products/Release
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # `make` is not reliably present on the Windows runner, so call Flutter
      # directly (same convention as ci.yml's test-matrix).
      - name: Build Windows
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ocideck-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Linux desktop build toolchain (GTK, clang, ninja) — not present on the
      # runner by default.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: ocideck-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error
