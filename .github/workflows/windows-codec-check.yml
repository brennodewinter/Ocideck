# Windows helper evidence belongs on the build mirror; issues/PRs stay on Pawprint.
name: Windows codec matrix (manual)
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Ownership marker for this explicit codec probe
        required: true
        type: string
run-name: Windows codec matrix [operation:${{ inputs.operation_id }}]
permissions:
  contents: read
jobs:
  codecs:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compile production Media Foundation helper
        shell: pwsh
        run: |
          cmake -S native/audio_tools/probe -B build/codec-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/codec-probe --config Release
          exit $LASTEXITCODE
      - name: Probe codecs without a developer PATH
        shell: pwsh
        run: |
          python tool/codec_matrix/helper_probe.py build/codec-probe/Release/ocideck-audio.exe build/codec-probe/results.json
          exit $LASTEXITCODE
      - name: Preserve codec evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-codec-matrix
          path: build/codec-probe/results.json
          if-no-files-found: error
