# Draait de testsuite op Windows, één keer per week over main — als controle,
# niet als samenvoegpoort.
#
# ⚠️  Deze map draait alleen op de GitHub-spiegel. Forgejo leest
# `.forgejo/workflows/` en negeert `.github/`.
#
# **Waarom dit bestaat.** De testsuite zag Windows jarenlang alleen op een
# `v*`-tag (`ci.yml`, test-matrix) — en de lokale poort plus de Forgejo-poort
# draaien allebei op macOS. Drie releases op rij (v0.6.3 t/m v0.6.5) gingen er
# rood op uit: tests die een pad met `'${map.path}/bestand'` vergelijken
# terwijl de code met `p.join` joint, staan overal groen waar `/` het
# scheidingsteken is — en breken hier. Dezelfde klasse kostte v0.6.8 de
# Linux-gate (`mktemp -t` zonder X's). Die Linux-kant is inmiddels gedekt:
# `linux-gate.yml` op de forge draait de suite elke nacht, en
# `check_conventions.dart` weert beide schrijfwijzen bij de bron. Wat overbleef
# is de Windows-kant — geen enkele poort draait daar de suite behalve de
# tag-pijplijn, waar de breuk al op main staat.
#
# **Waarom wekelijks en niet per merge.** Eén volle suite-run per merge naar
# main is al eens afgewezen: op de forge kostte dat ~6,5 uur per dag op een
# capacity-1-runner voor nul gevonden regressies (#1123, zie linux-gate.yml).
# Op de GitHub-hosted runner kost het niets dan tijd, maar ook dáár zou een
# rode run per merge alleen de mail van de laatste commiter vullen — terwijl
# de schuldige wijziging evengoed binnen een week opvalt. Detectie hoeft niet
# bij de merge, alleen ruim vóór de volgende tag. `workflow_dispatch` blijft
# voor een tak die het eerder wil weten.
#
# **Geen artefact.** Een rode wekelijkse run blokkeert geen merge; het
# releasescript eist dezelfde suite op de exacte mergecommit vóór de tag.
name: Windows test suite (weekly)

on:
  schedule:
    # Maandag 06:47 UTC, achter de nachtelijke linux-gate (02:11) en de vroege
    # spiegelcontroles aan: de week begint met alle platformbreuken bekend in
    # plaats van verspreid.
    - cron: "47 6 * * 1"
  workflow_dispatch:
    inputs:
      navigation_only:
        description: Run document-navigation regressions and Windows profile comparison
        required: false
        default: false
        type: boolean
      video_only:
        description: Run Windows WebView2 focus and live player evidence
        required: false
        default: false
        type: boolean
      baseline_ref:
        description: Full baseline commit SHA for the navigation profile comparison
        required: false
        type: string
      operation_id:
        description: Ownership marker for cancellation and recovery
        required: false
        type: string

run-name: Windows test suite ${{ github.ref_name }}${{ inputs.operation_id && format(' [operation:{0}]', inputs.operation_id) || '' }}

# Deze workflow leest alleen; hij publiceert niets.
permissions:
  contents: read

jobs:
  test:
    name: Test (windows-2022)
    # Zelfde pin als de matrix in ci.yml en release.yml (#788): dartcv4 haalt
    # een voorgebouwd OpenCV-Windows-pakket op dat niet samengaat met de MSVC
    # op windows-latest. `flutter test` bouwt die laag niet, maar `pub get`
    # resolveert hem wel — houd de pin gelijk, los hem pas mee op als upstream
    # een pakket voor nieuwere MSVC's uitbrengt.
    runs-on: windows-2022
    # Run 39179149143 had alle 13.741 tests afgerond maar werd op de oude
    # 75-minutengrens tijdens de afronding geannuleerd. Geef ook een koude
    # cache en post-job-opruiming tijd om terminaal succes te melden.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Letterlijk, en dat is met opzet: `make check-toolchain` leest deze
          # regel en faalt zodra hij afwijkt van de pin in .tool-versions.
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Dezelfde aanroep als de test-matrix in ci.yml: de willekeurige volgorde
      # is opzet, de seed staat bovenin de log voor wie een breuk wil
      # reproduceren.
      - name: Test
        if: ${{ !inputs.navigation_only && !inputs.video_only }}
        shell: bash
        run: |
          # Begrens de belasting en schrijf ook bij een runnerbreuk bewijs.
          (
            while true; do
              powershell.exe -NoProfile -Command '$os = Get-CimInstance Win32_OperatingSystem; Write-Output ("Runner memory: free={0}MB total={1}MB" -f [math]::Round($os.FreePhysicalMemory / 1024), [math]::Round($os.TotalVisibleMemorySize / 1024)); Get-Process flutter_tester,dart -ErrorAction SilentlyContinue | Select-Object ProcessName,Id,WorkingSet64,CPU | Format-Table -AutoSize; exit 0'
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # Isoleer de terugkerende laatste testgroep vóór de volledige suite.
          flutter test --concurrency=1 test/shell_present_and_close_test.dart test/shell_s3_actions_test.dart
          flutter test --concurrency=2 --test-randomize-ordering-seed random --exclude-tags 'golden || benchmark'
          flutter test --concurrency=1 test/large_deck_performance_test.dart --tags benchmark

      - name: Navigation regressions
        if: ${{ inputs.navigation_only }}
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          [[ "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'baseline_ref must be a full commit SHA'; exit 1; }
          flutter test --concurrency=2 test/document_caret_across_modes_test.dart test/document_chapter_navigation_test.dart test/document_outline_caret_test.dart test/document_reader_test.dart test/paged_document_view_test.dart test/paged_document_search_test.dart test/paged_document_scaling_test.dart test/heading_anchors_test.dart

      - name: Checkout navigation baseline
        if: ${{ inputs.navigation_only }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          persist-credentials: false

      - name: Compare Windows profile before and after
        if: ${{ inputs.navigation_only }}
        shell: bash
        run: |
          mkdir -p baseline/integration_test baseline/test/support baseline/test_driver "$RUNNER_TEMP/document-navigation"
          cp integration_test/document_navigation_profile_test.dart baseline/integration_test/
          cp test/support/document_navigation_fixture.dart baseline/test/support/
          cp test_driver/document_navigation_driver.dart baseline/test_driver/
          (
            cd baseline
            flutter pub get --enforce-lockfile
            NAVIGATION_RESULT_FILE="$RUNNER_TEMP/document-navigation/baseline.json" flutter drive --profile -d windows --driver=test_driver/document_navigation_driver.dart --target=integration_test/document_navigation_profile_test.dart
          )
          NAVIGATION_RESULT_FILE="$RUNNER_TEMP/document-navigation/changed.json" flutter drive --profile -d windows --driver=test_driver/document_navigation_driver.dart --target=integration_test/document_navigation_profile_test.dart

      - name: Navigation measurements
        if: ${{ always() && inputs.navigation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: document-navigation-windows-${{ github.sha }}
          path: ${{ runner.temp }}/document-navigation
          if-no-files-found: warn

      - name: Windows video regressions
        if: ${{ inputs.video_only }}
        shell: bash
        run: |
          mkdir -p build/ci-diagnostics
          flutter test --concurrency=2 test/windows_webview_permissions_test.dart test/windows_webview_native_contracts_test.dart test/presenter_native_keys_test.dart test/media_previews_video_coverage_test.dart test/video_features_test.dart test/video_embed_host_test.dart 2>&1 | tee build/ci-diagnostics/windows-video-regressions.log

      - name: Native WebView2 and live YouTube probe
        if: ${{ inputs.video_only }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/windows-video"
          export VIDEO_RESULT_FILE="$RUNNER_TEMP/windows-video/results.json"
          flutter drive --profile -d windows --driver=test_driver/windows_video_driver.dart --target=integration_test/windows_video_navigation_test.dart 2>&1 | tee build/ci-diagnostics/windows-video-native.log

      - name: Windows video evidence
        if: ${{ always() && inputs.video_only }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-video-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-video
            build/ci-diagnostics
          if-no-files-found: warn
