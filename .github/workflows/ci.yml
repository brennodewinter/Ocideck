name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Least privilege: the default GITHUB_TOKEN grants far more than these jobs
# need. They only read the repo and upload build artifacts (which use the
# separate Actions runtime token, not GITHUB_TOKEN), so read-only is enough.
# A compromised dependency or action therefore can't push, open PRs, or edit
# issues with this token.
permissions:
  contents: read

jobs:
  # Canonical gate on Linux: formatting, analysis, the full suite with coverage,
  # licence compliance and the bundled-JS security check.
  gate:
    name: Gate (Linux) · Format · Analyze · Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the auth token in .git/config after checkout, where a
          # later step (or a compromised action) could reuse it.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Flutter version
        run: flutter --version

      # --enforce-lockfile fails if pubspec.lock is out of date, keeping the
      # dependency set reproducible (supply-chain hygiene).
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format check
        run: make format-check

      - name: Analyze
        run: make analyze

      - name: Conventions (make check-conventions)
        run: make check-conventions

      - name: Method length (make check-method-length)
        run: make check-method-length

      # Fail the build on orphaned lib/ files (unreachable from any entrypoint) —
      # the analyzer's blind spot for whole dead files.
      - name: Dead code (make check-dead-code)
        run: make check-dead-code

      # Runs the full suite with coverage and enforces a line-coverage floor.
      - name: Test + coverage (make coverage)
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      # Fail the build if any dependency is not open source.
      - name: Licence compliance (make licenses)
        run: make licenses

      # Fail the build if the committed SBOM (CycloneDX + SPDX) drifted from the
      # current dependency set — i.e. deps changed but `make sbom` wasn't re-run.
      # Keeps the CRA (Reg. (EU) 2024/2847) bill-of-materials artefact current.
      - name: SBOM up to date (make sbom-verify)
        run: make sbom-verify

      # Fail the build if a vendored JS bundle drifted from its manifest or a
      # pinned version has a known vulnerability (queries the OSV database).
      - name: Bundled JS security (make deps-check)
        run: make deps-check

  # The app ships on macOS, Windows and Linux, so run the suite on the other two
  # desktop platforms as well to catch platform-specific (path, Platform.isX)
  # regressions the Linux gate would miss. `make` isn't reliably present on the
  # Windows runner, so this calls Flutter directly.
  test-matrix:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # De beeldcontrole (herkenbare gezichten op dia-afbeeldingen) draait op
      # OpenCV via FFI. Die native bibliotheek zit in de app-bundel, niet in een
      # kale `flutter test` op de Dart-VM — dus zonder deze stap slaan de
      # detectietests zichzelf over en bewaken ze niets.
      #
      # Dat is geen theoretisch risico: tijdens de bouw stonden die tests één
      # keer groen terwijl de bibliotheek niet laadde, elke aanroep in de
      # foutafhandeling viel en de scanner nul gezichten meldde. Groen om de
      # verkeerde reden is erger dan rood.
      #
      # Alleen op macOS: één platform waar ze echt draaien volstaat om een
      # regressie in de detector te vangen, en een Linux-build zou GTK-pakketten
      # op de runner vragen voor dezelfde twee tests.
      - name: Build macOS (levert de OpenCV-bibliotheek aan de beeldtests)
        if: runner.os == 'macOS'
        run: |
          flutter build macos --debug
          LIB="$PWD/build/macos/Build/Products/Debug/DartCvMacOS/DartCvMacOS.framework/Versions/A/DartCvMacOS"
          # Hard falen in plaats van stilletjes terugvallen op overslaan: als een
          # nieuwe opencv_core dit pad verlegt, moet dat hier opvallen en niet
          # pas als iemand zich afvraagt waarom de detectietests nooit draaien.
          test -f "$LIB" || { echo "::error::OpenCV-bibliotheek niet op $LIB — pad gewijzigd?"; exit 1; }
          echo "DARTCV_LIB_PATH=$LIB" >> "$GITHUB_ENV"

      - name: Test
        run: flutter test --test-randomize-ordering-seed random --exclude-tags golden

  # Build the web bundle and assert it kept its hardening (strict CSP,
  # self-hosted CanvasKit, bundled UI font) — so a change can't silently
  # re-introduce a third-party origin or weaken the CSP.
  web-hardening:
    name: Web hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build + assert web hardening (make check-web)
        run: make check-web

  # Validate internal Markdown links (relative file links) across the repo.
  # --offline skips external URLs so the check can't flake on third-party sites.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true

  # Advisory supply-chain scan (Trivy): Dart-package CVEs from pubspec.lock plus
  # a committed-secret sweep. Scanners and scope live in trivy.yaml. Kept
  # advisory (exit-code 0) so it surfaces findings without blocking merges —
  # Dart/pub advisory coverage is still thin. Mirrors `make trivy` locally.
  supply-chain:
    name: Supply-chain (Trivy · advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "0"
