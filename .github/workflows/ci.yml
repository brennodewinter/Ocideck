# ⚠️  NO RUNNER EXECUTES THIS FILE.
#
# OciDeck's remote is a Forgejo instance with no Actions runner registered, so
# nothing here has ever run — not on push, not on a pull request, not on a tag.
# A green tick you do not see is not a check that passed; it is a check that
# never started. Treat this file as a *reference definition*: it says what the
# gate would be, and it is kept ready for a GitHub mirror or a future runner.
#
# **The real gate is `make check`, run locally before every merge.** It takes
# about three minutes (measured; see docs/CHECKS.md), so a contributor can run
# the same thing this file describes. `make check-full` adds the slow scans.
#
# Written here and not only in the docs because this is the file a contributor
# finds first — seeing `.github/workflows/` reasonably suggests the project
# lives on GitHub and that CI will check their work. Both are false, and
# discovering that after opening a pull request is a poor first experience
# (#592).

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Least privilege: the default GITHUB_TOKEN grants far more than these jobs
# need. They only read the repo and upload build artifacts (which use the
# separate Actions runtime token, not GITHUB_TOKEN), so read-only is enough.
# A compromised dependency or action therefore can't push, open PRs, or edit
# issues with this token.
permissions:
  contents: read

jobs:
  # Canonical gate on Linux: formatting, analysis, the full suite with coverage,
  # licence compliance and the bundled-JS security check.
  gate:
    name: Gate (Linux) · Format · Analyze · Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the auth token in .git/config after checkout, where a
          # later step (or a compromised action) could reuse it.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Flutter version
        run: flutter --version

      # --enforce-lockfile fails if pubspec.lock is out of date, keeping the
      # dependency set reproducible (supply-chain hygiene).
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format check
        run: make format-check

      - name: Analyze
        run: make analyze

      - name: Conventions (make check-conventions)
        run: make check-conventions

      - name: Privacy projection boundary (make check-audience-boundary)
        run: make check-audience-boundary

      - name: Method length (make check-method-length)
        run: make check-method-length

      # Fail the build on orphaned lib/ files (unreachable from any entrypoint) —
      # the analyzer's blind spot for whole dead files.
      - name: Dead code (make check-dead-code)
        run: make check-dead-code

      # Geheimen en SAST. Ze stonden alleen in `check-full`, dus zelfs de
      # *gedeclareerde* pijplijn draaide ze niet — en met vier configuratie-
      # bestanden in de wortel (.gitleaks.toml, .trufflehogignore,
      # semgrep/ocideck.yaml, zap/baseline.conf) leek het alsof ze erin zaten.
      # Op de dag dat er een runner komt, doen ze dat nu wel.
      #
      # Ze installeren hun eigen gereedschap: het zijn externe binaries, en dat
      # is precies de reden dat ze niet in `make check` zitten — die poort mag
      # niets aannemen wat niet in de repo staat.
      # Bewust géén marketplace-actions: die zouden gepind moeten worden en de
      # stapnaam zou liegen — `make check-secrets` draait gitleaks én
      # trufflehog. Dit installeert dezelfde binaries en roept dezelfde
      # make-doelen aan als lokaal, zodat CI en de werkbank niet uit elkaar
      # kunnen lopen.
      - name: Gereedschap voor de scanners
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          python3 -m pip install --quiet semgrep

      - name: Geheimenscan (make check-secrets)
        run: make check-secrets

      - name: SAST (make sast)
        run: make sast

      # De beeldcontrole draait op OpenCV via FFI, en die bibliotheek ontstaat
      # pas bij een platformbuild — zonder deze stap slaan de detectietests
      # zichzelf over en bewaken ze niets. De Makefile vindt de `.so` daarna
      # zelf in `build/` en zet DARTCV_LIB_PATH.
      - name: Linux-buildafhankelijkheden
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - name: Build Linux (levert de OpenCV-bibliotheek aan de beeldtests)
        run: |
          flutter build linux --debug
          # Hard falen in plaats van stilletjes terugvallen op overslaan: als een
          # nieuwe opencv_core dit pad verlegt, moet dat hier opvallen.
          LIB=$(ls build/linux/*/*/bundle/lib/libdartcv.so 2>/dev/null | head -1)
          test -n "$LIB" || { echo "::error::libdartcv.so niet gevonden onder build/linux — pad gewijzigd?"; exit 1; }
          echo "Gevonden: $LIB ($(du -h "$LIB" | cut -f1))"

      # Runs the full suite with coverage and enforces a line-coverage floor.
      - name: Test + coverage (make coverage)
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      # Fail the build if any dependency is not open source.
      - name: Licence compliance (make licenses)
        run: make licenses

      # Fail the build if the committed SBOM (CycloneDX + SPDX) drifted from the
      # current dependency set — i.e. deps changed but `make sbom` wasn't re-run.
      # Keeps the CRA (Reg. (EU) 2024/2847) bill-of-materials artefact current.
      - name: SBOM up to date (make sbom-verify)
        run: make sbom-verify

      # Fail the build if a vendored JS bundle drifted from its manifest or a
      # pinned version has a known vulnerability (queries the OSV database).
      - name: Bundled JS security (make deps-check)
        run: make deps-check

  # The app ships on macOS, Windows and Linux, so run the suite on the other two
  # desktop platforms as well to catch platform-specific (path, Platform.isX)
  # regressions the Linux gate would miss. `make` isn't reliably present on the
  # Windows runner, so this calls Flutter directly.
  test-matrix:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # De beeldcontrole (herkenbare gezichten op dia-afbeeldingen) draait op
      # OpenCV via FFI. Die native bibliotheek zit in de app-bundel, niet in een
      # kale `flutter test` op de Dart-VM — dus zonder deze stap slaan de
      # detectietests zichzelf over en bewaken ze niets.
      #
      # Dat is geen theoretisch risico: tijdens de bouw stonden die tests één
      # keer groen terwijl de bibliotheek niet laadde, elke aanroep in de
      # foutafhandeling viel en de scanner nul gezichten meldde. Groen om de
      # verkeerde reden is erger dan rood.
      #
      # Op alle drie de leverplatforms, en dat is het punt van OCIWACHT §13.8:
      # `opencv_core` declareert `ffiPlugin: true` voor linux/macos/windows en de
      # voorwaardelijke import kiest overal de echte implementatie — maar alleen
      # macOS was ooit aantoonbaar gedraaid. Linux gebeurt in de gate hierboven,
      # Windows hieronder. Windows loopt via CMake in plaats van CocoaPods, dus
      # een ander pad, maar dezelfde reden.
      - name: Build Windows (levert de OpenCV-bibliotheek aan de beeldtests)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          flutter build windows --debug
          LIB=$(ls build/windows/*/runner/*/dartcv.dll 2>/dev/null | head -1)
          test -n "$LIB" || { echo "::error::dartcv.dll niet gevonden onder build/windows — pad gewijzigd?"; exit 1; }
          echo "DARTCV_LIB_PATH=$(pwd)/$LIB" >> "$GITHUB_ENV"

      - name: Build macOS (levert de OpenCV-bibliotheek aan de beeldtests)
        if: runner.os == 'macOS'
        run: |
          flutter build macos --debug
          LIB="$PWD/build/macos/Build/Products/Debug/DartCvMacOS/DartCvMacOS.framework/Versions/A/DartCvMacOS"
          # Hard falen in plaats van stilletjes terugvallen op overslaan: als een
          # nieuwe opencv_core dit pad verlegt, moet dat hier opvallen en niet
          # pas als iemand zich afvraagt waarom de detectietests nooit draaien.
          test -f "$LIB" || { echo "::error::OpenCV-bibliotheek niet op $LIB — pad gewijzigd?"; exit 1; }
          echo "DARTCV_LIB_PATH=$LIB" >> "$GITHUB_ENV"

      - name: Test
        run: flutter test --test-randomize-ordering-seed random --exclude-tags golden

  # Build the web bundle and assert it kept its hardening (strict CSP,
  # self-hosted CanvasKit, bundled UI font) — so a change can't silently
  # re-introduce a third-party origin or weaken the CSP.
  web-hardening:
    name: Web hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build + assert web hardening (make check-web)
        run: make check-web

  # Validate internal Markdown links (relative file links) across the repo.
  # --offline skips external URLs so the check can't flake on third-party sites.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true

  # Advisory supply-chain scan (Trivy): Dart-package CVEs from pubspec.lock plus
  # a committed-secret sweep. Scanners and scope live in trivy.yaml. Kept
  # advisory (exit-code 0) so it surfaces findings without blocking merges —
  # Dart/pub advisory coverage is still thin. Mirrors `make trivy` locally.
  supply-chain:
    name: Supply-chain (Trivy · advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "0"
