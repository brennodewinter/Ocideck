# ⚠️  THIS FILE DOES NOT RUN ON THE FORGEJO REMOTE.
#
# Since 2026-07-23 the forge has a registered Actions runner, but Forgejo reads
# the first workflow directory that exists — `.forgejo/workflows/` — and that
# shadows this one. What actually runs there is `ci.yml` — `make
# check-no-coverage` on a `v*` tag (#790, #796): the same gate with the whole
# test suite, but without the coverage instrumentation, which was 74% of the
# wall clock on that runner. `linux-build.yml` builds the Linux bundle on
# demand. This file remains a *reference definition* kept ready for a GitHub
# mirror.
#
# **The real gate is `make check`, run locally before every merge.** It takes
# about three minutes (measured; see docs/CHECKS.md), so a contributor can run
# the same thing this file describes. `make check-full` adds the slow scans.
#
# Written here and not only in the docs because this is the file a contributor
# finds first — seeing `.github/workflows/` reasonably suggests the project
# lives on GitHub and that this exact CI will check their work. Both are false,
# and discovering that after opening a pull request is a poor first experience
# (#592).

name: CI

# Draait op een tag, niet op elke push of PR (#958). Dit was ooit `push:
# branches: ["**"]` + `pull_request:` — de hele zevendelige pijplijn op élke
# commit, ongeacht wat er wijzigde. Dat maakte deze spiegel een tweede
# faalmail-bron náást de forge, voor werk dat de forge al deed: de échte
# samenvoegpoort is `make check` op de machine van de committer, en de
# Forgejo-PR-poort (`.forgejo/workflows/scans.yml`) draait `check-secrets`/
# `sast` al op elke PR. Deze spiegel voegt daar per PR niets aan toe, alleen
# lasten. Zelfde keuze als `.forgejo/workflows/ci.yml` (#790): CI is een
# uitbrengpoort, geen samenvoegpoort. `workflow_dispatch` blijft, zodat een tak
# alsnog handmatig door de volledige pijplijn kan zonder een tag te zetten.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN grants far more than these jobs
# need. They only read the repo and upload build artifacts (which use the
# separate Actions runtime token, not GITHUB_TOKEN), so read-only is enough.
# A compromised dependency or action therefore can't push, open PRs, or edit
# issues with this token.
permissions:
  contents: read

jobs:
  # Canonical gate on Linux: formatting, analysis, the full suite with coverage,
  # licence compliance and the bundled-JS security check.
  gate:
    name: Gate (Linux) · Format · Analyze · Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Don't leave the auth token in .git/config after checkout, where a
          # later step (or a compromised action) could reuse it.
          persist-credentials: false
          # Zonder dit is de geheimenscan verderop theater. `actions/checkout`
          # kloont standaard één commit diep, terwijl `make check-secrets` twee
          # van zijn vier passes over de histórie doet (`gitleaks git .`,
          # `trufflehog git file://.`). Op een ondiepe kloon kijken die naar
          # bijna niets en melden groen — en het geval dat ze moeten vinden is
          # nu juist het geheim dat drie commits terug is toegevoegd en daarna
          # "verwijderd". Dezelfde reden als in .forgejo/workflows/scans.yml,
          # waar dit wél al stond.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Flutter version
        run: flutter --version

      # --enforce-lockfile fails if pubspec.lock is out of date, keeping the
      # dependency set reproducible (supply-chain hygiene).
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format check
        run: make format-check

      - name: Analyze
        run: make analyze

      - name: Conventions (make check-conventions)
        run: make check-conventions

      - name: Privacy projection boundary (make check-audience-boundary)
        run: make check-audience-boundary

      - name: Method length (make check-method-length)
        run: make check-method-length

      # Fail the build on orphaned lib/ files (unreachable from any entrypoint) —
      # the analyzer's blind spot for whole dead files.
      - name: Dead code (make check-dead-code)
        run: make check-dead-code

      # Geheimen en SAST. Ze stonden alleen in `check-full`, dus zelfs de
      # *gedeclareerde* pijplijn draaide ze niet — en met vier configuratie-
      # bestanden in de wortel (.gitleaks.toml, .trufflehogignore,
      # semgrep/ocideck.yaml, zap/baseline.conf) leek het alsof ze erin zaten.
      # Op de dag dat er een runner komt, doen ze dat nu wel.
      #
      # Ze installeren hun eigen gereedschap: het zijn externe binaries, en dat
      # is precies de reden dat ze niet in `make check` zitten — die poort mag
      # niets aannemen wat niet in de repo staat.
      # Bewust géén marketplace-actions: de stapnaam zou liegen — `make
      # check-secrets` draait gitleaks én trufflehog. (Hier stond ook "die
      # zouden gepind moeten worden"; dat argument is vervallen, want hieronder
      # wordt sowieso gepind.) Dit installeert dezelfde binaries en roept dezelfde
      # make-doelen aan als lokaal, zodat CI en de werkbank niet uit elkaar
      # kunnen lopen.
      #
      # Gepind en sha256-geverifieerd, precies zoals
      # `.forgejo/workflows/scans.yml` het doet (#799). Hier stond tot #800
      # `curl …/master/scripts/install.sh | sh` — willekeurige code van een
      # *bewegende aanwijzer*, ongeverifieerd uitgevoerd, die daarna een
      # ongepinde scanner neerzette. Twee dingen tegelijk mis: de download was
      # niet te vertrouwen, én "groen" betekende elke week iets anders dan de
      # week ervoor, zonder dat iemand iets wijzigde.
      #
      # De verificatie is tegen het gepubliceerde release-manifest. Dat vangt een
      # beschadigde of onderweg gewijzigde download; het is geen bewijs over de
      # uitgever, want het manifest komt van diezelfde uitgever.
      #
      # De `test -n "$SHA"` in elke stap blijft staan, maar om een preciezere
      # reden dan "anders slaagt het stil". Nagemeten met GNU coreutils 9.5
      # (Ubuntu 24.04 draait 9.4, dezelfde codebasis): een lege treffer laat
      # `sha256sum -c -` níet met exit 0 doorlopen — hij meldt "no properly
      # formatted checksum lines found" en eindigt op 1. Het vangnet zit er dus
      # al.
      #
      # Wat de regel wél doet, is de faalreden leesbaar houden. Zonder hem
      # struikelt de stap over de *invoer van sha256sum*, en wie dat leest gaat
      # de verificatie debuggen terwijl er in werkelijkheid een release-asset
      # hernoemd is. Eén regel om te voorkomen dat een correcte controle als een
      # kapotte controle overkomt.
      #
      # De drie versies staan gelijk aan die in `scans.yml`: dezelfde scanners
      # horen hetzelfde te oordelen, ongeacht welke forge de workflow leest.
      # Anders dan daar staat elke pin in het `env`-blok van zijn eigen stap en
      # niet in één blok bovenaan de taak — die taak scant hier niet alléén, en
      # een pin tachtig regels van zijn download vandaan wordt bij een bump de
      # ene helft die je vergeet.
      # `haal`: dezelfde curl, maar met een paar herkansingen. Deze twee stappen
      # halen een release van github.com, en die verbinding valt af en toe om —
      # de poort strandde er twee keer op met curl-code 35 (TLS-handshake), tien
      # minuten werk verderop en zonder dat er iets met de code mis was. Een
      # faalmail voor een netwerkhikje leert niemand iets, en het maakt de mails
      # die er wél toe doen minder geloofwaardig.
      #
      # Dit verzwakt de pin niet: wát er binnenkomt wordt onveranderd tegen de
      # sha256 uit het checksums-bestand gelegd. Alleen het aantal pogingen om
      # het binnen te krijgen verandert.
      - name: gitleaks volgens de pin
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          haal() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 -o "$1" "$2"
          }
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          haal "/tmp/$ARCHIVE" "$BASE/$ARCHIVE"
          haal /tmp/gitleaks_checksums.txt \
            "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          SHA=$(awk -v f="$ARCHIVE" '$2 == f { print $1 }' /tmp/gitleaks_checksums.txt)
          test -n "$SHA"
          echo "$SHA  /tmp/$ARCHIVE" | sha256sum -c -
          tar -xzf "/tmp/$ARCHIVE" -C /usr/local/bin gitleaks
          rm "/tmp/$ARCHIVE"
          gitleaks version

      # `haal`: zie de toelichting bij de gitleaks-stap hierboven.
      - name: trufflehog volgens de pin
        env:
          TRUFFLEHOG_VERSION: 3.96.0
        run: |
          set -euo pipefail
          haal() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 -o "$1" "$2"
          }
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          ARCHIVE="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          haal "/tmp/$ARCHIVE" "$BASE/$ARCHIVE"
          haal /tmp/trufflehog_checksums.txt \
            "$BASE/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          SHA=$(awk -v f="$ARCHIVE" '$2 == f { print $1 }' /tmp/trufflehog_checksums.txt)
          test -n "$SHA"
          echo "$SHA  /tmp/$ARCHIVE" | sha256sum -c -
          tar -xzf "/tmp/$ARCHIVE" -C /usr/local/bin trufflehog
          rm "/tmp/$ARCHIVE"
          trufflehog --version

      # Semgrep komt van PyPI en niet als losse tarball. Een venv omdat de
      # runner-image op Ubuntu 24.04 staat en systeem-pip daar afgeschermd is
      # (PEP 668) — `python3 -m pip install semgrep` breekt daarop, nog vóór de
      # vraag naar een versie. De versie is gepind; de transitieve
      # afhankelijkheden zijn dat NIET — hash-pinnen zou een eigen
      # requirements-bestand met honderden hashes vragen, en dat onderhouden is
      # een grotere belofte dan hier waargemaakt wordt. Bewust genoteerd in
      # plaats van stil gelaten.
      - name: semgrep volgens de pin
        env:
          SEMGREP_VERSION: 1.173.0
        run: |
          set -euo pipefail
          python3 -m venv /opt/semgrep-venv
          /opt/semgrep-venv/bin/pip install --quiet --no-input \
            "semgrep==${SEMGREP_VERSION}"
          echo "/opt/semgrep-venv/bin" >> "$GITHUB_PATH"
          /opt/semgrep-venv/bin/semgrep --version

      - name: Geheimenscan (make check-secrets)
        run: make check-secrets

      - name: SAST (make sast)
        run: make sast

      # De beeldcontrole (herkenbare gezichten op dia-afbeeldingen) draait op de
      # native OpenCV-laag van dartcv4 2.x. Die laadt niet onder `flutter test` op
      # de Dart-VM, dus de échte native-toets is de integratietest hieronder — die
      # draait de app op een echt Linux-platform, waar de native-assets wél laden.
      #
      # dartcv4 2.x levert OpenCV via native-assets build-hooks (CMake): de hook
      # draait CMake bij élke flutter build, dus cmake moet op de runner staan.
      # xvfb geeft de headless runner een X-display voor de desktop-app.
      #
      # libsecret-1-dev levert de pkg-config `libsecret-1` die
      # flutter_secure_storage_linux in zijn CMakeLists hard opeist
      # (`pkg_check_modules(LIBSECRET REQUIRED IMPORTED_TARGET libsecret-1>=0.18.4)`).
      # Zonder dit pakket faalt `flutter build linux` al bij het genereren van de
      # buildbestanden — nog vóór er iets gecompileerd wordt.
      - name: Linux-buildafhankelijkheden
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev xvfb

      # Bouwt de Linux-app (met de OpenCV-modules uit pubspec) én oefent de native
      # gezichtsscan uit: de detector moet beschikbaar zijn, katten/logo's nul
      # gezichten geven en een verminkte JPEG fail-closed zijn. Dit is de plek waar
      # een regressie zoals de kapotte objdetect-build (#898) op Linux opvalt.
      - name: Native-scan integratietest (Linux)
        run: xvfb-run -a flutter test integration_test/native_face_scan_test.dart -d linux

      # Runs the full suite with coverage and enforces a line-coverage floor.
      - name: Test + coverage (make coverage)
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      # Fail the build if any dependency is not open source.
      - name: Licence compliance (make licenses)
        run: make licenses

      # Fail the build if the committed SBOM (CycloneDX + SPDX) drifted from the
      # current dependency set — i.e. deps changed but `make sbom` wasn't re-run.
      # Keeps the CRA (Reg. (EU) 2024/2847) bill-of-materials artefact current.
      - name: SBOM up to date (make sbom-verify)
        run: make sbom-verify

      # Fail the build if a vendored JS bundle drifted from its manifest or a
      # pinned version has a known vulnerability (queries the OSV database).
      - name: Bundled JS security (make deps-check)
        run: make deps-check

  # The app ships on macOS, Windows and Linux, so run the suite on the other two
  # desktop platforms as well to catch platform-specific (path, Platform.isX)
  # regressions the Linux gate would miss. `make` isn't reliably present on the
  # Windows runner, so this calls Flutter directly.
  test-matrix:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Bewust windows-2022 en niet windows-latest, exact zoals de Windows-job
        # in release.yml (#788): dartcv4 (de OpenCV-laag onder de privacyscanner)
        # haalt een voorgebouwd OpenCV-Windows-pakket op waarvan de binaries niet
        # samengaan met de nieuwste MSVC op het latest-image ("Found OpenCV
        # Windows Pack but it has no binaries compatible with your
        # configuration"). Op het 2022-image staat de MSVC waarvoor dat pakket
        # gebouwd is. Los deze pin pas wanneer upstream dartcv een pakket voor
        # nieuwere MSVC's uitbrengt — dat pad (migratie naar dartcv4 2.x) is
        # afzonderlijk getrackt.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # De beeldcontrole draait op de native OpenCV-laag van dartcv4 2.x, en die
      # laadt niet onder `flutter test` op de Dart-VM. De échte native-toets is de
      # integratietest, die de app op dít platform draait — waar de native-assets
      # wél laden. Zij ving de kapotte objdetect-build (#898) die de kale unit-test
      # niet kon zien; zie OCIWACHT §13.8. De integratietest bouwt de app zelf, dus
      # dit is meteen de compile-rooktoets voor macOS/Windows.
      - name: Native-scan integratietest (macOS)
        if: runner.os == 'macOS'
        run: flutter test integration_test/native_face_scan_test.dart -d macos

      - name: Native-scan integratietest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: flutter test integration_test/native_face_scan_test.dart -d windows

      - name: Test
        run: flutter test --test-randomize-ordering-seed random --exclude-tags golden

  # Build the web bundle and assert it kept its hardening (strict CSP,
  # self-hosted CanvasKit, bundled UI font) — so a change can't silently
  # re-introduce a third-party origin or weaken the CSP.
  web-hardening:
    name: Web hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build + assert web hardening (make check-web)
        run: make check-web

  # Validate internal Markdown links (relative file links) across the repo.
  # --offline skips external URLs so the check can't flake on third-party sites.
  # --exclude-path third_party laat de vendored pakketten met rust: hun README's
  # zijn byte-identiek aan upstream (bewaakt door hun MODIFICATIONS.md) en
  # verwijzen soms naar mappen die wij bewust niet meevendorden (bv. `example`).
  # Die links repareren zou de byte-identieke invariant breken; onze docs-poort
  # hoort onze eigen documentatie te controleren, niet upstream-tekst.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path third_party "./**/*.md"
          fail: true

  # Advisory supply-chain scan (Trivy): Dart-package CVEs from pubspec.lock plus
  # a committed-secret sweep. Scanners and scope live in trivy.yaml. Kept
  # advisory (exit-code 0) so it surfaces findings without blocking merges —
  # Dart/pub advisory coverage is still thin. Mirrors `make trivy` locally.
  supply-chain:
    name: Supply-chain (Trivy · advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "0"
